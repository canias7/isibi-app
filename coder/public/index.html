  <!-- THE WHOLE APP (2026-11-05, the owner: "delete everything except the new
       coder we are building"): sign in, then Coder. -->
  <main class="gf-main">
    <section class="gf-gate" id="gfGate" hidden>
      <form class="gf-card" id="gfForm" novalidate>
        <div class="gf-cardbrand"><span class="gf-logo" aria-hidden="true">GF</span><b>Go Farther</b><span class="gf-tag">Coder</span></div>
        <h1 id="gfTitle">Sign in</h1>
        <p class="gf-sub" id="gfSub">Coder works on your code in your own GitHub.</p>
        <div id="gfStep1">
          <label>Email<input type="email" id="gfMail" autocomplete="email" required /></label>
          <label>Password<input type="password" id="gfPw" autocomplete="current-password" minlength="6" required /></label>
        </div>
        <div id="gfStep2" hidden>
          <label>The code we emailed you<input type="text" id="gfCode" inputmode="numeric" autocomplete="one-time-code" maxlength="10" /></label>
        </div>
        <p class="gf-msg" id="gfMsg" role="alert"></p>
        <button type="submit" class="gf-go" id="gfGo">Continue</button>
        <button type="button" class="gf-switch" id="gfSwitch">New here? Create an account</button>
      </form>
    </section>
    <div class="gf-shell" id="gfShell" hidden>
      <!-- THE LEFT SIDE, LIKE THE CLAUDE APP (owner, 2026-11-05: "yes like this"):
           a rail with the agents, then the open agent's column: New chat,
           Repositories, Recents (its chats, each its own session), and the
           account at the bottom. -->
      <div class="gf-sidewrap" id="gfSideWrap">
        <nav class="gf-rail" aria-label="Agents">
          <button type="button" class="gf-tab" data-agent="coder" title="Coder" aria-label="Coder"><span class="gf-av gf-av-coder" aria-hidden="true">&#x1F4BB;</span></button>
          <button type="button" class="gf-tab" data-agent="gloopy" title="Gloopy agent" aria-label="Gloopy agent"><span class="gf-av gf-av-gloopy" id="gfTabGloopy" aria-hidden="true"></span></button>
        </nav>
        <div class="gf-col">
          <div class="gf-colbrand"><span class="gf-logo" aria-hidden="true">GF</span><b id="gfAgentName">Coder</b></div>
          <div class="gf-coltools" id="gfColTools"></div>
          <div class="gf-rec">Recents</div>
          <div class="gf-recents" id="gfRecents"></div>
          <div class="gf-me">
            <span class="gf-meav" id="gfMeAv">?</span>
            <span class="gf-mename" id="gfEmail"></span>
            <button type="button" class="gf-gear" id="gfGear" aria-label="Account" aria-haspopup="menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg></button>
            <div class="gf-menu" id="gfMenu" role="menu" hidden><span class="gf-menu-mail" id="gfMenuMail"></span><button type="button" role="menuitem" id="gfOut">Sign out</button></div>
          </div>
        </div>
      </div>
      <div class="gf-scrim" id="gfScrim"></div>
      <section class="gf-app" id="gfApp"></section>
      <section class="gf-soon" id="gfSoon" hidden>
        <div class="gf-soon-fig" id="gfSoonFig"></div>
        <b>Gloopy agent</b>
        <p>Coming soon.</p>
      </section>
    </div>
  </main>

  <script src="/auth.js" defer></script>
  <script src="/gloopy.js" defer></script>
  <script src="/coder.js" defer></script>
  <script src="/app.js" defer></script>

</html>
