# Where is the build wall, and which kind is it? See scripts/wall-probe.mjs.
#
# NO MARKER GATE, because it spends nothing: `/api/_slow` sleeps and returns —
# no model call, no Neon project, no container, no ledger. The only cost is
# runner wall-clock, which is why the timeout is generous rather than tight.
#
# It DOES need the deploy that carries `/api/_slow`, so it waits for it the same
# way build-as-owner does.
name: wall probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wall-probe.yml'
      - 'scripts/wall-probe.mjs'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    # The default is three modes: `burn` and `sub` each sweep four durations to
    # their own ceiling (240+300+360+420 = 22 minutes apiece if nothing stops
    # them) and `mem` is seconds. Plus the deploy wait, so the worst case is
    # around 50 minutes. Bounded well above that, because a cancelled job
    # reports NOTHING and this probe's whole value is its answer.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: wait for this push's deploy
        run: |
          # ASK deploy.yml FOR ITS OWN RUNS — see build-as-owner.yml's copy of
          # this block for why. A find-by-name over `actions/runs?head_sha=`
          # silently stops finding the deploy once a push fires more workflows
          # than fit on one page.
          for i in $(seq 1 40); do
            state=$(curl -sf "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/runs?head_sha=${{ github.sha }}&per_page=1" \
              | node -e 'let s="";process.stdin.on("data",(c)=>s+=c).on("end",()=>{const d=JSON.parse(s);const r=(d.workflow_runs||[])[0];console.log(r?r.status+"/"+r.conclusion:"none");})') || state=err
            echo "deploy: $state (poll $i)"
            case "$state" in
              completed/success) exit 0 ;;
              completed/*) echo "the deploy failed — /api/_slow will not be there"; exit 1 ;;
            esac
            sleep 15
          done
          echo "deploy never finished in 10 minutes"; exit 1
      - name: find the wall
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          OWNER_EMAIL: aniascristian@gmail.com
          OWNER_BASE_URL: https://gofarther.dev
        run: node scripts/wall-probe.mjs
