# Throwaway A/B run: same 25 prompts at max_tokens 16k vs 32k, NON-STREAMING (no timeout), compile on.
# Triggers on push to the eval-ab-run branch (the manual pipeline-eval.yml can't be dispatched via the API).
# Answers: with the timeout removed, does a bigger cap actually reduce truncation? Delete the branch when done.
name: eval-ab

on:
  push:
    branches: [eval-ab-run]

jobs:
  eval-ab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Scaffold the build service
        run: |
          set -e
          mkdir -p /tmp/buildapp
          cp builder/package.json /tmp/buildapp/
          cp -r builder/template/. /tmp/buildapp/
          cd /tmp/buildapp
          npm install --no-audit --no-fund --loglevel=error
          npx playwright install --with-deps chromium || echo "WARN: chromium install failed (build-only, fine)"

      - name: Start the build service
        run: |
          APP_DIR=/tmp/buildapp PORT=8080 node builder/build-server.mjs > /tmp/build-server.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8080/health && break || sleep 0.5; done
          echo "build service up"

      - name: Run the A/B eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_COMPARE: "1"
          EVAL_CAPS: "16000,32000"
          EVAL_LIMIT: "0"
          EVAL_BUILD: "1"
          EVAL_VISION: "0"
          EVAL_REPAIR: "0"
          BUILD_URL: "http://127.0.0.1:8080"
        run: node test/pipeline-eval.mjs
