name: list old stuff

# READ ONLY (2026-11-05). Lists what is left of the old website builder, so the
# owner sees the exact list before anything is deleted. It deletes nothing.

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Cloudflare Workers
        run: |
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" | jq -r '.result[] | "worker  " + .id'
      - name: Customer site Workers (namespace gofarther-sites)
        run: |
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/dispatch/namespaces/gofarther-sites/scripts" | jq -r '.result[]? | "site-worker  " + .id' || echo "(none, or no namespace)"
      - name: R2 buckets, KV stores, queues, containers
        run: |
          W="npx --yes wrangler@4.107.0"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets?per_page=1000" | jq -r '.result.buckets[] | "r2  " + .name'
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces?per_page=100" | jq -r '.result[] | "kv  " + .id + "  " + .title'
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/queues" | jq -r '.result[]? | "queue  " + .queue_name' || true
          $W containers list 2>/dev/null | head -n 40 || true
      - name: Neon projects
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          if [ -z "$NEON_API_KEY" ]; then echo "(no NEON_API_KEY secret)"; exit 0; fi
          H="Authorization: Bearer $NEON_API_KEY"
          # Neon asks which organisation; list each one's projects (and the personal ones).
          orgs=$(curl -sS -H "$H" "https://console.neon.tech/api/v2/users/me/organizations" | jq -r '.organizations[]?.id' || true)
          echo "organisations: ${orgs:-none}"
          for o in "" $orgs; do
            q=""; [ -n "$o" ] && q="&org_id=$o"
            out=$(curl -sS -H "$H" "https://console.neon.tech/api/v2/projects?limit=100$q")
            echo "$out" | jq -r '.projects[]? | "neon  " + .id + "  " + .name + "  " + .created_at' 2>/dev/null || true
            echo "$out" | jq -r 'select(.message) | "  (" + .message + ")"' 2>/dev/null || true
          done
      # LEFTOVERS OUTSIDE WORKERS (2026-11-06, the audit): model.gofarther.dev, an
      # open AI model server, survived the cleanup because DNS records and tunnels
      # were never listed. Still read only: it prints, it changes nothing.
      - name: DNS records of gofarther.dev, and Cloudflare tunnels
        run: |
          API=https://api.cloudflare.com/client/v4
          H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          ZONE=$(curl -fsS -H "$H" "$API/zones?name=gofarther.dev" | jq -r '.result[0].id')
          curl -fsS -H "$H" "$API/zones/$ZONE/dns_records?per_page=500" | jq -r '.result[] | "dns  " + .type + "  " + .name + "  " + (.content | tostring | .[0:80]) + "  proxied=" + (.proxied | tostring)'
          curl -fsS -H "$H" "$API/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel?is_deleted=false&per_page=100" | jq -r '.result[] | "tunnel  " + .id + "  " + .name + "  " + (.status // "") + "  connections=" + ((.connections // []) | length | tostring)' || echo "(tunnels: this token cannot read them)"
      - name: Which Workers mention model.gofarther.dev or the old Supabase project (yes or no only)
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts"
          H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          for w in $(curl -fsS -H "$H" "$API" | jq -r '.result[].id'); do
            text=$( { curl -fsS -H "$H" "$API/$w/content/v2" || curl -fsS -H "$H" "$API/$w" || true; curl -fsS -H "$H" "$API/$w/settings" | jq -r '.result.bindings[]? | select(.type == "plain_text") | .text' || true; } 2>/dev/null )
            m=no; s=no
            printf '%s' "$text" | grep -q 'model\.gofarther\.dev' && m=yes
            printf '%s' "$text" | grep -q 'lkpfeqrelvziltfwpuxi' && s=yes
            echo "worker $w: model.gofarther.dev=$m  gofarther-ai-supabase=$s"
          done
      - name: GitHub branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/branches?per_page=100" --jq '.[].name' | sed 's/^/branch  /'
