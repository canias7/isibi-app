name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The Worker imports @cf-wasm/photon (server-side image watermarking);
      # install deps so wrangler can bundle it at deploy.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.107.0"
          secrets: |
            FAL_KEY
            ANTHROPIC_API_KEY
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Payment secrets are optional: uploaded only once they exist in the
      # repo settings, so deploys keep working before Stripe is set up.
      - name: Upload payment secrets (if configured)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          CREDITS_MINT_SECRET: ${{ secrets.CREDITS_MINT_SECRET }}
        run: |
          for s in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET CREDITS_MINT_SECRET; do
            v="${!s}"
            if [ -n "$v" ]; then
              printf '%s' "$v" | npx wrangler@4.107.0 secret put "$s"
              echo "uploaded $s"
            else
              echo "skipping $s (not set)"
            fi
          done
