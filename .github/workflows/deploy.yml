name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the deploy only reads the repo; Cloudflare auth is via secrets,
# not GITHUB_TOKEN. Stops a compromised action in the job from writing to the repo.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The Worker imports @cf-wasm/photon (server-side image watermarking);
      # install deps so wrangler can bundle it at deploy.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      # All Worker secrets are uploaded through wrangler-action as part of the
      # deploy. A standalone `wrangler secret put` after the deploy fails on this
      # account with "the latest version of your Worker isn't currently deployed"
      # (Cloudflare's versioned-deployments guard) — doing it inside the deploy
      # step, which deploys first, avoids that. SUPABASE_SERVICE_KEY lets the
      # Stripe webhook call add_credits (REVOKEd from anon/authenticated on the DB).
      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.107.0"
          secrets: |
            FAL_KEY
            ANTHROPIC_API_KEY
            GEMINI_API_KEY
            STRIPE_SECRET_KEY
            STRIPE_WEBHOOK_SECRET
            CREDITS_MINT_SECRET
            SUPABASE_SERVICE_KEY
            COMPOSIO_API_KEY
            CF_ACCOUNT_ID
            CF_D1_API_TOKEN
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Website Builder engine (Gemini = design pass; Opus = architecture).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          CREDITS_MINT_SECRET: ${{ secrets.CREDITS_MINT_SECRET }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          # Layer-2 per-site backend: provision + query each built site's own D1
          # database via the Cloudflare REST API. CF_ACCOUNT_ID reuses the existing
          # account secret; CF_D1_API_TOKEN is a dedicated token scoped to D1:Edit.
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          # PENDING: built-app visitor password-reset emails send through Go Farther.
          # To enable, add a GitHub Actions secret GO_FARTHER_API_KEY (the same
          # gf_live_… key used by the Supabase send-email function), then add
          # `GO_FARTHER_API_KEY` back to the `secrets:` list above AND uncomment the
          # env line below. Until then the reset endpoints work but no email is sent.
          # GO_FARTHER_API_KEY: ${{ secrets.GO_FARTHER_API_KEY }}
