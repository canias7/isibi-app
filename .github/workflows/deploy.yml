name: Deploy to Cloudflare

on:
  push:
    branches: [main]
    # A DOCS-ONLY COMMIT COSTS A PAID BUILD, and that is what this stops.
    #
    # The chain is push → Deploy → `build smoke`, and `build smoke` spends two
    # real model calls plus a Neon project on every run. Measured over one
    # stretch of this session: three commits that touched nothing but CLAUDE.md
    # and docs/ each deployed an identical Worker and then paid for a full
    # site build to prove it still worked.
    #
    # Nothing here is served or bundled. `docs/components.md` is GENERATED from
    # the kit by `builder/gen-components-doc.mjs` and read by nobody at
    # runtime, and the Worker has no filesystem, so it cannot read a `.md` at
    # all. `unit tests` still runs on every push with no path filter, so the
    # drift guards that read GENERATOR.md are unaffected.
    #
    # The cost of being wrong: a commit that puts real configuration in a `.md`
    # would silently stop deploying. `test/deploy-secrets.test.mjs` asserts
    # nothing in the deploy path references one.
    # A HARNESS OR A TEST IS NOT DEPLOYED EITHER (2026-09-03). Nothing under
    # `test/` or `scripts/` is imported by the Worker or COPYed into either
    # container image — `test/deploy-secrets.test.mjs` asserts both — and
    # every deploy rolls the build container, which costs twenty minutes
    # before anything that builds may be fired. Measured the night this was
    # added: a harness-only fix had to reach main after three runs kept being
    # dispatched from there, and the push that carried it deployed an
    # identical Worker, rolled the container, and pushed the retest back by
    # half an hour. The scripts the DEPLOY itself runs live in
    # `.github/scripts/`, which is deliberately not listed here. The list
    # below stays contiguous: the guard reads it as one block.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'test/**'
      - 'scripts/**'
  workflow_dispatch:

# Least privilege: the deploy only reads the repo; Cloudflare auth is via secrets,
# not GITHUB_TOKEN. Stops a compromised action in the job from writing to the repo.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The Worker imports @cf-wasm/photon (server-side image watermarking);
      # install deps so wrangler can bundle it at deploy.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      # ── THE BUILD QUEUE MUST EXIST BEFORE ANYTHING BINDS TO IT ──────────────
      #
      # A binding naming a resource this account does not hold FAILS THE WHOLE
      # DEPLOY — not the feature, the deploy — which is how three consecutive
      # merges shipped nothing on 2026-08-07 while the error named an unrelated
      # secret. The Worker route did the same thing on a zone with no Cloudflare
      # for SaaS. So the resource is created here, one step before the deploy
      # that will eventually reference it.
      #
      # WHY A BUILD NEEDS A QUEUE AT ALL (2026-08-23, measured): the build runs
      # inside the HTTP request and survives a dropped connection only through
      # `ctx.waitUntil`, which Cloudflare documents as **30 seconds** — "if any
      # Promises have not settled after 30 seconds, they are canceled". A build
      # takes 6-12 minutes. Every build we have ever run has had its connection
      # reset mid-flight (264-549s, seven instances); the ones that published
      # did so because the reset happened at a hop Cloudflare did not see, not
      # because `waitUntil` carried them. A queue consumer gets 15 minutes of
      # guaranteed runtime that does not care whether anybody is still watching.
      #
      # NEVER FAILS THE DEPLOY. Creating a queue that already exists is an error
      # from wrangler and a no-op in fact, so the ordinary steady state would
      # otherwise take the platform down every push. The verdict is PRINTED
      # instead — loudly, because the one failure that matters here is a token
      # without Queues permission, which looks identical to success from a
      # silent `|| true` and would only surface later as a broken deploy.
      - name: ensure the build queue exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          out=$(npx --yes wrangler@4.107.0 queues create site-builds 2>&1) || true
          echo "$out"
          if echo "$out" | grep -qiE "created queue|already exists"; then
            echo "QUEUE OK — site-builds exists"
          else
            echo "QUEUE NOT CONFIRMED — do NOT add a queue binding until this line reads OK."
            echo "The likeliest cause is CLOUDFLARE_API_TOKEN lacking the Queues edit"
            echo "permission; add it at Cloudflare > My Profile > API Tokens."
          fi
      # ── THE CONTAINER IMAGES ARE BUILT ONLY WHEN THEIR INPUTS CHANGED ────────
      #
      # (owner, 2026-09-04: "Ok yeah lets do that"). With a Dockerfile path in
      # `wrangler.jsonc`, the deploy step below builds and pushes BOTH images on
      # every push — 14 and 15 minutes measured today on two pushes that changed
      # nothing under either Dockerfile — and a pushed image rolls the container,
      # which is the twenty-minute hold after every deploy before anything that
      # builds may be fired. The registry push is also where both of today's
      # deploy failures happened.
      #
      # So this step derives each image's id from the git objects the Dockerfile
      # COPYs (plus the Dockerfile and its .dockerignore), builds and pushes the
      # image only when that tag is not in the registry yet, and rewrites the
      # CHECKOUT's wrangler.jsonc to reference `<name>:<id>` — Wrangler expands a
      # bare reference to this account's registry, and a deploy that references
      # an image builds nothing and rolls nothing unless the reference moved. The
      # repository's own config keeps the Dockerfile paths. Every decision is in
      # .github/scripts/container-images.mjs, driven in the unit suite.
      #
      # WRANGLER_VERSION MUST EQUAL wranglerVersion BELOW — the same CLI that
      # lists and pushes must be the one that deploys; test/container-images
      # asserts the two spell the same number.
      - name: container images (built only when their inputs changed)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_VERSION: "4.107.0"
        run: node .github/scripts/container-images.mjs
      # All Worker secrets are uploaded through wrangler-action as part of the
      # deploy. A standalone `wrangler secret put` after the deploy fails on this
      # account with "the latest version of your Worker isn't currently deployed"
      # (Cloudflare's versioned-deployments guard) — doing it inside the deploy
      # step, which deploys first, avoids that. SUPABASE_SERVICE_KEY lets the
      # Stripe webhook call add_credits (REVOKEd from anon/authenticated on the DB).
      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.107.0"
          secrets: |
            FAL_KEY
            ANTHROPIC_API_KEY
            STRIPE_SECRET_KEY
            STRIPE_WEBHOOK_SECRET
            CREDITS_MINT_SECRET
            SUPABASE_SERVICE_KEY
            COMPOSIO_API_KEY
            NEON_API_KEY
            SITE_SECRETS_KEY
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
            DOMAIN_CONNECT_KEY
            XAI_API_KEY
            EDIT_ASYNC
            EDIT_ASYNC_CANARY
            EDIT_ASYNC_EVERYONE
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # REQUIRED FROM 2026-08-22, AND THE FALLBACK IS GONE. It carried
          # `|| 'not-a-key'` while grok was a third option nobody defaulted to —
          # correct then, and wrong the moment `DEFAULT_PICKER` became `grok`.
          #
          # The old comment argued the fallback made grok "fail at the provider
          # with a named 401 rather than a mystery". As the DEFAULT that is not a
          # graceful degradation, it is every build on the platform failing while
          # the deploy reports success — which is precisely the state Anthropic
          # running dry put us in, and it took a session to notice. The rule
          # test/deploy-secrets.test.mjs enforces exists for this: a fallback on a
          # required secret turns "the deploy stops" into "the platform ships with
          # a broken credential".
          #
          # THE COST, STATED: an unset XAI_API_KEY now fails the WHOLE deploy —
          # the 2026-08-07 failure that lost three merges, with an error naming a
          # feature the change never touched. Safe to accept because the key is
          # PROVEN SET, not assumed: four live builds (runs 6, 8, 9 and 10)
          # reached Grok and were charged for it. The masked `***` in the log was
          # never the proof and still is not.
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          # Website Builder engine (Gemini = design pass; Opus = architecture).
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          CREDITS_MINT_SECRET: ${{ secrets.CREDITS_MINT_SECRET }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          # Layer-2 per-site backend: provision + query each built site's own
          # Postgres database on Neon. One Neon PROJECT per Go Farther user (created
          # lazily on their first publish), one DATABASE inside it per site.
          # Replaced Cloudflare D1 on 2026-07-27 — see the shim in worker.js.
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          # Encrypts each SHOP OWNER's own Stripe key before it is stored in
          # their site's Neon database (`_secrets`). Deliberately its OWN secret
          # rather than deriving from SUPABASE_SERVICE_KEY, which is what
          # site-secrets.mjs falls back to when this is unset: that fallback
          # works, but it couples the vault to the database credential, so
          # rotating SUPABASE_SERVICE_KEY would make every stored payment key
          # undecryptable — silently, with every shop's checkout failing and
          # nothing pointing at the cause.
          #
          # Generate with `openssl rand -hex 32`. Safe to add at any time: the
          # ciphertext carries its key version, so rows written under the old
          # derivation keep opening while new ones use this. UNSET IS ALSO SAFE
          # — an empty value is falsy, site-secrets.mjs sees no v2 material and
          # writes v1. What is NOT safe is changing it once secrets exist under
          # it; that strands them, and there is no recovery but re-pasting keys.
          SITE_SECRETS_KEY: ${{ secrets.SITE_SECRETS_KEY }}
          # CUSTOM DOMAINS. The same token wrangler already deploys with, now
          # also uploaded TO the Worker so it can call the Cloudflare for SaaS
          # custom-hostnames API at request time. No new secret to mint or
          # rotate — but it does need `SSL and Certificates: Edit` on the zone,
          # and without that every registration answers a permission error,
          # which the route reports rather than swallows.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # WHICH ACCOUNT HOLDS THE DISPATCH NAMESPACE. Already used above to
          # deploy with; uploaded to the Worker as well so it can address
          # `/accounts/<id>/workers/dispatch/namespaces/…` at request time —
          # which is how a site's own script is uploaded on publish and removed
          # on delete.
          #
          # REQUIRED, and safe to list precisely because it already has a value:
          # the deploy step above cannot run without it, so it can never be the
          # empty one that fails the whole run. No fallback, for the reason the
          # inverse rule exists — a placeholder account id would send every
          # customer's script to a namespace nobody serves from, silently.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The RSA private key (PKCS#8, base64) that signs Domain Connect apply
          # links. Its PUBLIC half is published as a TXT record at
          # `_dck1.gofarther.dev`, which is what providers fetch to verify.
          #
          # Unset, the one-click button is simply not offered — the panel falls
          # back to the copyable records, which work. That is deliberate: the
          # template declares `syncPubKeyDomain`, so providers REFUSE an
          # unsigned link, and offering one would be a button that always fails.
          #
          # THE `||` IS NOT TIDINESS, IT IS WHAT STOPS THIS BREAKING THE DEPLOY.
          # `wrangler-action` fails the WHOLE run with "Value for secret X not
          # found in environment" when a name in the `secrets:` list above has an
          # empty value — so adding an optional secret to that list before the
          # secret exists takes the entire platform's deploys down. It did, on
          # 2026-08-07: three merges in a row uploaded nothing, deployed nothing
          # and went red for a reason that had nothing to do with their content.
          #
          # The sentinel is not a working key by construction: `rsaSigner` base64-
          # decodes its input, `atob` throws on this, the throw is caught, and the
          # signer is null — which is exactly the unset behaviour. A real key
          # takes over with no code change.
          #
          # The cost, stated because it removes a diagnostic that has been used
          # here before: the deploy log prints `DOMAIN_CONNECT_KEY: ***` either
          # way, so unlike SITE_SECRETS_KEY a masked value no longer proves the
          # secret HAS one. Ask the Domains panel instead — a signed button
          # appears only with a real key.
          #
          # THE RULE THIS ENCODES: a secret named in `secrets:` above must either
          # already exist in GitHub Actions, or carry a fallback here.
          DOMAIN_CONNECT_KEY: ${{ secrets.DOMAIN_CONNECT_KEY || 'not-a-key' }}
          # ── THE ASYNC EDIT PATH, OFF UNTIL SOMEBODY TURNS IT ON ────────────
          #
          # A synchronous edit is reset at ~273s (measured twice: 273.2s and
          # 273.1s, the second an outright ECONNRESET), so the work moves onto
          # the build queue. This decides which door an edit goes through, and
          # nothing below the fork can tell the difference — which is what makes
          # the rollback "unset it and redeploy" rather than a revert.
          #
          # OPTIONAL, AND THE FALLBACK IS WHAT KEEPS THE DEPLOY ALIVE. See
          # DOMAIN_CONNECT_KEY above for the rule this encodes: a name in the
          # `secrets:` list with an empty value fails the WHOLE run, which took
          # three merges down on 2026-08-07.
          #
          # `off` IS NOT A MAGIC WORD, it is simply not one of the affirmative
          # ones. `editAsyncOn` accepts 1/true/on/yes and treats everything else
          # — including a typo, a number and a non-string — as off, because an
          # unreadable flag must never turn a customer-facing path on by
          # accident.
          EDIT_ASYNC: ${{ secrets.EDIT_ASYNC || 'off' }}
          # ── WHO THE FLAG APPLIES TO ────────────────────────────────────────
          #
          # Uids and slugs, comma or space separated. The flag is the master
          # switch and this is the blast radius; BOTH have to say yes, so the
          # flag alone routes nothing.
          #
          # EMPTY IS THE DEFAULT AND THERE IS NO WILDCARD. Not `*`, not `all`,
          # not an empty string meaning everybody — `readCanaryList` drops any
          # entry that is not a well-formed uuid or slug, and a list with
          # nothing well-formed left in it is an empty list. So a value typed
          # wrong keeps every edit synchronous, which is the safe direction:
          # the cost is that one canary does not get the new path, visible in
          # one test edit. The opposite mistake is every customer at once on a
          # path that has never run.
          #
          # THE SENTINEL IS `-` AND IT IS NOT EMPTY, which is the whole reason
          # it is not `''`. wrangler-action fails with "Value for secret X not
          # found in environment" for an EMPTY value as readily as for a
          # missing one — so `|| ''` is not a fallback, it is the same failure
          # spelled differently, and it took this deploy down once already.
          #
          # `-` is chosen because `readCanaryList` DROPS it: a slug must start
          # `[a-z0-9]`, so it parses to an empty list and every edit stays
          # synchronous. Non-empty for wrangler, absent for the code.
          EDIT_ASYNC_CANARY: ${{ secrets.EDIT_ASYNC_CANARY || '-' }}
          # ── EVERYONE (2026-09-04) ──────────────────────────────────────────
          #
          # The wide door. With the master switch on, every signed-in owner's
          # edit and addon files a job and leaves the connection — because the
          # synchronous path is reset at ~273 s and a compile alone is longer
          # than that, so off the allowlist most edits and every addon died.
          # Read the way EDIT_ASYNC is read: an affirmative word or nothing,
          # never a wildcard in the allowlist above, which keeps working with
          # this off and is not consulted with it on.
          #
          # ON BY DEFAULT, and that is the one fallback in this block that is
          # the INTENDED state rather than the absent one: the queue is the
          # path every customer belongs on (proved on fretwork-1, runs 22–39),
          # and the secret exists to turn it OFF — set it to `off` in GitHub
          # and redeploy, and every edit is synchronous again with the canary
          # allowlist still honoured. `EDIT_ASYNC` off overrides both doors.
          EDIT_ASYNC_EVERYONE: ${{ secrets.EDIT_ASYNC_EVERYONE || 'on' }}
          # Mail needs NO secret here. The Worker sends through Cloudflare Email
          # Service via the `send_email` binding in wrangler.jsonc (2026-07-30,
          # replacing Go Farther) — nothing to mint, upload each deploy, or rotate.
          # A token IS needed by the Supabase send-email Edge Function, which runs
          # on Deno and cannot use a binding; that lives in Supabase's secrets as
          # CF_ACCOUNT_ID + CF_EMAIL_TOKEN, not here.

      # WHERE CUSTOM DOMAINS STAND, printed on every deploy. Read-only, dry run,
      # and it can NEVER fail the job — `continue-on-error` plus the script's own
      # non-zero exit when something is outstanding, which here is information
      # rather than a fault.
      #
      # It runs here because this is the only job holding CLOUDFLARE_API_TOKEN,
      # and because the answer changes without anybody editing a file: a token
      # scope added in the Cloudflare dashboard, a DNS record removed by hand, a
      # fallback origin that silently stopped being active. A report you have to
      # remember to ask for is a report nobody reads until something is already
      # broken. `saas-setup.yml` is the same script with `--apply` available.
      - name: custom domains status (report only)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node .github/scripts/saas-setup.mjs

      # THE SITE ZONE, on the same read-only footing and for the same reason.
      # `<slug>.gofarther.app` needs the zone in this account, two DNS records
      # and a Worker route, and the route CANNOT go into wrangler.jsonc until
      # the first of those is true — a route naming a zone the account does not
      # hold fails the routes PUT and takes the whole deploy with it.
      #
      # So the precondition for flipping SITE_ZONE_LIVE is a fact about
      # Cloudflare that nothing in the repo can see. Printing it on every deploy
      # means the answer is already there when somebody asks, instead of being a
      # workflow somebody has to remember to run. Read-only: `site-zone-setup.yml`
      # is the same script with `--apply` available.
      - name: site zone status (report only)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node .github/scripts/site-zone-setup.mjs
