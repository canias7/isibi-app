name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the deploy only reads the repo; Cloudflare auth is via secrets,
# not GITHUB_TOKEN. Stops a compromised action in the job from writing to the repo.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The Worker imports @cf-wasm/photon (server-side image watermarking);
      # install deps so wrangler can bundle it at deploy.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      # All Worker secrets are uploaded through wrangler-action as part of the
      # deploy. A standalone `wrangler secret put` after the deploy fails on this
      # account with "the latest version of your Worker isn't currently deployed"
      # (Cloudflare's versioned-deployments guard) — doing it inside the deploy
      # step, which deploys first, avoids that. SUPABASE_SERVICE_KEY lets the
      # Stripe webhook call add_credits (REVOKEd from anon/authenticated on the DB).
      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.107.0"
          secrets: |
            FAL_KEY
            ANTHROPIC_API_KEY
            GEMINI_API_KEY
            STRIPE_SECRET_KEY
            STRIPE_WEBHOOK_SECRET
            CREDITS_MINT_SECRET
            SUPABASE_SERVICE_KEY
            COMPOSIO_API_KEY
            NEON_API_KEY
            SITE_SECRETS_KEY
            CLOUDFLARE_API_TOKEN
            DOMAIN_CONNECT_KEY
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Website Builder engine (Gemini = design pass; Opus = architecture).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          CREDITS_MINT_SECRET: ${{ secrets.CREDITS_MINT_SECRET }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          # Layer-2 per-site backend: provision + query each built site's own
          # Postgres database on Neon. One Neon PROJECT per Go Farther user (created
          # lazily on their first publish), one DATABASE inside it per site.
          # Replaced Cloudflare D1 on 2026-07-27 — see the shim in worker.js.
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          # Encrypts each SHOP OWNER's own Stripe key before it is stored in
          # their site's Neon database (`_secrets`). Deliberately its OWN secret
          # rather than deriving from SUPABASE_SERVICE_KEY, which is what
          # site-secrets.mjs falls back to when this is unset: that fallback
          # works, but it couples the vault to the database credential, so
          # rotating SUPABASE_SERVICE_KEY would make every stored payment key
          # undecryptable — silently, with every shop's checkout failing and
          # nothing pointing at the cause.
          #
          # Generate with `openssl rand -hex 32`. Safe to add at any time: the
          # ciphertext carries its key version, so rows written under the old
          # derivation keep opening while new ones use this. UNSET IS ALSO SAFE
          # — an empty value is falsy, site-secrets.mjs sees no v2 material and
          # writes v1. What is NOT safe is changing it once secrets exist under
          # it; that strands them, and there is no recovery but re-pasting keys.
          SITE_SECRETS_KEY: ${{ secrets.SITE_SECRETS_KEY }}
          # CUSTOM DOMAINS. The same token wrangler already deploys with, now
          # also uploaded TO the Worker so it can call the Cloudflare for SaaS
          # custom-hostnames API at request time. No new secret to mint or
          # rotate — but it does need `SSL and Certificates: Edit` on the zone,
          # and without that every registration answers a permission error,
          # which the route reports rather than swallows.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # The RSA private key (PKCS#8, base64) that signs Domain Connect apply
          # links. Its PUBLIC half is published as a TXT record at
          # `_dck1.gofarther.dev`, which is what providers fetch to verify.
          #
          # Unset, the one-click button is simply not offered — the panel falls
          # back to the copyable records, which work. That is deliberate: the
          # template declares `syncPubKeyDomain`, so providers REFUSE an
          # unsigned link, and offering one would be a button that always fails.
          #
          # THE `||` IS NOT TIDINESS, IT IS WHAT STOPS THIS BREAKING THE DEPLOY.
          # `wrangler-action` fails the WHOLE run with "Value for secret X not
          # found in environment" when a name in the `secrets:` list above has an
          # empty value — so adding an optional secret to that list before the
          # secret exists takes the entire platform's deploys down. It did, on
          # 2026-08-07: three merges in a row uploaded nothing, deployed nothing
          # and went red for a reason that had nothing to do with their content.
          #
          # The sentinel is not a working key by construction: `rsaSigner` base64-
          # decodes its input, `atob` throws on this, the throw is caught, and the
          # signer is null — which is exactly the unset behaviour. A real key
          # takes over with no code change.
          #
          # The cost, stated because it removes a diagnostic that has been used
          # here before: the deploy log prints `DOMAIN_CONNECT_KEY: ***` either
          # way, so unlike SITE_SECRETS_KEY a masked value no longer proves the
          # secret HAS one. Ask the Domains panel instead — a signed button
          # appears only with a real key.
          #
          # THE RULE THIS ENCODES: a secret named in `secrets:` above must either
          # already exist in GitHub Actions, or carry a fallback here.
          DOMAIN_CONNECT_KEY: ${{ secrets.DOMAIN_CONNECT_KEY || 'not-a-key' }}
          # Mail needs NO secret here. The Worker sends through Cloudflare Email
          # Service via the `send_email` binding in wrangler.jsonc (2026-07-30,
          # replacing Go Farther) — nothing to mint, upload each deploy, or rotate.
          # A token IS needed by the Supabase send-email Edge Function, which runs
          # on Deno and cannot use a binding; that lives in Supabase's secrets as
          # CF_ACCOUNT_ID + CF_EMAIL_TOKEN, not here.

      # WHERE CUSTOM DOMAINS STAND, printed on every deploy. Read-only, dry run,
      # and it can NEVER fail the job — `continue-on-error` plus the script's own
      # non-zero exit when something is outstanding, which here is information
      # rather than a fault.
      #
      # It runs here because this is the only job holding CLOUDFLARE_API_TOKEN,
      # and because the answer changes without anybody editing a file: a token
      # scope added in the Cloudflare dashboard, a DNS record removed by hand, a
      # fallback origin that silently stopped being active. A report you have to
      # remember to ask for is a report nobody reads until something is already
      # broken. `saas-setup.yml` is the same script with `--apply` available.
      - name: custom domains status (report only)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node .github/scripts/saas-setup.mjs
