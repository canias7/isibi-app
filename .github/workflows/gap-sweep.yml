# The gap sweep — the parts of the edit path the lane sweep could not reach,
# each driven once on a live site and judged by reading the site afterwards.
# See scripts/gap-sweep.mjs for the cases and what "works" means for each.
#
# COSTS REAL MONEY, BY DESIGN, and touches TWO live sites: the frontend-only
# one (text, logo, cancel, and a free probe of the addon route's refusal) and
# one with a database (the addon page and the page verbs that follow it, data,
# rules, backend). Budgeted by `budget`.
#
# DISPATCH ONLY. No push trigger, no marker gate — the switch is the `confirm`
# input, which has to be the word `spend`.
#
# THE SCREENSHOTS COME BACK ON THE BRANCH THAT WAS DISPATCHED. The runner
# commits docs/edits/gap-*.png and the results file to the ref it ran from,
# never to main, so a run can never roll the container or deploy anything.
name: gap sweep

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type the word: spend'
        required: true
        default: ''
      cases:
        description: 'all, or a comma list (text,logo,cancel,addon-nodb,addon,move,remove,data,rules,backend)'
        required: false
        default: 'all'
      site:
        description: 'The frontend-only site (must be on the async allowlist)'
        required: false
        default: 'fretwork-1'
      dbsite:
        description: 'The site with a database, for data / rules / backend'
        required: false
        default: 'the-lido-cafe'
      picker:
        description: 'grok | sonnet | opus'
        required: false
        default: 'grok'
      budget:
        description: 'Stop before any case once this many credits have gone'
        required: false
        default: '60'

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      # A browser, for the screenshots and for the one check that needs a
      # rendered page (the lido menu is drawn from rows at runtime). Pinned to
      # the kit's own playwright line; --no-save so package.json is untouched.
      # Two single-line steps, not one block: test/ci-browser-order.test.mjs
      # reads the first line of a `run: |` block only, and must see the
      # install before the step that launches.
      - run: npm i --no-save --no-audit --no-fund playwright@1.49.1
      - run: npx playwright install --with-deps chromium
      - name: sweep
        id: sweep
        continue-on-error: true
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          OWNER_EMAIL: aniascristian@gmail.com
          OWNER_BASE_URL: https://gofarther.dev
          SWEEP_CONFIRM: ${{ github.event.inputs.confirm }}
          GAP_CASES: ${{ github.event.inputs.cases }}
          GAP_SLUG: ${{ github.event.inputs.site }}
          GAP_DB_SLUG: ${{ github.event.inputs.dbsite }}
          SWEEP_PICKER: ${{ github.event.inputs.picker }}
          GAP_BUDGET: ${{ github.event.inputs.budget }}
          GAP_SHOTS_DIR: docs/edits
        run: node scripts/gap-sweep.mjs
      # The pictures are the record the owner asked for, so they land whether
      # or not the sweep passed. Pushed to the DISPATCHED ref, which is what
      # `ref_name` is on a workflow_dispatch — a run from a branch writes to
      # that branch and a run from main writes to main.
      - name: keep the screenshots
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/edits
          if git diff --cached --quiet; then echo "nothing to keep"; exit 0; fi
          git commit -m "docs: gap sweep screenshots and results ($(date -u +%Y-%m-%dT%H:%MZ))"
          for i in 1 2 3; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && break
            sleep 5
          done
      - name: verdict
        if: steps.sweep.outcome != 'success'
        run: |
          echo "the sweep reported a LIE, a NEEDS REVIEW or a NO ANSWER — read the log above"
          exit 1
