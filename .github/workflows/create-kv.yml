# One-shot: create the KV namespaces the Worker reads at the edge.
#
# TWO OF THEM, and neither is bound today — `wrangler.jsonc` has no
# `kv_namespaces` block at all, so both features below are running on their
# fallback right now and have been since they shipped.
#
#   SITE_ROUTES      slug -> connection string, so a visitor read never makes
#                    the two cross-region Supabase calls that answer a question
#                    fixed at build time. Falls back to Supabase.
#   SITE_API_CACHE   a published site's third-party API answers, shared across
#                    isolates. Falls back to the per-isolate cache, which means
#                    a declared `cacheSeconds: 3600` is honoured PER ISOLATE —
#                    Cloudflare runs many per PoP and evicts idle ones, so a
#                    low-traffic site is close to uncached and the owner's
#                    third-party quota is spent once per isolate per window.
#
# BOTH ARE SAFE TO CREATE AND SAFE TO LEAVE UNBOUND. The code ships without the
# bindings and degrades to the fallbacks, which is what made both changes safe
# to land before this ever ran. Nothing breaks if you create the namespaces and
# never add the bindings; nothing breaks if you add them either.
#
# Creating a namespace is IDEMPOTENT BY NAME: re-running returns the existing
# one rather than making a second, so this is safe to run again whenever.
#
# Run it from the Actions tab → "create kv namespaces" → Run workflow, then copy
# the two ids it prints into wrangler.jsonc (the last step prints the exact
# block). The binding takes effect on the next deploy.
name: create kv namespaces

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: create SITE_ROUTES
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest kv namespace create SITE_ROUTES

      # A SEPARATE STEP, not a loop, so one failing does not hide the other's
      # id in a wall of output — and `continue-on-error` is deliberately NOT set:
      # if the token cannot create a namespace, that is the thing to fix, and a
      # green run with no id printed is the worst outcome here.
      - name: create SITE_API_CACHE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest kv namespace create SITE_API_CACHE

      - name: what to do with the ids
        run: |
          echo "Both namespaces now exist. Copy the two ids printed above into"
          echo "wrangler.jsonc, as a top-level key beside \"r2_buckets\":"
          echo ''
          echo '  "kv_namespaces": ['
          echo '    { "binding": "SITE_ROUTES",    "id": "<the first id>" },'
          echo '    { "binding": "SITE_API_CACHE", "id": "<the second id>" }'
          echo '  ],'
          echo ''
          echo "Then commit that and merge — the bindings take effect on the next deploy."
          echo ""
          echo "Until each binding exists the Worker uses that feature's fallback:"
          echo "  SITE_ROUTES    -> two Supabase calls per visitor read (works, slower)"
          echo "  SITE_API_CACHE -> per-isolate cache only (works, spends more of the"
          echo "                    site owner's third-party quota than declared)"
