# CLOSE THE FIVE SITES WHOSE DATABASE REFERENCE IS BLANK, AND PUT BACK THE
# DECLARATIONS THAT WENT WITH IT.
#
# WHY IT IS A WORKFLOW AND NOT A LOCAL SCRIPT — the same reason `grants preview`
# gives. Every site's database is reached through `site_project.neon_conn`, and
# that column is only readable with the Supabase service key, which lives in
# Actions secrets and nowhere else. A session cannot run this from anywhere but
# here, and reading a live connection string into a session transcript is not a
# trade worth making for a repair that can be pressed from a button.
#
# PREVIEW IS THE DEFAULT AND IT WRITES NOTHING. `--preview` reads Supabase, opens
# one connection per site, asks `current_database()`, reads the catalog and the
# stored spec, and prints what it WOULD do. Every statement it issues is a SELECT.
#
# APPLY NEEDS THE WORD, and the word is `apply` — the wall `grants preview` and
# `lane sweep` already use, because this one writes to customers' databases.
# BOTH writing modes need it; the gate is a prefix test, not a list of two.
#
# `apply-reference` IS THE NARROW ONE, AND IT IS A MODE BECAUSE A PREVIEW IS NOT
# A BOUND. `repairSite` plans and writes in one pass, so a preview describes a
# run that has already ended and constrains nothing about the next one — and the
# schema write is an upsert no later read undoes. Reference-only proves identity
# with the same checks, writes `site_backends.neon_db` under the same fence, and
# CANNOT create or update `_meta` even when it finds declarations missing; it
# REPORTS that work instead, by table, with its own tally line.
#
# THE SCOPE IS IN THE SCRIPT, NOT IN THIS FORM. `REPAIR_SITES` names the five
# sites by hand and `workList` asks it FIRST; a `slug` typed here that is not one
# of them is refused by name and nothing runs. An input cannot be the wall — an
# input is a thing somebody types.
#
# WHAT IT CAN AND CANNOT DO. At its widest (`apply`) it writes exactly two
# things: `site_backends.neon_db` for a site whose reference is missing, and
# `_meta.schema` for a site whose declarations are missing. `apply-reference`
# writes the FIRST ONLY. There is no CREATE DATABASE, no DROP, no ALTER, no
# TRUNCATE and no statement anywhere in it that can reach an application row —
# asserted across the whole apply -> verify -> repeat sequence in
# `test/repair-commands.test.mjs`, which runs the script as a real process, and
# again for reference-only against a control that proves the wider mode really
# would have written `_meta` on the same database.
#
# VERIFY EXITS NONZERO WHEN A POSTCONDITION FAILS, so a red run here means the
# repair did not land — it is not a report that always passes.
#
# DISPATCH ONLY. No push trigger: `test/merge-triggers.test.mjs` is a census over
# this directory and requires `deploy.yml` to be the only workflow a push to main
# starts.
name: backend repair

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview (reads only) | apply-reference (WRITES the neon_db reference ONLY) | apply (WRITES reference AND _meta) | verify (reads only, exits nonzero on failure)'
        required: true
        default: 'preview'
        type: choice
        options: [preview, apply-reference, apply, verify]
      slug:
        description: 'One of the five, e.g. repairbench-1. Blank = all five. Anything else is refused.'
        required: false
        default: ''
      confirm:
        description: 'For apply ONLY, type the word: apply'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund --loglevel=error
      # THE WORD IS READ AS A WORD, the way `grants preview` reads its own: a run
      # once typed a trailing space and got the wrong harness. Whitespace and
      # case are forgiven; anything else is not the word.
      #
      # `startsWith(..., 'apply')` COVERS BOTH WRITING MODES AND ANY FUTURE ONE.
      # A list of two names is a second copy of the script's own `WRITES_
      # REFERENCE`, and the copy that drifts is the one that stops demanding the
      # word. A prefix test errs toward DEMANDING confirmation for a mode it has
      # never heard of, which is the safe direction: the cost of a false demand
      # is typing `apply`, and the cost of a false exemption is an unconfirmed
      # write.
      - name: refuse an apply that was not asked for
        if: ${{ startsWith(github.event.inputs.mode, 'apply') }}
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          W=$(printf '%s' "$CONFIRM" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]'); if [ "$W" != "apply" ]; then echo "mode is apply and confirm is not the word 'apply' — refusing, nothing was written"; exit 1; fi
      # `shell: bash` IS LOAD-BEARING, NOT TIDINESS. GitHub's unspecified Linux
      # shell is `bash -e {0}` — `set -e` WITHOUT `pipefail` — and the command
      # below ends in `| tee`, so the step's status is TEE's. MEASURED with a
      # stub that exits 1: under `bash -e` the step exits **0** and a failed
      # repair or a failed `--verify` reads GREEN; under `shell: bash`
      # (`bash --noprofile --norc -eo pipefail {0}`) it exits **1**. The log is
      # byte-identical either way, so nothing is traded for it.
      # Driven in `test/repair-workflows.test.mjs` — the command and its shell
      # setting together, because either alone proves nothing.
      #
      # ONE LINE, because test/ci-browser-order.test.mjs reads the first line of
      # a `run:` block and must see the script name there.
      - name: backend repair
        shell: bash
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MODE: ${{ github.event.inputs.mode }}
          SLUG: ${{ github.event.inputs.slug }}
        run: |
          S=""; if [ -n "$SLUG" ]; then S="--slug $SLUG"; fi; node scripts/backend-repair.mjs --"${MODE:-preview}" $S 2>&1 | tee backend-repair.log
      # THE LOG LANDS WHETHER OR NOT THE RUN PASSED. A verify that failed is
      # exactly the run whose output is worth keeping, and a failed apply names
      # which site it got to.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-repair-log
          path: backend-repair.log
          if-no-files-found: ignore
          retention-days: 90
