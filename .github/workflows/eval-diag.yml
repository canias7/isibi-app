# Diagnostic: why does Sonnet return out=25000/HIT-CAP but files=[NONE] / empty text? Runs ONE prompt (CRM)
# on Sonnet at 25k, cap-aware, once non-streaming and once streaming, with the new [DIAG] logging that prints
# stop_reason + the content block types (text vs thinking vs tool_use) that actually came back. No build step —
# we only need the generation + the diag line. Cheap (~$0.60). Triggers on push to eval-diag-run.
name: eval-diag

on:
  push:
    branches: [eval-diag-run]

jobs:
  eval-diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Diag — Sonnet 5 @ 25k, CRM, NON-streaming
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_MODEL: "claude-sonnet-5"
          EVAL_ONLY: "2"
          EVAL_MAX_OUT: "25000"
          EVAL_CAP_AWARE: "1"
          EVAL_STREAM: "0"
          EVAL_DUMP: "1"
          EVAL_BUILD: "0"
          EVAL_VISION: "0"
          EVAL_REPAIR: "0"
        run: node test/pipeline-eval.mjs

      - name: Diag — Sonnet 5 @ 25k, CRM, STREAMING
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_MODEL: "claude-sonnet-5"
          EVAL_ONLY: "2"
          EVAL_MAX_OUT: "25000"
          EVAL_CAP_AWARE: "1"
          EVAL_STREAM: "1"
          EVAL_DUMP: "1"
          EVAL_BUILD: "0"
          EVAL_VISION: "0"
          EVAL_REPAIR: "0"
        run: node test/pipeline-eval.mjs
