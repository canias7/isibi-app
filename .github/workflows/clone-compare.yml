# Phase 5: run the Lovable-clone pipeline for real and compare it against Lovable's own output.
#
# This is the only part of the clone that SPENDS CREDITS and the only part that needs
# ANTHROPIC_API_KEY. Everything else is covered by clone-check.yml with no key and no spend.
#
# Cost: roughly 6-8 model calls for the default seat-picker brief — clarify, plan, schema, theme
# and shell, plus one per page. A few cents on Sonnet. The token cap is a hard ceiling: the
# pipeline skips later stages rather than overspending it.
name: clone-compare

on:
  # Dispatch is the normal way in. The push trigger exists because an integration token cannot
  # call the dispatch API (403 "Resource not accessible by integration"), and it is gated on a
  # single sentinel file so an ordinary commit never spends anything — only touching RUN does.
  push:
    branches: ["claude/**"]
    paths: ["builder/lovable/RUN"]
  workflow_dispatch:
    inputs:
      brief:
        description: "What to build. Blank uses the theatre seat picker — the one brief Lovable has already answered here, so the comparison is like for like."
        required: false
        default: ""
      model:
        description: "Model for every stage."
        required: false
        default: "claude-sonnet-5"
      cap:
        description: "Total output-token ceiling for the whole build."
        required: false
        default: "40000"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # npm resolves an optional peer of @hookform/resolvers differently than the bun lockfile
      # Lovable ships, hence --legacy-peer-deps. Same package set either way.
      - name: Install the clone template
        working-directory: builder/lovable/template
        run: npm install --no-audit --no-fund --legacy-peer-deps --loglevel=error

      # The runtime smoke check needs BOTH the playwright package and a browser. Seven live runs
      # reported it "skipped" because only the browser was ever installed — the package is a
      # devDependency of the template, so the download has to run from there too.
      - name: Chromium for the smoke check
        working-directory: builder/lovable/template
        run: |
          npx playwright install --with-deps chromium || echo "WARN chromium unavailable, smoke check will report skipped"

      # Rules must match the template before spending anything generating against them.
      - name: Preflight
        run: node builder/lovable/check-clone.mjs

      # Inputs go through the environment rather than being spliced into the command. A workflow
      # input is arbitrary text: interpolating it is fragile around quotes and newlines, and an
      # injection point. On a push trigger these are simply empty and the defaults apply.
      - name: Live run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLONE_BRIEF: ${{ inputs.brief }}
          CLONE_MODEL: ${{ inputs.model }}
          CLONE_CAP: ${{ inputs.cap }}
        run: |
          # GITHUB_STEP_SUMMARY renders as markdown, so the scorecard only keeps its alignment
          # inside a fence. pipefail preserves the real exit code through the tee.
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          set -o pipefail
          node builder/lovable/live-run.mjs --out "$GITHUB_WORKSPACE/clone-out" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # The generated app itself, so the output can be read rather than taken on trust.
      - name: Upload the generated app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clone-generated-app
          path: clone-out
          retention-days: 14
