# One REAL build through the exact sequence worker.js runs: a real model, the chunked build, a real
# vite compile, and the runtime smoke check. Everything else in CI is static or stubbed; this is the
# only job that answers "does a site actually come out the other end".
#
# SPENDS CREDITS — a schema call plus a chunked generation, a few tens of cents on Sonnet. Gated on a
# sentinel file so an ordinary commit never triggers it: only touching builder/LIVE_RUN does. The
# push trigger exists because an integration token cannot call the workflow_dispatch API
# (403 "Resource not accessible by integration").
name: live-build

on:
  push:
    branches: ["claude/**"]
    paths: ["builder/LIVE_RUN"]
  workflow_dispatch:
    inputs:
      brief:
        description: "What to build. Blank uses the barbershop booking brief, which matches a starter."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The build service runs directly on the runner against a scaffolded copy of the template —
      # the same code the container runs, without needing a Docker daemon.
      - name: Scaffold the build service
        run: |
          set -e
          mkdir -p /tmp/buildapp
          cp builder/package.json /tmp/buildapp/
          cp -r builder/template/. /tmp/buildapp/
          cd /tmp/buildapp
          npm install --no-audit --no-fund --loglevel=error
          cp -a /tmp/buildapp/src /tmp/buildapp/.template-src

      # The runtime smoke check needs a browser. Best-effort: without one it reports itself skipped
      # WITH THE REASON, which is the whole point — a bare "skipped" hid a real bug for eight runs.
      - name: Chromium for the smoke check
        working-directory: /tmp/buildapp
        run: npx playwright install --with-deps chromium || echo "WARN chromium unavailable, smoke check will report skipped"

      - name: Start the build service
        run: |
          APP_DIR=/tmp/buildapp PORT=8080 node builder/build-server.mjs > /tmp/build-server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/health && break || sleep 0.5; done
          echo "build service up"

      # The static guards first — no point spending anything if the wiring already drifted.
      - name: Preflight
        run: |
          node builder/worker-generate.test.mjs
          node builder/smoke-check.test.mjs

      - name: Live build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUILD_URL: "http://127.0.0.1:8080"
          BUILD_APP_DIR: /tmp/buildapp
          LIVE_BRIEF: ${{ inputs.brief }}
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          set -o pipefail
          node test/live-worker-build.mjs 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # The scorecard says a site was produced; the screenshots show WHAT was produced. This is the
      # only place the generated design can actually be looked at.
      - name: Screenshots of the generated site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-site
          path: shots
          retention-days: 14
          if-no-files-found: warn

      - name: Build service log
        if: always()
        run: tail -60 /tmp/build-server.log || true
