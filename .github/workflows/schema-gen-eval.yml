# Does the DESIGNER produce a schema a business can actually use?
#
# The step that decides a site's tables, its access levels, its seed rows and
# its family was measured by NOTHING. `page gen eval` sends the schema;
# `confirm smoke` and `member smoke` send one deliberately to skip this call;
# `build smoke` designs one and prints it without asserting anything. So every
# claim about designer quality rested on anecdotes, and changes were shipped
# against them.
#
# This samples the design call alone — no database, no publish, no container,
# no account — and scores each answer on properties that are true or false:
# every display table got starter rows, a booking table got something holding
# the slot, a browsing brief produced something a stranger can read.
#
# CHEAPER THAN THE PAGE EVAL BY AN ORDER OF MAGNITUDE. A design call is ~1.5
# credits warm and ~6.5 cold, against ~28 for a page call, because the output
# is ~500 tokens rather than ~10,000. Four scenarios × 1 sample is the default.
name: schema gen eval

on:
  push:
    branches: [main]
    paths:
      # The tool itself. Every field on it is what this measures, so any edit
      # to it is exactly when the number is worth having.
      - "worker.js"
      # The checks read these to decide what an answer means — a change to how
      # access resolves, or to what the engine keeps, changes the verdict
      # without changing the model's answer at all.
      - "site-access.mjs"
      - "site-schema.mjs"
      - "test/integration/schema-gen-eval.mjs"
      - "test/integration/schema-checks.mjs"
      # ITS OWN CONFIG. Missing until 2026-08-13, and it bit immediately: the
      # sample count was raised 1 -> 5 specifically to settle whether a failure
      # was variance, the commit touched this file and nothing else, and the run
      # that would have answered never fired. `site-build.yml` has always listed
      # itself; this one did not, so a change to WHAT gets measured could not
      # trigger the measurement.
      - ".github/workflows/schema-gen-eval.yml"
  workflow_dispatch:
    inputs:
      samples:
        description: "Samples per scenario (1-10)"
        required: false
        default: "1"
      # WHICH MODEL DESIGNS THE SCHEMA, so "would Opus do better?" is a button
      # rather than an argument.
      #
      # The question is live: the designer omits `seed` — a field its own tool
      # marks required — on a minority of samples, and every other measured
      # property sits at ceiling. `strict: true` cannot enforce it (the API
      # rejects the dynamic `seed` map), so the model itself is the remaining
      # lever.
      #
      # DISPATCH ONLY, never on push. A permanent second model doubles the cost
      # of every designer-touching commit to answer a one-off question, and this
      # eval's whole job is to be cheap enough to run when something changes.
      #
      # BEFORE SPENDING IT, READ THE ECONOMICS in CLAUDE.md: a cold Opus schema
      # call is ~1.67x a Sonnet one, so a perfect result still costs ~8 extra
      # credits on EVERY build to avoid a ~0.4-credit Haiku top-up on a minority
      # of them. A good result here is an argument for the picker, not for the
      # default.
      model:
        description: "Model id for the designer (default claude-sonnet-5)"
        required: false
        default: "claude-sonnet-5"

permissions:
  contents: write

jobs:
  eval:
    # `[skip smoke]` ships the change without the paid sample, the same escape
    # hatch `build smoke` has had since it was written — and this workflow
    # needed one more, because it watches `worker.js`. That file is touched by
    # most commits in this repo for reasons that have nothing to do with the
    # designer's prompt, so a comment fix or a route change bought a real model
    # call to re-measure something nothing moved.
    #
    # `github.event.head_commit.message`, NOT `workflow_run.head_commit` — this
    # workflow is triggered by the push itself rather than by another workflow
    # completing, so the payload is different from build smoke's and copying
    # that expression across would read `undefined` and never match.
    #
    # `workflow_dispatch` is deliberately exempt: asking for a run by hand is
    # not something a commit message should be able to veto.
    if: >-
      github.event_name == 'workflow_dispatch'
      || !contains(github.event.head_commit.message, '[skip smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund --loglevel=error

      # No template dependencies and no container: nothing here compiles a page.
      # The whole harness is one HTTP call per sample plus the schema engine.
      - name: Sample the designer
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # PER SCENARIO, and there are four. The same failure repeated across
          # samples is what separates a systematic mismatch from variance, and
          # one sample of four shapes cannot tell them apart.
          #
          # RAISED 1 -> 5 ON 2026-08-13, owner's call, because one sample was
          # measurably not enough: the capacity brief failed on one run and
          # passed on the next, and there was no way to tell a coin flip from a
          # broken feature. 20 samples costs ~0.9 credits — under a penny —
          # against 0.18 for four, so the price of an answer is nothing and the
          # price of not having one was a whole exchange of guessing.
          EVAL_SAMPLES: ${{ github.event.inputs.samples || '5' }}
          # Empty on a push, so an ordinary run is byte-identical to before this
          # existed and the script's own `claude-sonnet-5` default decides.
          EVAL_MODEL: ${{ github.event.inputs.model }}
        run: node test/integration/schema-gen-eval.mjs

      - name: Commit the report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain docs/auth-audit)" ]; then
            git add docs/auth-audit
            # The marker below stops this push re-triggering the workflows that
            # would otherwise trigger this one. Never write it into an ordinary
            # commit message or PR body — GitHub scans the whole message and
            # skips every workflow for that push, silently and with a green tick.
            git commit -m "Schema designer eval ($(date -u +%Y-%m-%dT%H:%MZ)) [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep $((i * 5))
            done
          else
            echo "no report to commit"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schema-gen-eval
          path: |
            docs/auth-audit/SCHEMA-GEN.md
