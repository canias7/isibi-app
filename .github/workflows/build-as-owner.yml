# ONE build as the owner's own account, with a full step log — see
# scripts/build-as-owner.mjs for what it does and does not do (no password,
# no teardown of anything).
#
# Fires only on a push touching its own two files AND whose commit message
# carries `[owner build]` — OPT-IN, because a run spends the owner's real
# credits (~130 on a cold build). The path filter alone was the whole gate at
# first, and it fired on the wrong thing immediately: the fix for run 2's
# step-7 crash touches the script, so pushing it would have bought a third
# build nobody asked for. A trigger that spends money is asked for by name,
# never inherited from a file path. The commit that DOES run it should also
# carry the repo's skip marker so `build smoke` does not burn a second build
# on the same push.
#
# AND THE GATE FIRED ON ITS OWN FIRST OUTING (2026-08-21): the commit that
# ADDED it spelled the marker while explaining it, contains() matched the
# explanation, and the run had to be stopped mid-flight — a one-minute
# sign-in block on the build account, so the script died at its own step 2
# with nothing spent and the ledger untouched. The same shape this repo has
# recorded twice for the skip-CI marker and across nine guards: prose about
# a rule, tripping the rule. The discipline is therefore the skip marker's,
# applied here: in a commit message, write "the owner-build marker" and
# never spell it — spell it ONLY in the one commit deliberately buying a
# build. (Cancelling the run from a session is not a fallback: the API
# answers 403, the same scope wall as workflow_dispatch.)
name: build as owner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-as-owner.yml'
      - 'scripts/build-as-owner.mjs'

jobs:
  build:
    # The opt-in gate. Without the marker a push here (this very fix, say)
    # skips instantly and spends nothing.
    if: contains(github.event.head_commit.message, '[owner build]')
    runs-on: ubuntu-latest
    # 15 WAS TOO TIGHT AND IT COST US THE DIAGNOSTICS WE PAID FOR.
    #
    # Run 8 (2026-08-21) signed in, POSTed the build, and was killed by this cap
    # at 11m58s into the request with no response. THE SITE PUBLISHED ANYWAY —
    # `fold-lane-bakery` served 200 with seeded rows — so nothing was lost but
    # the answer: the cost breakdown, the generator's own notes, and the render
    # report all ride on that response, and 94 credits bought a site we then had
    # to verify by hand with curl.
    #
    # The deploy wait alone takes ~3.5 minutes of this budget before the build
    # starts, which is what makes 15 tighter than it reads. Measured build
    # durations: 378s (run 6), 507s (run 7), >718s (run 8, unfinished).
    #
    # 30 rather than 20: the point of the cap is to stop a wedged runner billing
    # for an hour, not to bound a build we already know can take twelve minutes.
    # A build that outruns THIS is a real finding rather than a tight budget.
    #
    # ── AND THEN 30 BECAME THE LAST BINDING CEILING (2026-08-22, owner's call) ──
    #
    # Owner: "we gonna delete any timeout there is anywhere, pls, just let the
    # model work, pls ok, forget about time, just lets it be". Five bounds on the
    # build path were raised past any plausible binding value in the same change
    # (BUILDER_CALL_MS, BUILD_BUDGET_MS, CONTAINER_CALL_MS, STEP_TIMEOUT,
    # DISPATCH_CALL_MS) — and with those gone THIS is what would have killed the
    # run, exactly as it killed attempt 1 of build 1 at 26m48s.
    #
    # 350 is five minutes under GitHub's own hard 360-minute maximum. It is not a
    # judgement about how long a build should take: it is the largest number the
    # platform allows, which is the closest thing to "no timeout" available here.
    # The script no longer needs the runner alive to get a site either — a dead
    # socket is expected now and it watches the site instead — so what this cap
    # really bounds is how long we are willing to WATCH, not how long the build
    # may run.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The deploy for this same push replaces the Worker (~3.5 min). Wait it
      # out so the build runs against the code that just shipped rather than
      # racing the rollout — the exact mistake edit-smoke recorded on
      # 2026-08-12, when 90s of sleep tested a Worker mid-replacement.
      - name: wait for this push's deploy
        run: |
          for i in $(seq 1 40); do
            state=$(curl -sf "https://api.github.com/repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=10" \
              | node -e 'let s="";process.stdin.on("data",(c)=>s+=c).on("end",()=>{const d=JSON.parse(s);const r=(d.workflow_runs||[]).find((x)=>x.name==="Deploy to Cloudflare");console.log(r?r.status+"/"+r.conclusion:"none");})') || state=err
            echo "deploy: $state (poll $i)"
            case "$state" in
              completed/success) exit 0 ;;
              completed/*) echo "the deploy failed — building against it proves nothing"; exit 1 ;;
            esac
            sleep 15
          done
          echo "deploy never finished in 10 minutes"; exit 1
      - name: build as the owner
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          OWNER_EMAIL: aniascristian@gmail.com
          OWNER_BASE_URL: https://gofarther.dev
          # A FRESH SLUG AGAIN. Runs 3 and 4 both died at the wall on THIS
          # brief and each left a claimed slug plus a live Neon project behind
          # (`mathaq-alemarat`, `mathaq-dubai`), so neither name can be reused:
          # ownership is what decides `revise`, and re-running one would be read
          # as an edit of an empty husk rather than the first build it never got.
          # ── THE CSS EXPERIMENT, BUILD 1 OF 2 (2026-08-22, owner's call) ─────
          #
          # Owner: "one the one we have to day, model rights css based on the 29
          # axis, the other one, model writes css without the axis, meaning it
          # makes it up". Two builds, two live sites, one variable.
          #
          # THE VARIABLE IS `OWNER_FREE_CSS` AND NOTHING ELSE. Same brief, same
          # picker, same everything — only the slug moves with it, because a
          # slug is claimed by whoever built it first and the second run needs
          # its own name. Change a word of the brief between the two and the
          # comparison stops being about CSS, which is the confound this whole
          # experiment is built around.
          #
          # THE COST THE OWNER ACCEPTED, stated: two independent builds produce
          # two different SITES — different pages, different copy, different
          # photographs — so what is being compared is two whole sites and the
          # stylesheet difference sits inside everything else that moved. Raised
          # before spending, chosen anyway.
          #
          # VERIFIED BEFORE A CREDIT WAS SPENT, because arm A needed a door
          # building and a door with no validator behind it is worth proving
          # cold: 4,019 unit tests, 230/230 against the real container — raw CSS
          # survives Tailwind and the bundler to reach a served stylesheet, a
          # build that sent none has nothing appended, and the deploy for the
          # commit under test is green.
          # ATTEMPT 2. Attempt 1 (`css-axes-lido`) hung in the Grok pages call
          # for 26m48s and was killed by this job's own 30-minute cap. Its trace
          # is the diagnosis and it is unambiguous: design 83.4s (in 23161, out
          # 2075), Neon project, a 2-table schema applied and seeded, then `gen`
          # at 22:04:34 and NOTHING for the next 25 minutes. 8 credits for the
          # schema call, no site, and the isolate died with the hung fetch so
          # `waitUntil` did not rescue it either.
          #
          # THE THIRD TIME ON THIS SHAPE — run 9 (25m46s), run 13 (26.5m), this.
          # And runs 6, 8 and 14 published on the same path, so it is variance in
          # the provider rather than anything deterministic. On THIS brief
          # specifically it is now 1 published against 2 hung.
          #
          # SO THE BRIEF SHRANK AND NOTHING ELSE DID. The hang is in the pages
          # call, which is the one step whose duration scales with how much the
          # model has to write — four pages became two. Same picker (Grok is
          # proven funded; introducing an unknown provider mid-experiment adds a
          # variable rather than removing one), same feel description word for
          # word, because the feel is what a CSS experiment is actually about.
          # Both arms share it, so the comparison is untouched.
          # ── ATTEMPT 3, AND THE ONE VARIABLE THAT MOVED IS TIME ──────────────
          #
          # Attempts 1 and 2 both died at the SAME mark and neither was our code:
          #   `css-axes-lido` — design 83.4s, schema applied and seeded, `gen` at
          #     22:04:34, then 25 minutes of nothing until this job's own cap.
          #   `lido-axes`     — design 82.9s, same marks, ECONNRESET at 264.6s.
          # Two builds, one signature: the Grok pages call is where they stop.
          #
          # NEITHER RAN OUT OF BUDGET, and the reason is worth knowing before
          # reading the next run: `BUILDER_CALL_MS` and the whole-build deadline
          # are both `setTimeout` INSIDE the Worker isolate, and when the isolate
          # stops so do they. A bound that lives in the thing being bounded
          # cannot fire when that thing dies. So no ceiling of ours was ever
          # reached — they were killed from outside, by the runner cap and by
          # Cloudflare's ~285s connection reset respectively.
          #
          # SO EVERY CEILING WAS RAISED AND THE HARNESS STOPPED DEPENDING ON THE
          # SOCKET. `ctx.waitUntil` keeps the build running after a reset — run
          # 14 proved it, publishing ten minutes after its connection died — so
          # the script now watches the site and the `site_builds` trace instead
          # of exiting. A reset costs the response, not the site.
          #
          # BOTH ARMS RUN ON GROK, unchanged from attempts 1 and 2. It is the
          # proven-funded picker and swapping providers mid-experiment adds a
          # variable rather than removing one — Sonnet was queued while the arms
          # were parked and is deliberately reverted here.
          #
          # FRESH SLUGS FOR BOTH ARMS. `css-axes-lido` and `lido-axes` are both
          # claimed by husks, and ownership is what decides `revise` — re-running
          # either name would be read as an edit of an empty shell rather than
          # the first build it never got. `lido-b-axes` was queued and never
          # fired, so it is free, but a name carrying a parked attempt's history
          # is a name somebody will misread in a week.
          OWNER_SLUG: lido-free-a
          # THE PICKER IS GROK, AND IT IS A CONSTANT OF THIS EXPERIMENT.
          #
          # Both arms compare a STYLESHEET. Every other variable has to be held,
          # and the picker is the largest one there is: a different provider
          # writes different pages, different copy and a different amount of
          # everything. Attempts 1 and 2 were Grok, so attempt 3 is Grok — and
          # so is the free-CSS arm that follows it.
          #
          # SONNET WAS QUEUED HERE AND IS DELIBERATELY REVERTED. It was set while
          # the experiment was parked, on the reasoning that Sonnet reaches its
          # first token in ~4s against Grok at ~52s and so eats far less of a
          # ~285s budget. That reasoning is sound and it answers a DIFFERENT
          # question: with the ceilings gone the budget is no longer what
          # decides, and swapping providers now would mean arm A and arm B were
          # built by two different models. Worth running later as its own
          # comparison; not worth confounding this one.
          #
          # WHAT THE ARM ALSO ANSWERS, unchanged: whether the designer reaches
          # for an AUTHORED declaration block on any of the 29 axes rather than
          # a named option. `authored` on the response names the axes it wrote —
          # and run 14 is the reminder that reading a named option as an authored
          # one is easy to do: its `drift` backdrop was misreported as authored
          # because Lightning CSS had stripped a redundant keyword.
          OWNER_PICKER: grok
          # ── ARM A — THE MODEL WRITES ITS OWN STYLESHEET ─────────────────────
          #
          # `freeCss: true` swaps the `style` field out of `design_schema` for a
          # single `css` string. The 29 axes are GONE from the tool on this arm —
          # not made optional, replaced — so the model has no named option to pick
          # and no per-axis selector handed to it. What it gets instead is the hook
          # list (`[data-slot="button"]`, `[data-slot="card"]`, `.lucide` and the
          # rest) and a free hand.
          #
          # THIS IS THE ONE RULE THE PLATFORM OTHERWISE HOLDS ABSOLUTELY: "we own
          # the selector, the model owns the declarations". Arm A breaks it on
          # purpose, once, to find out what it buys. Everything downstream of the
          # model call is unchanged — `writeFreeCss` bounds the string at 40,000
          # characters, refuses a non-string, and appends it LAST so it wins on
          # source order over the theme, the tokens and the per-page tokens.
          #
          # SAME BRIEF, SAME PICKER, SAME CEILINGS AS ARM B. Only this flag and the
          # slug move between the two runs.
          OWNER_FREE_CSS: "1"
          OWNER_BRIEF: "An open-air lido cafe on the south coast, beside a 1930s seawater swimming pool. One page shows the menu of coffee, ice cream and toasties with prices in pounds, readable without signing in. One page books a poolside table with a short form - name, phone, how many people, what time. The feel is late afternoon sun on the water: faded pastel paintwork, sun-bleached concrete, long low light."
        run: node scripts/build-as-owner.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-as-owner-log
          path: build-as-owner-log.md
          if-no-files-found: ignore
