# ONE build as the owner's own account, with a full step log — see
# scripts/build-as-owner.mjs for what it does and does not do (no password,
# no teardown of anything).
#
# Fires only on a push touching its own two files AND whose commit message
# carries `[owner build]` — OPT-IN, because a run spends the owner's real
# credits (~130 on a cold build). The path filter alone was the whole gate at
# first, and it fired on the wrong thing immediately: the fix for run 2's
# step-7 crash touches the script, so pushing it would have bought a third
# build nobody asked for. A trigger that spends money is asked for by name,
# never inherited from a file path. The commit that DOES run it should also
# carry the repo's skip marker so `build smoke` does not burn a second build
# on the same push.
#
# AND THE GATE FIRED ON ITS OWN FIRST OUTING (2026-08-21): the commit that
# ADDED it spelled the marker while explaining it, contains() matched the
# explanation, and the run had to be stopped mid-flight — a one-minute
# sign-in block on the build account, so the script died at its own step 2
# with nothing spent and the ledger untouched. The same shape this repo has
# recorded twice for the skip-CI marker and across nine guards: prose about
# a rule, tripping the rule. The discipline is therefore the skip marker's,
# applied here: in a commit message, write "the owner-build marker" and
# never spell it — spell it ONLY in the one commit deliberately buying a
# build. (Cancelling the run from a session is not a fallback: the API
# answers 403, the same scope wall as workflow_dispatch.)
name: build as owner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-as-owner.yml'
      - 'scripts/build-as-owner.mjs'

jobs:
  build:
    # The opt-in gate. Without the marker a push here (this very fix, say)
    # skips instantly and spends nothing.
    if: contains(github.event.head_commit.message, '[owner build]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The deploy for this same push replaces the Worker (~3.5 min). Wait it
      # out so the build runs against the code that just shipped rather than
      # racing the rollout — the exact mistake edit-smoke recorded on
      # 2026-08-12, when 90s of sleep tested a Worker mid-replacement.
      - name: wait for this push's deploy
        run: |
          for i in $(seq 1 40); do
            state=$(curl -sf "https://api.github.com/repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=10" \
              | node -e 'let s="";process.stdin.on("data",(c)=>s+=c).on("end",()=>{const d=JSON.parse(s);const r=(d.workflow_runs||[]).find((x)=>x.name==="Deploy to Cloudflare");console.log(r?r.status+"/"+r.conclusion:"none");})') || state=err
            echo "deploy: $state (poll $i)"
            case "$state" in
              completed/success) exit 0 ;;
              completed/*) echo "the deploy failed — building against it proves nothing"; exit 1 ;;
            esac
            sleep 15
          done
          echo "deploy never finished in 10 minutes"; exit 1
      - name: build as the owner
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          OWNER_EMAIL: aniascristian@gmail.com
          OWNER_BASE_URL: https://gofarther.dev
          # A FRESH SLUG AGAIN. Runs 3 and 4 both died at the wall on THIS
          # brief and each left a claimed slug plus a live Neon project behind
          # (`mathaq-alemarat`, `mathaq-dubai`), so neither name can be reused:
          # ownership is what decides `revise`, and re-running one would be read
          # as an edit of an empty husk rather than the first build it never got.
          OWNER_SLUG: fold-lane-bakery
          # RUN 8 (2026-08-21): THE AUDIT FIXES, AGAINST A REAL BUILD.
          #
          # 80 findings, 60 confirmed by an independent skeptic, and everything
          # merged so far is verified by the unit suite (3693), a real Postgres
          # (`neon e2e`) and the real container (`site build`) — and by NO live
          # build, because `build smoke` cannot run: the Anthropic account has no
          # credit, so it refuses at `stage: design` in about a second.
          #
          # GROK IS WHAT MAKES THIS RUNNABLE AT ALL. The design and pages calls
          # go to xAI; the Anthropic-pinned calls (the router, the seed top-up)
          # fail soft by design — `readRouting`'s unclear-resolves-to-build rule
          # and `topUpSeed`'s can-never-fail-a-build contract — so an empty
          # Anthropic balance costs a routing decision and a seed net, not the
          # build. Runs 6 and 7 both proved that live.
          #
          # WHY THIS BRIEF. It is deliberately the ordinary shape rather than the
          # demanding one, because what is under test is the FIXES, not the wall:
          #   - a public menu the visitor reads signed out, which is the
          #     read/write pair whose access `coerceTable` was silently flipping
          #     to `collect` on a revise — the critical, exercised in the
          #     direction that publishes a table rather than hides one
          #   - seeded display rows, so an unseeded menu would show as empty
          #   - a booking form (a `collect` table), which is the write half of
          #     the same grid and must stay unreadable to the public
          #   - enough pages to make the render check and the prerender do real
          #     work in the rebuilt spawned child — the sandbox critical
          #
          # A FRESH SLUG, because ownership is what decides `revise`: reusing a
          # claimed name would test the edit path when what is wanted is a first
          # build.
          #
          # FIRED against a tree measured green at 3718 passing / 0 failing,
          # with `site build` (the real container), `neon e2e` (a real Postgres)
          # and the Cloudflare deploy all green on the merged commit. What this
          # run adds is the one thing none of those can: a real customer build,
          # end to end, through the rebuilt sandbox.
          #
          # THE BRIEF IS RUN 3's, VERBATIM, and that is the point. It died at
          # 286s and again at 301s, which is exactly the cluster `limits.cpu_ms`
          # has since been raised for. Changing a single word would make a
          # success unattributable — this is the same input against one changed
          # setting, which is the only shape that can settle it.
          #
          # AND IT IS DELIBERATELY THE DEMANDING ONE. Runs 5 and 6 were cut down
          # to isolate Grok from the wall; that was right then and it is the
          # wrong test now. Four-plus pages, a booking form, AED prices and an
          # explicit gallery page — Arabic also costs more tokens per character,
          # so page generation runs longer, and run 6 was already 156s of
          # generation inside a 378s build. If five minutes of CPU has a floor
          # under real work, this is what finds it.
          #
          # WHAT IT PROVES BEYOND THE WALL: right-to-left has never run live.
          # It shipped 2026-08-19 and every claim about it comes from local
          # renders and unit tests — no customer build has ever carried
          # `dir="rtl"`, so `normalizeLang` reading `ar` out of a real designer
          # answer is itself untested end to end.
          #
          # GROK BECAUSE IT IS THE ONLY PICKER THAT CAN BUILD. The Anthropic
          # account is out of credit (measured 2026-08-21: `billing: true` at
          # `stage: design`), so `sonnet` and `opus` refuse in about a second.
          OWNER_PICKER: grok
          OWNER_BRIEF: "A neighbourhood sourdough bakery in Bristol. Visitors browse the daily bake list with prices in pounds without signing in, and order a collection slot through a short form — name, phone, the loaf they want, and a pickup time. There is a page about the starter and how the bread is made, and a page with the opening hours and the address."
        run: node scripts/build-as-owner.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-as-owner-log
          path: build-as-owner-log.md
          if-no-files-found: ignore
