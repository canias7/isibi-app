          # build it never got.
          #
          # READ: everything run 52 could not reach — one page shaped as the
          # management workspace, `sections` carrying widths in the layout
          # words, a theme by name off the shortlist, and the standing proofs
          # (kind tool, images 0/0, readable CTA, honest footer).
          #
          # Fresh slug: northgroup-9 through -16 are the owner's LIVE sites
          # now — re-using any would revise it.
          # DISPATCH OVERRIDES, PUSH KEEPS THE DEFAULTS. An edit dispatch names
          # its own live site; a build dispatch or a marker push falls back to
          # the fresh slug and picker below. The brief is build-only and stays.
          OWNER_SLUG: ${{ github.event.inputs.slug || 'shoeroom-1' }}
          OWNER_PICKER: ${{ github.event.inputs.picker || 'grok' }}
          OWNER_BRIEF: "An online shoe shop that sells every kind of shoe - trainers, boots, formal shoes, sandals, kids' shoes and slippers. Shoppers browse what is in stock, filter by kind and by size, and see each pair with its picture, its price and which sizes are left. They open a pair to read what it is made of and pick their size. They add pairs to a basket and pay by card. There is also a page about the shop, which has been on the same street for forty years, and how returns work. It should feel like a proper shop rather than a warehouse - the shoes are the thing you see first, prices plain, and nothing in the way of buying."
        run: node scripts/build-as-owner.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-as-owner-log
          path: build-as-owner-log.md
          if-no-files-found: ignore
