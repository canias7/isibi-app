          # ~19-38 credits of real fal spend on top of ~15 of model, against a
          # balance of 69. Affordable, and the first paid photographs of the
          # one-page era either way.
          #
          # READ: (1) one job, the other screens named as left out; (2) a
          # shopfront that is actually a shopfront — pictures, prices, an Add
          # to basket verb — where three runs running have been dense tools;
          # (3) whether it is honest about checkout, which needs the owner's
          # own Stripe key and cannot work today.
          #
          # REFIRED: the first attempt died at the design call with `upstream:
          # 403` in 4.2 seconds — the xAI account was out of credit, which that
          # provider answers as a refused credential rather than a billing 400.
          # `gen probe` said the same thing independently and for free on the
