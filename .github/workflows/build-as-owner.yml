# ONE build as the owner's own account, with a full step log — see
# scripts/build-as-owner.mjs for what it does and does not do (no password,
# no teardown of anything).
#
# Fires only on a push touching its own two files AND whose commit message
# carries `[owner build]` — OPT-IN, because a run spends the owner's real
# credits (~130 on a cold build). The path filter alone was the whole gate at
# first, and it fired on the wrong thing immediately: the fix for run 2's
# step-7 crash touches the script, so pushing it would have bought a third
# build nobody asked for. A trigger that spends money is asked for by name,
# never inherited from a file path. The commit that DOES run it should also
# carry the repo's skip marker so `build smoke` does not burn a second build
# on the same push.
#
# AND THE GATE FIRED ON ITS OWN FIRST OUTING (2026-08-21): the commit that
# ADDED it spelled the marker while explaining it, contains() matched the
# explanation, and the run had to be stopped mid-flight — a one-minute
# sign-in block on the build account, so the script died at its own step 2
# with nothing spent and the ledger untouched. The same shape this repo has
# recorded twice for the skip-CI marker and across nine guards: prose about
# a rule, tripping the rule. The discipline is therefore the skip marker's,
# applied here: in a commit message, write "the owner-build marker" and
# never spell it — spell it ONLY in the one commit deliberately buying a
# build. (Cancelling the run from a session is not a fallback: the API
# answers 403, the same scope wall as workflow_dispatch.)
name: build as owner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-as-owner.yml'
      - 'scripts/build-as-owner.mjs'

jobs:
  build:
    # The opt-in gate. Without the marker a push here (this very fix, say)
    # skips instantly and spends nothing.
    if: contains(github.event.head_commit.message, '[owner build]')
    runs-on: ubuntu-latest
    # 15 WAS TOO TIGHT AND IT COST US THE DIAGNOSTICS WE PAID FOR.
    #
    # Run 8 (2026-08-21) signed in, POSTed the build, and was killed by this cap
    # at 11m58s into the request with no response. THE SITE PUBLISHED ANYWAY —
    # `fold-lane-bakery` served 200 with seeded rows — so nothing was lost but
    # the answer: the cost breakdown, the generator's own notes, and the render
    # report all ride on that response, and 94 credits bought a site we then had
    # to verify by hand with curl.
    #
    # The deploy wait alone takes ~3.5 minutes of this budget before the build
    # starts, which is what makes 15 tighter than it reads. Measured build
    # durations: 378s (run 6), 507s (run 7), >718s (run 8, unfinished).
    #
    # 30 rather than 20: the point of the cap is to stop a wedged runner billing
    # for an hour, not to bound a build we already know can take twelve minutes.
    # A build that outruns THIS is a real finding rather than a tight budget.
    #
    # ── AND THEN 30 BECAME THE LAST BINDING CEILING (2026-08-22, owner's call) ──
    #
    # Owner: "we gonna delete any timeout there is anywhere, pls, just let the
    # model work, pls ok, forget about time, just lets it be". Five bounds on the
    # build path were raised past any plausible binding value in the same change
    # (BUILDER_CALL_MS, BUILD_BUDGET_MS, CONTAINER_CALL_MS, STEP_TIMEOUT,
    # DISPATCH_CALL_MS) — and with those gone THIS is what would have killed the
    # run, exactly as it killed attempt 1 of build 1 at 26m48s.
    #
    # 350 is five minutes under GitHub's own hard 360-minute maximum. It is not a
    # judgement about how long a build should take: it is the largest number the
    # platform allows, which is the closest thing to "no timeout" available here.
    # The script no longer needs the runner alive to get a site either — a dead
    # socket is expected now and it watches the site instead — so what this cap
    # really bounds is how long we are willing to WATCH, not how long the build
    # may run.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The deploy for this same push replaces the Worker (~3.5 min). Wait it
      # out so the build runs against the code that just shipped rather than
      # racing the rollout — the exact mistake edit-smoke recorded on
      # 2026-08-12, when 90s of sleep tested a Worker mid-replacement.
      - name: wait for this push's deploy
        run: |
          for i in $(seq 1 40); do
            state=$(curl -sf "https://api.github.com/repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=10" \
              | node -e 'let s="";process.stdin.on("data",(c)=>s+=c).on("end",()=>{const d=JSON.parse(s);const r=(d.workflow_runs||[]).find((x)=>x.name==="Deploy to Cloudflare");console.log(r?r.status+"/"+r.conclusion:"none");})') || state=err
            echo "deploy: $state (poll $i)"
            case "$state" in
              completed/success) exit 0 ;;
              completed/*) echo "the deploy failed — building against it proves nothing"; exit 1 ;;
            esac
            sleep 15
          done
          echo "deploy never finished in 10 minutes"; exit 1
      - name: build as the owner
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          OWNER_EMAIL: aniascristian@gmail.com
          OWNER_BASE_URL: https://gofarther.dev
          # A FRESH SLUG AGAIN. Runs 3 and 4 both died at the wall on THIS
          # brief and each left a claimed slug plus a live Neon project behind
          # (`mathaq-alemarat`, `mathaq-dubai`), so neither name can be reused:
          # ownership is what decides `revise`, and re-running one would be read
          # as an edit of an empty husk rather than the first build it never got.
          # ── ARM C: THE FIVE LOOK FIELDS ARE GONE (2026-08-23, owner's call) ──
          #
          # "for the look, the css, we are gonna delete those 5 steps into 1
          # step, which is gonna be called css, and we are gonna give the model
          # freedom, so with no words, the model is gonna make the css."
          #
          # SAME BRIEF, SAME PICKER, THIRD ARM — which is what makes this worth a
          # build rather than a guess. Arm B had 29 axes, arm A swapped them for
          # a free `css` string, and this one has NO look field of any kind
          # except `css`: `seeds`, `fonts`, `style`, `tokens` and `tokensPage`
          # all left `design_schema`. 23 fields -> 19, 13 required -> 11.
          #
          # AND ARM A IS NOT EVIDENCE AGAINST IT, which is the whole reason to
          # spend this. Arm A KEPT `seeds` — so there was still a field asking
          # for the palette, and the palette is exactly what landed while the
          # free string carried 7 rules against the axes' 24. This repo's own
          # words for that shape: "a hatch beside a full menu is a hatch nobody
          # opens." With nothing else to answer, the question is unavoidable.
          #
          # WHAT TO READ OFF THE RESULT: the served stylesheet's rule count
          # against arm B's 24 and arm A's 7, whether a typeface was named at all
          # (the `css` report carries `fonts` and `missingFonts`), whether any
          # core token was set (`definesCore`), and whether a `body[data-page]`
          # scope appears — that last one is the capability `tokensPage` used to
          # be, and it is only reachable because the tool now says `data-page`
          # exists.
          #
          # THE PREVIOUS TWO ARMS, KEPT because the comparison rests on them.
          # Two builds, one variable. Arm B (`lido-axes-b`, the 29 axes) and arm
          # A (`lido-free-a`, the axes swapped for one free `css` string). Both
          # published, same brief, same picker, same ceilings.
          #
          # A RULE-LEVEL DIFF OF THE TWO STYLESHEETS IS THE RESULT: arm B carried
          # 24 rules the other did not, arm A carried 7 — and of those 7, four
          # are Tailwind and the palette, one is the type scale, one is shadows
          # switched off, and one is `.lucide{stroke-width:2px}`, the template's
          # DEFAULT rather than a choice. Given a free hand and no menu, the
          # model wrote nothing.
          #
          # AND ARM B'S BACKDROP WAS AUTHORED, which is what makes that a real
          # comparison rather than a menu beating a blank page. Its body carries
          # hand-written hex (`#98b8bd1a`, `#f5c6a461`, `#efe4cf`) in both modes;
          # BACKDROP_LAYERS and DECOR_LAYERS emit zero hex literals between them,
          # oklch survives elsewhere in the same bundle so Lightning CSS did not
          # downconvert, and the arm's own marker is absent. The model is already
          # writing raw CSS THROUGH the axes — what they supply is the selector
          # and the property allow-list, and removing those cost everything.
          #
          # Owner: "We are gonna stick with the axes." That was the call on the
          # EXPERIMENTAL door beside the axes; the call above replaced the axes
          # themselves, so the free-CSS door is not back — there is one field.
          # ── WHAT ARM C ACTUALLY DID (2026-08-23): IT DID NOT PUBLISH ────────
          #
          # `lido-cafe`, run 32615909471. Everything up to page generation
          # worked and is in the trace: design 76.4s (in 18,998 / out 2,265),
          # a Neon project, two tables applied and seeded, all inside 86s. Then
          # the pages call never returned — the row sat at the `gen` mark for
          # 35+ minutes and the site was 404 throughout. Run 9's shape exactly
          # (Arabic on Grok, 25m46s in generation, no answer), and with every
          # ceiling raised to an hour nothing of ours will refuse it, so from
          # outside "still generating" and "the isolate is gone" are one
          # observation. Cost: 7 credits (148 -> 141), the design settlement;
          # page generation charges after publish, so that is all it will be.
          # Left behind: a claimed slug and a live Neon project — the husk this
          # file already records for runs 3, 4, 9, 10 and 13.
          #
          # SO THE CSS QUESTION IS STILL HALF-ANSWERED, and the half it did
          # answer is the design call, where arm A and arm C are both cold and
          # therefore comparable: input 20,313 -> 18,998 (-1,315, the tool going
          # 84,691 -> 69,088 chars) and output 1,572 -> 2,265 (+693, +44%). The
          # predicted trade, measured: a smaller cached input bought with a
          # bigger output, and Grok prices output at 3x input. Net ~+$0.0015 on
          # that call — both still round to 7 credits, so at this scale it is a
          # wash and the DIRECTION is what is now established rather than
          # reasoned. The pages call is where it would bite and is exactly what
          # this run did not produce.
          #
          # AND THE HARNESS LOST THE BUILD BEFORE THE BUILD LOST ITSELF, which
          # is the fixable half. The reset at 264.8s is ordinary and survivable
          # BY DESIGN — the script watches the site instead of the socket. It
          # could not, because OWNER_SLUG was unset and the designer-chosen name
          # existed only in the answer the reset destroyed. Arms A and B rode
          # the identical reset purely because they had been handed names. So
          # "the designer names the site" and "a reset is survivable" were
          # mutually exclusive, which is backwards: a customer's build names
          # itself too. FIXED IN THE SCRIPT rather than papered over here —
          # `discoverSlug` reads the claim off `site_backends` (written at
          # provisioning, ~90s in, long before the reset), scoped to this
          # account AND to this build's own POST so it can never hand back a
          # site published hours ago and report it as this run's.
          #
          # NO SLUG, and that is now safe rather than merely tidy. `lido-axes-b`,
          # `lido-free-a` and `lido-cafe` are all spent — a slug is claimed by
          # whoever builds it first, and ownership is what decides `revise`, so
          # naming any of them again would be read as an edit of a husk rather
          # than a fresh build. Unset is the default: the designer names the
          # site, which is what it does for a customer, and the recovery above
          # is what makes that survive a dead socket. Set OWNER_SLUG explicitly
          # only when a run needs a name it controls.
          # ── RUN 33: A CRM, AND THE FIRST BUILD AGAINST THE REPAIR PASS ─────
          #
          # Owner: "ok make a build, do crm". A DIFFERENT SHAPE ON PURPOSE —
          # every build this account has bought since 2026-08-21 has been a cafe
          # or a bakery, so the pipeline has been measured almost entirely on
          # brochures. A CRM is the other half of what this platform claims to
          # build, and it is the shape that has failed here before: on
          # 2026-08-21 a CRM brief came back as a login page over a working
          # backend, and the pages it did write reached for cards where a table
          # was the answer.
          #
          # WHAT THIS RUN ANSWERS THAT THE LIDO RUNS COULD NOT:
          #
          #   1. THE REPAIR PASS, live for the first time (4b4fbb5). If the
          #      render check finds a crashed or blank route, one Haiku call per
          #      broken file goes out and the fixed page is recompiled BEFORE
          #      anything publishes. Read `renderRepaired` / `renderRepairFailed`
          #      / `renderRepairRefused` / `renderRepairDropped` on the response.
          #      A silent absence of all four is the ordinary clean build.
          #      Arm D is exactly why this exists: `the-lido-cafe` published with
          #      its booking form dead and the check called it clean.
          #   2. WHETHER A MEMBER-SCOPED SITE STILL COMES OUT AS A SITE. A CRM is
          #      `user`/`admin` tables, not `display`/`collect` — so nothing is
          #      publicly readable by design, which is the exact condition that
          #      cost a whole build on 2026-08-10 before `schemaDigest` learned
          #      to say whether a signed-out visitor can read anything at all.
          #   3. WHETHER THE MANIFEST REACHES THE RECORDS COMPONENTS. `data-table`,
          #      `row-actions`, `pagination`, `stat-card` were unreachable until
          #      the whole 2,112-name kit was wired, because the old palette was
          #      measured from a brochure corpus. `components` on the response is
          #      the answer.
          #   4. WHETHER `images: []` IS HONOURED. The brief says no photographs
          #      and means it — a working tool legitimately wants none. The
          #      designer has been able to declare that since 2026-08-23 and no
          #      build has ever exercised it. `images.planned` of 0 with no
          #      `images.error` is the pass.
          #   5. THE PAGE-LAYOUT QUESTION, on a shape with no worked example. The
          #      four reference pages left the prompt on 2026-08-24 and were all
          #      a barber shop; a records screen has nothing in the prompt that
          #      resembles it.
          #
          # THE PICKER STAYS GROK. It is the platform default, it is what the
          # last four builds used, and the durations are therefore comparable —
          # arm D's 528,542ms is the number this run is read against.
          #
          # AND THE POST NOW HAS A CEILING (7969c8e). Arm D's run sat 75 minutes
          # past a build that had finished, because `postLong` had no bound of
          # any kind and a silently dead socket hangs `node:https` for ever. If
          # this run's socket dies it gives up at 18 minutes and watches the site
          # instead, which is the branch that already worked.
          # ── RUN 34 (2026-08-25): the first frontend-only build, on a joinery
          # brief. Published as `oak-and-ash` with `provision db: 0` and
          # `schema tables: 0` — no Neon project — no data call in 498KB of
          # bundle, no form, and every figure from the brief on the page. Kept as
          # the record; the brief itself is gone because it was MINE and not the
          # owner's, which is the mistake recorded in the next block.
          #
          # ── RUN 35: THE CRM, FRONTEND ONLY ─────────────────────────────────
          #
          # Owner: "I know that a crm requires a db but the purpose is to build
          # the frontend, you can build the frontend and ofcs is not gonna work
          # but the point is that first build does crm, so do a freaking crm just
          # frontend, pls dont worry about db rn."
          #
          # THE BRIEF IS RUN 33'S, VERBATIM, AND THAT IS THE POINT. Run 34
          # replaced it with a brochure on my own reasoning — a CRM is a database,
          # so a frontend-only pipeline "cannot serve it" — and the owner
          # overruled that. The reasoning was not wrong about the database and it
          # was wrong about what the run is FOR: a first build produces the
          # FRONTEND, and whether that frontend works without a backend is a
          # question about step 5, not a reason to avoid the shape. Changing a
          # brief the owner named is not a technical call.
          #
          # SO THIS IS THE HARDEST CASE THE SPLIT HAS, deliberately. The brief
          # asks for sign-in, a sortable filterable pipeline, stage totals, a
          # form to log a call, and contacts linked to companies — and
          # FRONTEND_SCHEMA_SYSTEM says in as many words that sign-in, forms that
          # submit and accounts do not exist on this site. **The brief and the
          # system prompt directly contradict each other and the model has to
          # resolve it.** A brochure brief never puts them in conflict; this does,
          # on the first try.
          #
          # WHAT TO READ OFF THE RESULT:
          #
          #   1. `backend=none tables=0` on the watch line. The split firing.
          #   2. NO DATA CALL IN ANY PAGE — `useRows`/`usePublicRows`/
          #      `useCreateRow`. On a CRM brief this is the real test: every
          #      instinct in the training data says fetch the deals.
          #   3. WHAT IT DID WITH THE FORM AND THE SIGN-IN. Refusing them is
          #      correct per rule 2. Drawing a dead login page is the 2026-08-21
          #      failure returning. Drawing the pipeline with the figures written
          #      in is the good outcome.
          #   4. WHETHER THE RECORDS COMPONENTS ARE REACHED — `data-table`,
          #      `row-actions`, `pagination`, `stat-card`. Unreachable until the
          #      whole kit was wired, and no brochure build has ever needed them.
          #   5. `images: []` HONOURED. The brief says no photographs and means
          #      it. Run 34 bought two on a brief that wanted them; this one
          #      should buy none.
          #
          # RUN 33 IS THE CONTROL AND IT DIED AT `gen` after a 233,502ms design
          # call, so the comparison is against a build that never finished. That
          # is worth knowing rather than glossing: if this one dies the same way,
          # the CRM shape is the suspect and not the split.
          #
          # NO SLUG — the designer names it, as it does for a customer, and
          # `discoverSlug` recovers the name off `site_backends` if the socket
          # dies. Proven on run 34 to still work with no database: `claimSiteSlug`
          # writes the ownership row with `neon_db: ""` at the same point in the
          # build the claim was always written.
          #
          # THE PICKER STAYS GROK — the platform default, so durations compare.
          #
          # ATTEMPT 1 WAS REFUSED AT THE GATE, and nothing was spent: `{"ok":false,
          # "error":"not enough credits","cost":16,"msg":"A build needs about 16
          # credits and you have 9."}`. Run 34 — the joinery brief substituted on
          # my own initiative for the CRM the owner asked for — had taken the
          # balance 79 -> 9, so the credits for the requested build went on one
          # that was not requested. Recorded here rather than quietly retried.
          #
          # `buildFloor` DID EXACTLY ITS JOB and that is worth one line: it
          # refused up front naming both figures, rather than taking the deposit
          # and dying partway. Topped up to 250 by a direct ledger write (never
          # `add_credits`, which is mint-gated and writes a `purchases` row).
          OWNER_PICKER: grok
          OWNER_BRIEF: "A sales CRM for a five-person team that sells industrial coffee machines to cafes across the north of England. Everyone on the team signs in - nothing here is public except a one-page front door. One page is the pipeline: every deal with its company, its value in pounds, which stage it is at and who owns it, sortable and filterable by stage, with the total value of each stage across the top. One page is a single deal: the company details, every call and email logged against it in date order, and a form to log another. One page lists contacts, each one linked to their company. The feel is a working tool rather than a website - dense rows, figures that line up, one accent colour used only where something needs attention, and no photographs anywhere."
        run: node scripts/build-as-owner.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-as-owner-log
          path: build-as-owner-log.md
          if-no-files-found: ignore
