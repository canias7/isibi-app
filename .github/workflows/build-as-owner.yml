          # or an analysis screen) and the designer has to pick which.
          #
          # READ: (1) ONE job, with the other screens named as left out rather
          # than stacked; (2) a component list under 15 and honestly short
          # rather than padded to a quota; (3) the standing proofs — kind tool,
          # images 0/0, a theme by name, no marketing bands, honest footer.
          #
          # ── RUN 53: THE SAME MEASUREMENT, PAST OUR OWN CAP ──
          #
          # Run 52 proved the one-page world end to end and died on a constant
          # from the five-page one: the designer planned ONE page, the writer
