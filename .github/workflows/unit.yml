# The unit suite, on every push but the merge.
#
# NOT ON main SINCE 2026-09-09 — see `on:`. A merge here is a fast-forward of a
# sha this already ran on the branch, so the merge run was a second reading of
# an identical tree.
#
# It had no home. site-build runs only page-gen.test.mjs, and `npm test` — the
# one command that runs all of test/*.test.mjs — lived solely in neon-e2e, which
# triggers on site-db.mjs / site-schema.mjs and needs a Neon key. So site-data
# and sweep-orphan could go red on main without anything noticing.
#
# No secrets, no browser, no container, no Neon project. ~30 seconds.
name: unit tests

on:
  push:
    # NOT ON THE MERGE (owner, 2026-09-09: "I JUST WANT THE MERGE THING
    # THERE").  main is the merge and a merge here is a fast-forward of a sha
    # this already ran on the branch, so re-running it on main proves nothing
    # new.  Every other branch is unchanged.
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
