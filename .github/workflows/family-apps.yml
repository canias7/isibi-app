# Every family reference app, built and driven for real. src/family-pages is
# excluded from BOTH static tsc passes (its routes only exist in a tree
# generated from its own files), so this workflow is the only thing standing
# between a broken family page and the prompt that cites it as known-good.
#
# Costs nothing: no model call, no container, no Neon project.
name: family apps

on:
  push:
    paths:
      - 'builder/lovable/template/src/family-pages/**'
      - 'builder/site-layouts.mjs'
      - 'builder/build-server.mjs'
      - 'builder/lovable/template/src/components/**'
      - 'test/integration/family-apps.mjs'
      - '.github/workflows/family-apps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # 33 MINUTES FOR 100 FAMILIES, measured on a run that actually finished —
    # the first one in this workflow's recent history, because the old cap was 25
    # and every run before it was CANCELLED at exactly 25.4.
    #
    # THE FIGURE THAT WENT IN HERE FIRST WAS ~53, AND IT WAS WRONG. It came from
    # timing one family in a dev container (`FAM_ONLY=salon`, 32s) and
    # multiplying. The CI runner does each in ~20s, so the extrapolation was 60%
    # high — recorded because it was written as "MEASURED", which it was, of the
    # wrong machine.
    #
    # The old 25 was not a squeeze TanStack Start caused: runs from before that
    # work hit it identically. A timeout is CANCELLED rather than failed, and a
    # cancelled run is not red, which is why nobody noticed a check that had
    # stopped producing a verdict.
    #
    # 75 leaves better than double the headroom for a slow runner and for the npm
    # ci and browser download in front of it. If it ever needs to be faster the
    # answer is sharding the family list across a matrix, not trimming coverage.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: builder/lovable/template/package-lock.json

      - run: npm ci --no-audit --no-fund --loglevel=error
        working-directory: builder/lovable/template

      - run: npx playwright install --with-deps chromium
        working-directory: builder/lovable/template

      - run: node test/integration/family-apps.mjs
        env:
          FAM_SHOTS: fam-shots

      # The renders, for eyes. Typecheck-clean grey charts taught this repo
      # that a screenshot is part of the definition of done.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: family-app-renders
          path: fam-shots/
          if-no-files-found: ignore
