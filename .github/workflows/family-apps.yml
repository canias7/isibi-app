# Every family reference app, built and driven for real. src/family-pages is
# excluded from BOTH static tsc passes (its routes only exist in a tree
# generated from its own files), so this workflow is the only thing standing
# between a broken family page and the prompt that cites it as known-good.
#
# Costs nothing: no model call, no container, no Neon project.
name: family apps

on:
  push:
    paths:
      - 'builder/lovable/template/src/family-pages/**'
      - 'builder/site-layouts.mjs'
      - 'builder/build-server.mjs'
      - 'builder/lovable/template/src/components/**'
      - 'test/integration/family-apps.mjs'
      - '.github/workflows/family-apps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # 100 families at ~32s each is ~53 minutes, MEASURED (`FAM_ONLY=salon`, which
    # builds and drives one family end to end). The old 25 was not a squeeze that
    # Start caused — every run in the recent history hit it exactly, including
    # ones from before that work — so this check has not produced a verdict in a
    # long time. A timeout is CANCELLED rather than failed, and a cancelled run
    # is not red, which is why nobody noticed a check that had stopped checking.
    #
    # 75 leaves headroom for a slower runner and for the npm ci and browser
    # download in front of it. If it ever needs to be faster the answer is
    # sharding the family list across a matrix, not trimming what is covered.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: builder/lovable/template/package-lock.json

      - run: npm ci --no-audit --no-fund --loglevel=error
        working-directory: builder/lovable/template

      - run: npx playwright install --with-deps chromium
        working-directory: builder/lovable/template

      - run: node test/integration/family-apps.mjs
        env:
          FAM_SHOTS: fam-shots

      # The renders, for eyes. Typecheck-clean grey charts taught this repo
      # that a screenshot is part of the definition of done.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: family-app-renders
          path: fam-shots/
          if-no-files-found: ignore
