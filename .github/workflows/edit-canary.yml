# The canary for the queued edit path — see scripts/edit-canary.mjs.
#
# FREE BY DEFAULT. The four confirmations spend nothing: they lean on
# `escalate("empty")`, which the edit route answers with `cost: 0` before any
# model call and AFTER the async fork — so an empty instruction exercises the
# whole round trip (enqueue, claim, replay, finalize) and stops one line short
# of the first thing that costs money.
#
# THE PAID EDIT NEEDS `spend: yes`, and it runs exactly once. It also refuses to
# run at all if a free check failed, because at that point the paid edit would
# tell us less than the free ones already have.
#
# NO MARKER GATE, deliberately: the default run is free, so gating it behind the
# opt-in marker would make the cheap thing hard to do and the expensive thing
# the default. The expensive half has its own switch.
name: edit canary

on:
  # ── OFF THE MERGE (owner, 2026-09-09: "I JUST WANT THE MERGE THING THERE") ──
  #
  # This fired on a push to main, so it ran on every merge.  Nothing here is
  # deleted: the trigger below is parked, and `workflow_dispatch` still starts
  # this workflow by hand.  TO PUT IT BACK: uncomment the block.
  #   push:
  #     branches: [main]
  #     paths:
  #       - 'scripts/edit-canary.mjs'
  #       - '.github/workflows/edit-canary.yml'
  workflow_dispatch:
    inputs:
      spend:
        description: 'Run the ONE paid edit as well (yes/no)'
        required: false
        default: 'no'
      instruction:
        # REQUIRED WHEN SPENDING, AND THE SCRIPT IS WHERE THAT IS ENFORCED.
        # `required: true` here would demand an ask for every FREE dispatch
        # too, which is the run whose whole job is to cost nothing. The demand
        # belongs where the spend is: `edit-canary.mjs` refuses a blank one
        # above the routing call. Run 14 was pressed with this box empty and
        # the script substituted a default, so it spent on an ask nobody made.
        description: 'What to change. REQUIRED when spend=1 — there is no default, and a blank one refuses.'
        required: false
        default: ''
      read_job:
        # A MODE, NOT A FLAG. Filled in, the script signs in, reads that job's
        # row, its ledger rows and its trace candidates, and EXITS — above the
        # preflight, so the routing call, the edit POST, the watch and the
        # browser are all unreachable. It spends nothing and writes nothing,
        # and `spend` is ignored while it is set.
        #
        # It exists because run 14's write-up said the edit "was never billed"
        # on the strength of the balance moving by 2, which is a net reading
        # and cannot tell a routing call of 2 from a charge of 20 refunded.
        description: 'READ ONE EXISTING JOB AND STOP: a job id. Spends nothing, changes nothing, and ignores every input below.'
        required: false
        default: ''
      restore_version:
        # A MODE, NOT A FLAG, like read_job. Filled in, the script runs the
        # free checks, puts that ONE saved version back through the same route
        # the app's Versions panel calls — only after finding it in the site's
        # own version list — waits until the site itself reports it, reads the
        # restored source, and STOPS. `spend` is off while it is set.
        #
        # It exists because the restore is owner-gated: a session holding no
        # Supabase token cannot press it, and this workflow already signs in as
        # the owner.
        description: 'PUT ONE SAVED VERSION BACK, THEN READ IT AND STOP: a version id (14 digits, a dash, up to 6 letters/digits). Free. Never spends.'
        required: false
        default: ''
      ui_scenario:
        # A MODE, like the two above. Filled in, the script runs the free checks
        # and the before-read, then drives the REAL APP in a real Chromium,
        # signed in as the owner: it opens the site's card, attaches a file with
        # the + button, types each message, presses Send and waits for each
        # reply before the next — one tab, no reload. What is sent is a named
        # scenario in scripts/canary-ui.mjs, never text from this form, and it
        # is tied to one site. With spend=yes each message is sent; otherwise it
        # stops before the first Send. "What to change" is ignored.
        #
        # A SCENARIO THAT CHANGES A ROW (4b-d1-price) also reads that row
        # immediately before its message, reads it again after the reply, and
        # puts the one field back through the owner route with no model call —
        # only while it reads the value the message set. 4b-d1-restore is that
        # put-back alone, for a run that could not finish it: no app, no message.
        #
        # THE RULES TEST (4b-rules-close, on lido-axes-b) sends one message that
        # should close the site's bookings, then submits ONE real visitor
        # booking through the site's own /book form, which must be refused. The
        # rehearsal presses "Book a table" in a tab whose wall stops the request,
        # so it sends nothing. See the approvals box below.
        #
        # THE PAGE-REMOVAL TEST (5-page-remove, on fold-lane-bakery) sends two
        # messages: the gallery out of the menu, then the gallery page off the
        # site. Each may leave the app only as its own kind of edit. Putting
        # the page back is the restore box above, pressed on its own, free.
        #
        # THE FOLLOW-UP TEST (9-follow-up, on fretwork-1) sends two messages
        # from one tab: a lesson the site does not have taken off, which must
        # fail and be shown failing with its edit refunded, and then, only
        # after that failure changed nothing, one price changed. Nothing is put
        # back (the demo-site rule), and the run makes no write of its own.
        description: 'RUN A NAMED SCENARIO IN A REAL BROWSER instead of the one edit: 4a-part-b, 4b-d1-price (the focaccia price through the real app, then put back), 4b-d1-restore (the put-back alone), 4b-rules-close (close the bookings on lido-axes-b, then one real booking that must be refused), 5-page-remove (the gallery out of the menu, then the gallery page off fold-lane-bakery; put back afterwards with the restore box), or 9-follow-up (on fretwork-1: a request that must fail, then from the same tab the Hour one-to-one price to £45, kept). Acts only with spend=yes; otherwise it reads and stops before sending or writing.'
        required: false
        default: ''
      rules_allow:
        # THE RULES TEST'S APPROVALS, and only its: a filled box beside any
        # other run refuses. Words, comma or space separated: `cleanup` lets
        # the run delete its OWN test booking if the booking goes in anyway (the
        # rule failed) — that one row, found by every value it sent; `email`,
        # `text` and `webhook` accept what such a booking could send, if the
        # site's secrets make it possible. The paid press refuses while any
        # possible send is unapproved. Any other word refuses the whole run.
        description: 'Rules test only (4b-rules-close): what you approve if its test booking goes in anyway. Any of: cleanup, email, text, webhook. Blank approves nothing.'
        required: false
        default: ''
      site:
        description: 'The site to edit. Defaults to the canary site; name another to run this against it. Not needed with read_job.'
        required: false
        default: 'fretwork-1'
      control:
        description: 'A second site, used only to prove the OTHER half of the async shape. Leave as is unless you know why.'
        required: false
        default: 'washhouse-3'
      # THE TWO DEMANDS, and they are optional by design: unset, the preflight
      # still READS both identifiers and prints them — what it will not do is
      # claim a match nobody asked for. `lane-sweep.yml` carries the same pair
      # under the same names, so one habit covers both harnesses.
      expect_deploy:
        description: 'Refuse to spend unless the Worker reports this deploy sha (prefix, >=7 chars). Blank = read and print only.'
        required: false
        default: ''
      expect_image:
        description: 'Refuse to spend unless a cold container reports this image id (exact). Blank = read and print only.'
        required: false
        default: ''
      # THE ROUTE A PAID PRESS EXPECTS (Batch 1, 2026-09-29). Read whole by the
      # script before it signs in (`scripts/canary-route.mjs`); a key or value it
      # does not know refuses at no cost, and so does a filled box beside a read,
      # a restore or a scenario. On a paid press the router's answer is checked
      # field by field and a different one is refused before the edit is posted;
      # a matching one is posted exactly as it came.
      expect_route:
        description: 'Refuse to post the paid edit unless the router answers this: space-separated key=value over intent, layer, page, rename (a path or none), remove, tab (true/false), alsoAsked=none (nothing held back). Blank = no check.'
        required: false
        default: ''
      # THE ROWS A DATA PRESS IS WRITTEN FOR (after run 77, 2026-09-30). Read
      # whole by the script before it signs in (`scripts/canary-fixture.mjs`);
      # a malformed box refuses at no cost, and so does a filled box beside a
      # read, a restore or a scenario. Before any routing call the table is read
      # once, on the site's own read, with its count: an answer that is not the
      # whole table, or a setup that is not as named, stops there, at no cost.
      # With spend=no the check is the whole run: a free rehearsal of the paid
      # press.
      expect_rows:
        description: 'Refuse to route or spend unless one table, read whole as the site serves it, is as named: JSON {"table":…,"baseline":<16+ hex: digest of the rows other than the target>,"target":{<fields of the one target row>}}. Blank = no check.'
        required: false
        default: ''

jobs:
  canary:
    runs-on: ubuntu-latest
    # The free half is seconds. The paid half is one edit — a routing call, a
    # lane, a container build and a publish — plus the wait for the queue to
    # deliver. Bounded well above that, because a cancelled job reports nothing.
    # A UI scenario sends several messages, each bounded at 12 minutes by the
    # script itself, and installs a browser first; 45 covers three of them.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # ── THE SCRIPT'S IMPORTS NEED INSTALLING, AND THAT BECAME TRUE ON
      # 2026-09-21 WITHOUT ANYONE NOTICING ────────────────────────────────
      #
      # This step did not exist, and for months it did not need to: the canary
      # imported `node:https` and nothing else. Then it gained
      # `editBrowserReply` from `addon-sweep.mjs` — so that the customer's own
      # screen is EXECUTED rather than re-composed here — and that one line
      # pulled a 44-file closure behind it, two of which want real packages
      # (`qrcode-generator` via `builder/site-qr.mjs`, `@neondatabase/serverless`
      # via `site-db.mjs`).
      #
      # Run 6 died in ONE SECOND on `ERR_MODULE_NOT_FOUND`, before the
      # preflight, before a single network call, having spent nothing. The
      # import was "verified" locally, where `node_modules` exists — which
      # proves the import works in an environment that is not this one. This
      # repo's own trap, verbatim: *a CI step that does not install what the
      # script imports; true when written and false the moment a module gained
      # a dependency.* `test/edit-canary.test.mjs` now walks the closure and
      # fails if a bare specifier appears with no install step beside it, so
      # the next widening cannot ship silent.
      - name: install what the canary imports
        run: npm ci
      # THE UI MODE NEEDS A BROWSER, AND ONLY THE UI MODE: a scenario named on
      # the form installs playwright's Chromium here, before the canary step
      # that launches it (test/ci-browser-order.test.mjs's rule). Pinned to the
      # line lane-sweep.yml uses. An ordinary canary run skips it.
      - name: a browser for the UI mode
        if: github.event.inputs.ui_scenario != ''
        run: npm i --no-save --no-audit --no-fund playwright@1.49.1 && npx playwright install --with-deps chromium
      # ASK deploy.yml FOR ITS OWN RUNS — a find-by-name over
      # `actions/runs?head_sha=` silently stops finding the deploy once a push
      # fires more workflows than fit on one page. This repo lost a run to that.
      # A DEPLOY CAN FAIL FOR REASONS THAT ARE NOT THE CODE'S, and this one did
      # on 2026-09-01: the container build could not reach Docker Hub
      # ("dial tcp ...: i/o timeout" pulling node:22-slim) and the whole deploy
      # went red while the Worker it would have shipped was byte-identical to
      # the one already live. Waiting is still right — testing an old Worker is
      # worse than not testing — but a red deploy here is worth reading before
      # it is believed: a Docker Hub timeout is transient and a re-push clears it.
      - name: wait for this push's deploy
        if: github.event_name == 'push'
        run: |
          for i in $(seq 1 40); do
            state=$(curl -sf "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/runs?head_sha=${{ github.sha }}&per_page=1" \
              | node -e 'let s="";process.stdin.on("data",(c)=>s+=c).on("end",()=>{const d=JSON.parse(s);const r=(d.workflow_runs||[])[0];console.log(r?r.status+"/"+r.conclusion:"none");})') || state=err
            echo "deploy: $state (poll $i)"
            case "$state" in
              completed/success) exit 0 ;;
              completed/*) echo "the deploy failed — the canary would be testing the old Worker"; exit 1 ;;
            esac
            sleep 15
          done
          echo "deploy never finished in 10 minutes"; exit 1
      - name: canary
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          OWNER_EMAIL: aniascristian@gmail.com
          OWNER_BASE_URL: https://gofarther.dev
          # THE SITE IS THE CALLER'S NOW, and the default is the one this
          # workflow has always used — so a dispatch that names nothing behaves
          # exactly as every earlier run did. Kept out of the secret
          # deliberately: a mismatch between what the Worker admits and what
          # this tests SHOWS UP as a failed check rather than passing quietly.
          CANARY_SLUG: ${{ github.event.inputs.site || 'fretwork-1' }}
          # A second site, used only to prove the other half of the shape.
          CONTROL_SLUG: ${{ github.event.inputs.control || 'washhouse-3' }}
          # THE READ MODE WINS OVER `spend`, AND IT IS SETTLED HERE RATHER THAN
          # IN THE SCRIPT so the two can never both be live on the wire. A
          # dispatch filling in a job id has asked for a lookup; a `spend: yes`
          # left over from the previous press is not a second request.
          CANARY_READ_JOB: ${{ github.event.inputs.read_job }}
          # AND THE RESTORE MODE BEATS IT THE SAME WAY: a dispatch naming a
          # version has asked for that version back, and an edit on top of it
          # before anybody has compared the restored source is not that request.
          CANARY_RESTORE: ${{ github.event.inputs.restore_version }}
          CANARY_SPEND: ${{ github.event.inputs.read_job == '' && github.event.inputs.restore_version == '' && github.event.inputs.spend == 'yes' && '1' || '0' }}
          # A SCENARIO FOR THE UI MODE. Refused by the script when it names no
          # known scenario, names one written for another site, or arrives beside
          # a version to put back.
          CANARY_UI: ${{ github.event.inputs.ui_scenario }}
          # THE RULES TEST'S APPROVALS. Read whole by the script before it signs
          # in; a word it does not know, or a filled box beside any other run,
          # refuses.
          CANARY_ALLOW: ${{ github.event.inputs.rules_allow }}
          CANARY_INSTRUCTION: ${{ github.event.inputs.instruction }}
          EXPECT_DEPLOY: ${{ github.event.inputs.expect_deploy }}
          EXPECT_IMAGE: ${{ github.event.inputs.expect_image }}
          CANARY_EXPECT_ROUTE: ${{ github.event.inputs.expect_route }}
          CANARY_EXPECT_ROWS: ${{ github.event.inputs.expect_rows }}
          CANARY_EVIDENCE_DIR: canary-evidence
        run: node scripts/edit-canary.mjs
      # THE RECORD SURVIVES THE RUN, and is uploaded even when the canary
      # FAILS — a refusal's before-inventory is exactly as worth reading as a
      # pass's, and `if: always()` is what stops a red run throwing it away.
      - name: keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-evidence
          path: canary-evidence
          if-no-files-found: warn
