# How often does the page generator produce something that COMPILES?
#
# The production audit kept landing on the placeholder with a different
# TypeScript error each run. One sample per deploy cannot tell a systematic
# mismatch from noise, and each one costs a Neon project, an R2 publish and
# fifteen minutes.
#
# This samples the generation call alone — no database, no publish, no account —
# and reports the distinct errors by shape. It runs when the generator or the
# client API it writes against CHANGES, which is exactly when the number is
# worth having, rather than on every deploy.
name: page gen eval

on:
  push:
    branches: [main]
    paths:
      - "builder/page-gen.mjs"
      # The harness mirrors this file's pipeline — one model call a build since
      # the repair pass went. A change here that the eval does not copy makes
      # every number it reports describe something the platform does not run,
      # which is the one failure mode a measurement cannot survive.
      - "builder/publish-pages.mjs"
      - "builder/lovable/template/src/lib/rows.ts"
      - "builder/GENERATOR.md"
      - "test/integration/page-gen-eval.mjs"
  workflow_dispatch:
    inputs:
      samples:
        description: "How many sites to generate (1-10)"
        required: false
        default: "1"

permissions:
  contents: write

jobs:
  eval:
    # `[skip smoke]` ships the change without the paid sample, the same escape
    # hatch `build smoke` and `schema gen eval` carry. Uniform across all four
    # paid workflows on purpose: a marker that works on three of them is one
    # somebody uses believing it covers the fourth.
    #
    # `github.event.head_commit.message`, NOT `workflow_run.head_commit` — this
    # is triggered by the push itself, so the payload differs from build smoke's
    # and borrowing that expression would read `undefined` and never match.
    #
    # `workflow_dispatch` is exempt: asking for a run by hand is not something a
    # OPT IN, NOT OUT (owner 2026-08-30: "flip them, don't spend any"). This is
    # a real model call per run.
    # It used to run on every push unless the message said not to; a default of
    # spend is a default that loses, and merge commits — whose message git
    # writes itself — could never carry the marker at all.
    #
    # `[smoke]` turns it on. `[skip smoke]`, which fills this repo's history,
    # does not contain `[smoke]`, so every old commit stays free.
    #
    # Uniform across all four paid workflows on purpose: a marker that works on
    # three of them is one somebody uses believing it covers the fourth.
    #
    # `github.event.head_commit.message`, NOT `workflow_run.head_commit` — this
    # is triggered by the push itself, where that path is undefined, so the
    # borrowed expression would never match and the gate would read as working
    # while nothing ever ran.
    #
    # `workflow_dispatch` runs it by hand and is never vetoable by a message.
    if: >-
      github.event_name == 'workflow_dispatch'
      || contains(github.event.head_commit.message, '[smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund --loglevel=error

      # The compile half runs the real build service against a sandbox copy of
      # the template, so the template's own dependencies have to be present.
      - run: npm ci --no-audit --no-fund --loglevel=error
        working-directory: builder/lovable/template

      - name: Sample the generator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # ONE SAMPLE PER SHAPE, and there are three shapes — so a merge makes
          # three calls, ~$0.85, not one at ~$0.28.
          #
          # That is the deliberate trade: the eval used to sample a yoga studio
          # and nothing else, so what it measured was "the generator handles
          # booking sites". A menu-only cafe and an internal tool go through
          # different declarable features, a different family exemplar and a
          # different layout directive, and none of it was ever sampled.
          #
          # This number is samples PER SHAPE. Raising it to 3 makes nine calls —
          # worth it when chasing a regression, because repeating the same error
          # across samples is what separates a systematic mismatch from variance
          # (eleven identical errors across three samples is what caught the
          # `Empty` bug). Not worth it on every merge.
          EVAL_SAMPLES: ${{ github.event.inputs.samples || '1' }}
        run: node test/integration/page-gen-eval.mjs

      - name: Commit the report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain docs/auth-audit)" ]; then
            git add docs/auth-audit
            # The marker below stops this push re-triggering the workflows that
            # would otherwise trigger this one. Never write it into an ordinary
            # commit message or PR body — GitHub scans the whole message and
            # skips every workflow for that push, silently and with a green tick.
            git commit -m "Page generator eval ($(date -u +%Y-%m-%dT%H:%MZ)) [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep $((i * 5))
            done
          else
            echo "no report to commit"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page-gen-eval
          path: |
            docs/auth-audit/PAGE-GEN.md
            docs/auth-audit/pages
          if-no-files-found: ignore
