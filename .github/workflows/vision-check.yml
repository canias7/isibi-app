# Manually-triggered validation of the LIVE vision-critique call. Runs only on demand (workflow_dispatch), where
# the ANTHROPIC_API_KEY secret is available, and sends two committed screenshot fixtures to the real vision model
# to prove it scores a polished page high and a broken page critical. Costs ~2 model calls per run.
name: vision-check

on:
  # Manual only. (It was validated once via a temporary push trigger — passed: good 78, broken 15/critical.
  # Re-run from the Actions tab when you want to re-check the live vision call; each run costs ~2 model calls.)
  workflow_dispatch: {}

jobs:
  vision-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Live vision critique on the fixtures
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node test/vision-live-check.mjs
