name: fix gofarther.dev

# 2026-11-05: after the old app was deleted, gofarther.dev and www.gofarther.dev
# had no DNS record, though Coder's deploy listed them as its custom domains
# (coder.gofarther.dev worked). This shows what Cloudflare holds for the three
# addresses, attaches gofarther.dev and www.gofarther.dev to the
# gofarther-coder Worker again (which creates their DNS records), and shows the
# result. It touches only those two addresses.

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Before
        run: |
          API=https://api.cloudflare.com/client/v4
          ZONE=$(curl -fsS -H "Authorization: Bearer $T" "$API/zones?name=gofarther.dev" | jq -r '.result[0].id')
          echo "zone: $ZONE"; echo "ZONE=$ZONE" >> "$GITHUB_ENV"
          echo "== Worker custom domains on gofarther.dev"
          curl -fsS -H "Authorization: Bearer $T" "$API/accounts/$A/workers/domains?zone_id=$ZONE" | jq -r '.result[] | .hostname + "  ->  " + .service'
          echo "== DNS records for the three addresses"
          for h in gofarther.dev www.gofarther.dev coder.gofarther.dev; do
            curl -fsS -H "Authorization: Bearer $T" "$API/zones/$ZONE/dns_records?name=$h" | jq -r '.result[] | .type + "  " + .name + "  " + .content + "  proxied=" + (.proxied|tostring)'
          done
      - name: Detach and attach gofarther.dev and www again (so their records are made)
        run: |
          API=https://api.cloudflare.com/client/v4
          for h in gofarther.dev www.gofarther.dev; do
            echo "== $h"
            id=$(curl -fsS -H "Authorization: Bearer $T" "$API/accounts/$A/workers/domains?zone_id=$ZONE&hostname=$h" | jq -r '.result[] | select(.hostname=="'"$h"'") | .id' | head -n 1)
            [ -n "$id" ] && curl -sS -X DELETE -H "Authorization: Bearer $T" "$API/accounts/$A/workers/domains/$id" | jq -c '{detached: .success}'
            sleep 5
            curl -sS -X PUT -H "Authorization: Bearer $T" -H "content-type: application/json" "$API/accounts/$A/workers/domains" \
              -d "{\"hostname\":\"$h\",\"service\":\"gofarther-coder\",\"environment\":\"production\",\"zone_id\":\"$ZONE\",\"override_existing_dns_record\":true}" \
              | jq -c '{attached: .success, errors: [.errors[]?.message]}'
          done
      - name: If a record is still missing, make it (AAAA 100::, proxied, like coder.gofarther.dev)
        run: |
          API=https://api.cloudflare.com/client/v4
          sleep 15
          for h in gofarther.dev www.gofarther.dev; do
            n=$(curl -fsS -H "Authorization: Bearer $T" "$API/zones/$ZONE/dns_records?name=$h" | jq '[.result[] | select(.type=="A" or .type=="AAAA" or .type=="CNAME")] | length')
            if [ "$n" = "0" ]; then
              echo "== $h has no address record: making one"
              curl -sS -X POST -H "Authorization: Bearer $T" -H "content-type: application/json" "$API/zones/$ZONE/dns_records" \
                -d "{\"type\":\"AAAA\",\"name\":\"$h\",\"content\":\"100::\",\"proxied\":true,\"comment\":\"gofarther-coder\"}" | jq -c '{made: .success, errors: [.errors[]?.message]}'
            else echo "== $h has its record"; fi
          done
      - name: After
        run: |
          API=https://api.cloudflare.com/client/v4
          sleep 20
          for h in gofarther.dev www.gofarther.dev; do
            curl -fsS -H "Authorization: Bearer $T" "$API/zones/$ZONE/dns_records?name=$h" | jq -r '.result[] | .type + "  " + .name + "  " + .content + "  proxied=" + (.proxied|tostring)'
            echo "$h -> $(curl -sS -m 15 https://$h/health || echo 'no answer yet')"
          done
