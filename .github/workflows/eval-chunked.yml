# The real test: build the FULL app across cap-sized STEPS (shell + page-edits), each ≤ 25k, so every step finishes
# and nothing truncates. Runs the CRM (died as one blob) and the course (the small one) through the chunked build
# on Sonnet @25k, streamed + compiled. Does the full CRM now come out WHOLE and COMPILE? Triggers on push to
# eval-chunked-run. Delete branch when done.
name: eval-chunked

on:
  push:
    branches: [eval-chunked-run]

jobs:
  eval-chunked:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Scaffold the build service
        run: |
          set -e
          mkdir -p /tmp/buildapp
          cp builder/package.json /tmp/buildapp/
          cp -r builder/template/. /tmp/buildapp/
          cd /tmp/buildapp
          npm install --no-audit --no-fund --loglevel=error
          npx playwright install --with-deps chromium || echo "WARN: chromium install failed (build-only, fine)"

      - name: Start the build service
        run: |
          APP_DIR=/tmp/buildapp PORT=8080 node builder/build-server.mjs > /tmp/build-server.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8080/health && break || sleep 0.5; done
          echo "build service up"

      - name: Chunked build — Sonnet 5 @ 25k/step — CRM + course
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_MODEL: "claude-sonnet-5"
          EVAL_ONLY: "2,21"
          EVAL_MAX_OUT: "25000"
          EVAL_CHUNKED: "1"
          EVAL_STREAM: "1"
          EVAL_DUMP: "1"
          EVAL_BUILD: "1"
          EVAL_VISION: "0"
          EVAL_REPAIR: "0"
          BUILD_URL: "http://127.0.0.1:8080"
        run: node test/pipeline-eval.mjs
