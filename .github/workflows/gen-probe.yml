# DRIVE THE FIRE-AND-COLLECT PAIR AND WATCH WHAT THE CONTAINER SAYS.
#
# `container reach` proves the container can reach a provider. It does not prove
# the mechanism stage 2 rests on — `/model/start` runs the call in the
# BACKGROUND and `/model/result` hands it to a LATER invocation. Run 40 walked
# that path and came back `TimeoutError`, and every attempt to name the broken
# link since has been an inference off an error's name.
#
# See scripts/gen-probe.mjs for what each outcome means. It costs NOTHING: the
# request names a model no provider has, so it is refused before a token is
# generated, and the refusal's STATUS is the measurement — 404 is a key that was
# accepted, 401 is one that was not, and no status at all is a request that never
# left the container.
#
# RUNS ON EVERY PUSH, like `container reach`, because a free check that answers a
# load-bearing question should not need remembering.
#
# PHASE 2 IS OFF BY DEFAULT AND THAT IS A RESULT, NOT A SAVING. Its question —
# does an instance survive an idle window longer than `sleepAfter` — was answered
# on 2026-08-26: the same job id came back with the same answer after seven
# minutes of nothing touching the container, so `here / lost` is not what a real
# build hits. Re-arm it by setting PROBE_IDLE_MS to a number of milliseconds past
# `sleepAfter`; it costs seven minutes of runner time per push, which is why it
# is not paid on every commit for an answer already in hand.
#
# PHASE 1 STAYS ON EVERY PUSH because it is ~30 seconds and it is the standing
# check that the container's KEY still works and its EGRESS is still open. Both
# of those can regress under us — a rotated secret, a changed network policy —
# and either one silently sends every fired build back to a ten-minute
# generation in the Worker.
name: gen probe

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: wait for this push's deploy
        run: |
          # ASK deploy.yml FOR ITS OWN RUNS, never `actions/runs?head_sha=` plus a
          # find-by-name: a push can fire a dozen workflows and the deploy falls
          # off page one, which build-as-owner recorded as ten minutes of `none`
          # followed by a job that measured nothing.
          for i in $(seq 1 40); do
            state=$(curl -sf "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/runs?head_sha=${{ github.sha }}&per_page=1" \
              | node -e 'let s="";process.stdin.on("data",(c)=>s+=c).on("end",()=>{const d=JSON.parse(s);const r=(d.workflow_runs||[])[0];console.log(r?r.status+"/"+r.conclusion:"none");})') || state=err
            echo "deploy: $state (poll $i)"
            case "$state" in
              completed/success) exit 0 ;;
              completed/*) echo "the deploy failed — probing it proves nothing"; exit 1 ;;
            esac
            sleep 15
          done
          echo "deploy never finished in 10 minutes"; exit 1
      - name: fire a refused generation and collect it
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OWNER_EMAIL: aniascristian@gmail.com
          OWNER_BASE_URL: https://gofarther.dev
          # Phase 2 answered on 2026-08-26 — see the header. Set this to a value
          # past `sleepAfter` (e.g. 420000) to ask it again.
          PROBE_IDLE_MS: "0"
        run: node scripts/gen-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gen-probe-log
          path: gen-probe.md
          if-no-files-found: ignore
