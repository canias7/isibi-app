# Free-form CSS vs the 29 axes — one paired Grok call, same everything else.
# See test/integration/css-freedom-probe.mjs for the design and the confound it
# is built around.
#
# NO OPT-IN MARKER, for the reason `grok probe` gives: this spends about two
# cents of xAI and NOTHING from the ledger — no Neon project, no container, no
# publish, no account. A path filter is proportionate, and the whole point is to
# be able to re-run it freely when the question comes up again.
#
# It needs NO DEPLOY: it calls xAI directly with the runner's secret.
#
# THE ANSWERS ARE UPLOADED rather than committed. They are one sample of model
# output, not a corpus — committing them would make a fixture out of something
# that changes every run, which is exactly how `page gen eval` once ate the
# generator corpus four checks measure against.
name: css freedom

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/css-freedom.yml'
      - 'test/integration/css-freedom-probe.mjs'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The probe's arm B reads the REAL tool out of worker.js, and resolving it
      # reaches site-schema.mjs -> site-db.mjs -> @neondatabase/serverless.
      # Nothing is called against a database; the import chain alone needs it.
      - run: npm ci --no-audit --no-fund
      - name: ask both ways
        env:
          # No fallback, like `grok probe` and unlike deploy.yml: an empty value
          # here means the probe cannot run, and the script says so and exits 1.
          # A probe that goes green having tested nothing is the failure mode
          # this repo has recorded twice.
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: node test/integration/css-freedom-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: css-freedom
          path: docs/css-freedom/
