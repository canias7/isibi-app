name: delete old stuff

# THE OLD WEBSITE BUILDER, DELETED (2026-11-05, the owner: "delete all the old
# stuff", "delete all the workers in cloudflare except the new coder", keeping
# nutri, teacher-grade-api, isibi-ai and agent-builder-api, and keeping the
# gofarther.app domain). Every item is named, from the "list old stuff" run of
# 2026-11-05 (run 41964170732):
#
#   1. Workers: isibi-app (the old gofarther.dev) and gofarther-front (the sites);
#      the queue site-builds is unhooked from isibi-app first, or neither goes.
#   2. The 101 site Workers in .github/old-stuff/site-workers.txt, then their
#      namespace gofarther-sites.
#   3. The old containers isibi-app-appbuildcontainer and
#      isibi-app-sitebuildcontainer (by id), the queue site-builds, and the KV
#      stores SITE_ROUTES and SITE_API_CACHE (by id).
#   4. The site R2 buckets: isibi-sites, gofarther-files and every gfs-<site>
#      (each printed). A bucket that still holds files gets a 1-day expiry
#      rule; press again tomorrow to delete it once empty.
#   5. The Supabase storage buckets media and avatars (their files first).
#   6. The 152 branches in .github/old-stuff/branches.txt.
#   7. The 48 Neon projects in .github/old-stuff/neon-projects.txt (by id;
#      every one is an old site's database, named isibi-...).
#
# Kept: gofarther-coder and its container and bucket, the four other Workers,
# the queue agent-runs, the gofarther.app domain, main and
# claude/cool-fermat-a06gie.
#
# None of it can be undone. Runs only when pressed and the box says DELETE.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DELETE to delete the old app's Workers, sites, storage and branches (cannot be undone)"
        required: true
        default: ""

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'DELETE' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      W: npx --yes wrangler@4.107.0
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/old-stuff

      - name: "1. The old Workers (the queue unhooked first, so isibi-app can go)"
        run: |
          echo "== unhook the queue site-builds from isibi-app"
          $W queues consumer remove site-builds isibi-app 2>&1 | tail -n 2 || true
          for w in gofarther-front isibi-app; do
            echo "== Worker $w"
            if $W delete --name "$w" --force > /tmp/w.txt 2>&1; then echo "deleted $w"; else
              if grep -qi "not found\|does not exist\|10007" /tmp/w.txt; then echo "$w is already gone"; else echo "::warning::$w was not deleted:"; tail -n 8 /tmp/w.txt; fi
            fi
          done
      - name: "2. The 101 site Workers, then their namespace"
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/dispatch/namespaces/gofarther-sites"
          n=0
          while read -r s; do
            [ -z "$s" ] && continue
            if curl -fsS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API/scripts/$s?force=true" >/dev/null; then echo "deleted $s"; n=$((n+1)); else echo "::warning::$s not deleted"; fi
          done < .github/old-stuff/site-workers.txt
          echo "$n site Workers deleted"
          curl -fsS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API" >/dev/null && echo "deleted namespace gofarther-sites" || echo "::warning::namespace gofarther-sites not deleted (still has Workers, or already gone)"

      - name: "3. Old containers, queue and KV stores"
        run: |
          for id in a03e6bc7-b822-447f-b6fc-c9895a874a8c a0392d6a-c0a1-41f7-94b9-f5647687215e; do
            echo "== container $id"
            $W containers delete "$id" 2>&1 | tail -n 2 || echo "::warning::container $id not deleted"
          done
          echo "== queue site-builds"
          $W queues delete site-builds > /tmp/q.txt 2>&1 && echo "deleted queue site-builds" || { echo "::warning::queue site-builds not deleted:"; tail -n 6 /tmp/q.txt; }
          for k in 5fdb805d4ead430cbb5b8824f766a76b d1f7c9b6ecce4231a3733f4a95dc7d6f; do
            echo "== KV $k"
            curl -fsS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/$k" >/dev/null && echo "deleted" || echo "::warning::KV $k not deleted"
          done

      - name: "4. The site R2 buckets (isibi-sites, gofarther-files and gfs-*)"
        run: |
          names=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets?per_page=1000" | jq -r '.result.buckets[].name' | grep -E '^(isibi-sites|gofarther-files|gfs-[a-z0-9-]+)$' || true)
          echo "$(echo "$names" | grep -c . ) site buckets found"
          for b in $names; do
            if $W r2 bucket delete "$b" >/tmp/r2.txt 2>&1; then echo "deleted bucket $b"
            else
              $W r2 bucket lifecycle add "$b" expire-all --expire-days 1 --force >/dev/null 2>&1 && echo "bucket $b still has files: they expire in 1 day, press again tomorrow" || echo "::warning::bucket $b: $(tail -n 1 /tmp/r2.txt)"
            fi
          done

      - name: "5. Supabase storage (media and avatars)"
        env:
          SB: https://ujrqdmmtcptvimazlhom.supabase.co
          KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "::warning::no SUPABASE_SERVICE_KEY secret: Supabase storage skipped"; exit 0; fi
          for b in media avatars; do
            curl -fsS -X POST -H "Authorization: Bearer $KEY" -H "apikey: $KEY" "$SB/storage/v1/bucket/$b/empty" >/dev/null && echo "emptied $b" || echo "::warning::could not empty $b"
            curl -fsS -X DELETE -H "Authorization: Bearer $KEY" -H "apikey: $KEY" "$SB/storage/v1/bucket/$b" >/dev/null && echo "deleted bucket $b" || echo "::warning::bucket $b not deleted (it may need a minute after emptying; press again)"
          done

      - name: "6. The 152 old branches"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=0
          while read -r b; do
            [ -z "$b" ] && continue
            case "$b" in main|claude/cool-fermat-a06gie) continue ;; esac
            if gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$b" >/dev/null 2>&1; then echo "deleted branch $b"; n=$((n+1)); else echo "::warning::branch $b not deleted (may already be gone)"; fi
          done < .github/old-stuff/branches.txt
          echo "$n branches deleted"

      - name: "7. The 48 Neon projects in .github/old-stuff/neon-projects.txt"
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          if [ -z "$NEON_API_KEY" ]; then echo "::warning::no NEON_API_KEY secret: Neon skipped"; exit 0; fi
          n=0
          while read -r id name; do
            [ -z "$id" ] && continue
            code=$(curl -sS -o /tmp/n.txt -w '%{http_code}' -X DELETE -H "Authorization: Bearer $NEON_API_KEY" "https://console.neon.tech/api/v2/projects/$id")
            if [ "$code" = "200" ]; then echo "deleted Neon $id ($name)"; n=$((n+1));
            elif [ "$code" = "404" ]; then echo "Neon $id ($name) is already gone";
            else echo "::warning::Neon $id ($name) not deleted: $code $(head -c 200 /tmp/n.txt)"; fi
          done < .github/old-stuff/neon-projects.txt
          echo "$n Neon projects deleted"

  refused:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm != 'DELETE' }}
    steps:
      - run: |
          echo "::error::Nothing was deleted: the box did not say DELETE."
          exit 1
