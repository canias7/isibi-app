# Throwaway test of the "bound the scope to fit the cap" idea: take the 3 apps that FAILED at full scope
# (CRM, social, marketplace — each 10-11 pages, truncated past 32k) and rebuild them BOUNDED to 2 capabilities
# (~5 pages, the size of the course app that compiled). If the bounded versions now compile, generating a subset
# that fits is the fix. Runs Sonnet then Opus, streamed + dumped + compiled. Triggers on push to eval-bounded-run.
name: eval-bounded

on:
  push:
    branches: [eval-bounded-run]

jobs:
  eval-bounded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Scaffold the build service
        run: |
          set -e
          mkdir -p /tmp/buildapp
          cp builder/package.json /tmp/buildapp/
          cp -r builder/template/. /tmp/buildapp/
          cd /tmp/buildapp
          npm install --no-audit --no-fund --loglevel=error
          npx playwright install --with-deps chromium || echo "WARN: chromium install failed (build-only, fine)"

      - name: Start the build service
        run: |
          APP_DIR=/tmp/buildapp PORT=8080 node builder/build-server.mjs > /tmp/build-server.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8080/health && break || sleep 0.5; done
          echo "build service up"

      - name: Sonnet 5 — bounded to ~5 pages
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_MODEL: "claude-sonnet-5"
          EVAL_ONLY: "2,4,7"
          EVAL_MAX_CAPS: "2"
          EVAL_MAX_OUT: "32000"
          EVAL_STREAM: "1"
          EVAL_DUMP: "1"
          EVAL_BUILD: "1"
          EVAL_VISION: "0"
          EVAL_REPAIR: "0"
          BUILD_URL: "http://127.0.0.1:8080"
        run: node test/pipeline-eval.mjs

      - name: Opus 4.8 — bounded to ~5 pages
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_MODEL: "claude-opus-4-8"
          EVAL_ONLY: "2,4,7"
          EVAL_MAX_CAPS: "2"
          EVAL_MAX_OUT: "32000"
          EVAL_STREAM: "1"
          EVAL_DUMP: "1"
          EVAL_BUILD: "1"
          EVAL_VISION: "0"
          EVAL_REPAIR: "0"
          BUILD_URL: "http://127.0.0.1:8080"
        run: node test/pipeline-eval.mjs
