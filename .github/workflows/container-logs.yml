# PRINT THE CONTAINER'S RETAINED LOGS — free, read-only, no marker needed.
#
# Fires on a push touching its own two files: the way to read the logs is to
# nudge LOG_HOURS/LOG_NEEDLE below and push. `workflow_dispatch` is here too
# for anyone with the button; a session cannot press it (403). It spends
# nothing — the query runs with `dry: true` and starts no container — so the
# opt-in marker discipline the paid workflows carry does not apply.
#
# WHY: runs 41-44 each lost a fired generation and the only witness was the
# container's stderr, retained since observability went on and readable by
# nobody — a session holds no Cloudflare token, and the dashboard needs a
# person. CI's own deploy token can ask; this is the asking.
#
# Each re-read is a nudge commit to this file — the read below is for
# `washhouse-2` (2026-08-30), SECOND read: no needle at all.
#
# The first read filtered on the slug and returned '166 (of 166 total)' —
# every event in the window mentioned it, and not one was a container error.
# That is either the whole truth or the wrong dataset, and those two look
# identical through a filter. An unfiltered window separates them: if the
# total is still ~166 Worker fetches then the container's stderr does not
# reach here at all, and no amount of needle-tuning will find it.
#
# The build dispatched to the container at
# 20:17:25Z and the `container` step NEVER STARTED: `compile` completed in
# 283ms (it is only the dispatch — run 83's was 107ms) and then 27 minutes
# of silence, against a whole-build budget of 13. Nothing else was building.
# The container's own stderr is the only witness left, exactly as it was for
# runs 41-44.
name: container logs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/container-logs.yml'
      - 'scripts/container-logs.mjs'

jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: query workers logs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The window and the filter for THIS read. Hours back from now;
          # needle is a substring of the log message, empty for everything.
          # 72h: run 44's two failure lines must stay inside the window however
          # long the token back-and-forth takes — the needle keeps it tiny.
          LOG_HOURS: '3'
          LOG_NEEDLE: ''
        run: node scripts/container-logs.mjs
