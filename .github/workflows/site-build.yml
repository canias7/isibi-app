# The page generator's definition of done, made repeatable. Runs the site
# build-service against a page in the shape the generator is told to emit and
# asserts `tsc --noEmit` is clean and `vite build` produces a publishable dist —
# and that a page with a type error is REFUSED rather than bundled.
#
# Costs nothing: no model call, no container, no Neon project. Runs on changes to
# the generator, the template or the build service.
name: site build

on:
  push:
    paths:
      - 'builder/**'
      - 'test/integration/site-build.mjs'
      - 'test/integration/site-runtime.mjs'
      - 'test/integration/site-routing.mjs'
      - 'test/integration/theme-seam.mjs'
      - 'test/integration/theme-render.mjs'
      - 'test/integration/kit-typecheck.mjs'
      - 'test/integration/kit-render.mjs'
      - 'test/integration/kit-harness.mjs'
      - 'test/integration/kit-a11y.mjs'
      - 'test/integration/kit-effects.mjs'
      - 'test/integration/kit-paint.mjs'
      - 'test/integration/contrast-cases.mjs'
      - 'test/page-gen.test.mjs'
      - '.github/workflows/site-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # 15 UNTIL 2026-08-19, AND IT HAD BEEN ONE SMALL ADDITION FROM THE WALL FOR
    # A WHILE. Measured across the preceding runs: 13m50s, 14m26s, 14m23s,
    # 11m42s, 14m18s, 14m24s. Two extra container builds (~28s) tipped it, and
    # GitHub reports a job TIMEOUT as `cancelled` — so the run showed neither a
    # failing assertion nor a red step: `site-build.mjs` had already passed and
    # the job died three steps later, in `site-runtime.mjs`, at exactly 15m.
    # That reads as flaky infrastructure rather than as a budget, which is why
    # the numbers are written down here instead of being rediscovered.
    #
    # A CAP EXISTS TO CATCH A HANG, not to police a suite that legitimately
    # grew. This one really does ~20 real container builds plus six browser
    # harnesses; 25 leaves headroom for another feature's worth of checks while
    # still killing a genuine hang inside half an hour.
    #
    # 25 UNTIL 2026-09-06, AND IT HAPPENED AGAIN, IN THE SAME STEP, AND WENT
    # UNREAD FOR AN HOUR. The suite grew from 326 real cases to 373 in three
    # days (stage 7 added eleven, 3a four, 4b four, 5d eight, 5b/5c six), and
    # the whole job walked into the wall: measured across the five runs of that
    # stretch, 22m50s (4b), 23m17s (stage 8), 23m47s (5d), 24m26s (5e), and
    # 25m12s (5b/5c) — the last one KILLED, 28 seconds into `site-runtime.mjs`,
    # the same last-step-standing the 15-minute wall picked in August. It wears
    # `cancelled`, so the run showed no failing assertion and no red step, and
    # it read as a superseded run rather than as a budget. `site build` was
    # stamped 373/373 for that stage off a LOCAL run; CI never finished it.
    #
    # Nothing is hanging: `site-build.mjs` alone is ~18m of the ~24 and does
    # the container builds, and the eleven steps around it total ~6m. So the
    # cap moves rather than the suite, on the same reasoning as the 15 → 25
    # bump. 35 is ten more minutes — roughly ten more stages at the rate this
    # week ran — and still kills a genuine hang well inside the hour.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: builder/lovable/template/package-lock.json

      # The generator's rules, tool schema and output checks, plus the decisions
      # made around them — which attempt is published, and what it cost.
      #
      # THE ROOT INSTALL IS NOT OPTIONAL ANY MORE (2026-08-30). This step carried
      # "both modules are dependency-free, so no install is needed" — true when it
      # was written, and false from the moment `builder/site-qr.mjs` began
      # importing `qrcode-generator` to draw a QR. One test here evaluates the
      # real design tool, which imports that module, so it failed with "Cannot
      # find package" on a runner with no root node_modules.
      #
      # IT WENT UNNOTICED FOR FIVE COMMITS because the suite passes locally, where
      # the dependency IS installed — the check and the thing it checks disagreed
      # about the environment. `test/workflow-deps.test.mjs` now derives this from
      # the import graph, so the next dependency added to a builder module fails
      # in the unit suite instead of here.
      - run: npm ci --no-audit --no-fund --loglevel=error
      - run: node --test "test/page-gen.test.mjs" "test/publish-pages.test.mjs"

      # EVERY INDEPENDENT CHECK BELOW RUNS EVEN WHEN AN EARLIER ONE FAILED, and
      # that is a fix for a measured incident rather than tidiness. Actions stops
      # a job at the first failing step, so on 2026-08-19 one component missing
      # from an allow-list took `kit-render` down and, with it, the NINE checks
      # after it — including `site-build` itself, the strongest free signal in
      # the repo. Four consecutive runs went red for the same known reason and
      # nobody read past the first line, so a SECOND real bug (matrix-table's
      # numbers at 3.21:1 in dark) sat behind it for fifteen hours.
      #
      # The condition gates on the SETUP rather than on the previous check: with
      # a bare `success() || failure()` a broken `npm ci` produces eleven
      # identical module-not-found failures instead of one that names the cause,
      # which is the opposite of a failure that can name itself. `!cancelled()`
      # rather than `always()`, so a cancelled run stops rather than spending a
      # runner on eleven doomed steps.
      #
      # The same dependency set the container image bakes, from the same lockfile.
      - run: npm ci --no-audit --no-fund --loglevel=error
        id: deps
        working-directory: builder/lovable/template

      # The whole 500-component kit, in one pass. tsconfig.json excludes it from
      # the per-build check (8.7s -> 3.0s on every site build), so this is the
      # only thing that would catch a break in a component no generated page
      # happens to import yet.
      - run: node test/integration/kit-typecheck.mjs
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}

      # And the step above is not enough, which is the whole reason this one
      # exists. Compiling is not working: 158 chart components typechecked and
      # threw on an empty array, 70 typechecked and rendered grey, and
      # `message-scroller` typechecked, bundled and hard-crashed the page. Every
      # one was found by a person looking at a render, long afterwards. This
      # renders all ~2,000 through the same `renderToString` production
      # prerenders with, four ways — realistic props, everything empty, every
      # number zero, every list empty — and reads what came out.
      - run: node test/integration/kit-render.mjs
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}

      # THE RENDER CHECK'S DRIVER, AT THE REPO ROOT — not in the template.
      # `builder/render-check.mjs` does `import("playwright-core")`, and Node
      # resolves that from `builder/` upward, so the template's node_modules is
      # never consulted. The image installs it into /app beside the build
      # service; this is the runner's equivalent.
      #
      # It passed locally and failed here for exactly that reason: this repo's
      # own root install has playwright-core, and THIS workflow never runs a root
      # `npm ci`. Measured on the first run on main — 102 passed, 6 failed, all
      # six `Cannot find package 'playwright-core'`.
      #
      # PINNED TO WHAT THE TEMPLATE ACTUALLY INSTALLED, not to a range. The
      # browser is downloaded by the template's `playwright`, and playwright-core
      # resolves it by an EXACT revision directory — so two copies a patch apart
      # look for `chromium-1193` and `chromium-1194` and one of them is not
      # there. A range on each side is two independent resolutions that agree
      # today and need not tomorrow, and the failure reads as the render check
      # being broken rather than as a version skew.
      #
      # `--no-save`, like the Dockerfile: a published customer site must never
      # carry a browser driver in its dependency tree.
      - name: playwright-core at the root, matching the template's playwright
        run: |
          V=$(node -p "require('./builder/lovable/template/node_modules/playwright/package.json').version")
          echo "template playwright is $V"
          npm i --no-save --no-audit --no-fund --loglevel=error "playwright-core@$V"

      # BEFORE every browser step, which now starts with site-build. This
      # container has /opt/pw-browsers pre-populated and a runner does not, so a
      # browser step above this one passes locally and fails only in CI — which
      # is what theme-render did on its first run on main, and then what the
      # render check did when it landed above this line.
      - run: npx playwright install --with-deps chromium
        id: browser
        working-directory: builder/lovable/template

      - run: node test/integration/site-build.mjs
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.browser.outcome == 'success' }}

      # THE FALSE-ALARM RATE OF THE CONTRAST CHECK, which is the number that
      # decides whether that check may exist at all: its verdict goes to the
      # CUSTOMER, on the build and on every edit lane, as "has text that is
      # nearly invisible". It read `backgroundColor` only — a gradient sets no
      # background COLOUR — so a photograph with a scrim and white text measured
      # white on white at 1:1, on the most common hero there is.
      #
      # Separate from site-build because it needs no container and no dist: a
      # static page and the real `probe()`, about two seconds, so it can afford
      # the cases that PIN the boundary (the ordering that keeps a gloss button
      # checked, the ancestor with no box) rather than only the two shapes a
      # compiled site can show.
      - run: node test/integration/contrast-cases.mjs
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.browser.outcome == 'success' }}

      # Does a theme reach the DIST? The response cannot answer that — the font
      # write shipped defaults while reporting the right choice, and a theme has
      # the same failure available to it.
      - run: node test/integration/theme-seam.mjs
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}

      # WHAT EACH CONTROL IS CALLED, asked of Chromium's own accessibility tree
      # rather than guessed from the source. A name can come from six different
      # places and the rules differ by role, so a scan of the markup is not able
      # to answer it: a hand-written one reported 152 controls with no name and
      # the first two checked were fine. This found a one-time-code input that
      # announces as "edit text, blank", six progress bars reporting a number
      # with nothing to attach it to, and three listboxes called "listbox".
      # Needs the browser, so it sits after the install above.
      - run: node test/integration/kit-a11y.mjs
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}

      # MOUNTED, then taken away again. `kit-render.mjs` above goes through
      # `renderToString`, and server rendering NEVER RUNS AN EFFECT — so the
      # whole effect layer of the kit was exercised by nothing. This mounts all
      # ~2,000 in a real browser and unmounts each one, which is the only way to
      # see an effect that throws, a listener or interval that is never given
      # back, or a roving tabindex that sets `tabIndex` and forgets to move
      # focus. It also drives the three listboxes whose arrow keys were written
      # and then verified by typechecking alone.
      - run: node test/integration/kit-effects.mjs
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}

      # CAN THE TEXT BE READ. Everything above checks the kit as STRUCTURE — it
      # compiles, it renders, it mounts, its controls have names — and none of
      # that can see a colour, which is where this codebase has been hurt worst:
      # 70 charts rendered grey while typechecking perfectly, thirteen modal
      # panels were see-through with the page's own headings legible through
      # them, eight reference lines were red on a monochrome kit. Every one was
      # found by a person looking, long afterwards, and every one is a number.
      # Builds the REAL Tailwind stylesheet and measures the WCAG contrast of
      # every piece of text in both modes, plus the kit's own bg/foreground
      # token pairings. Needs the browser, so it sits after the install above.
      - run: node test/integration/kit-paint.mjs
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.browser.outcome == 'success' }}

      # What a themed site LOOKS like. The seam test proves the CSS reaches the
      # dist; this proves the page is not blank, nothing throws, and the two
      # modes actually differ — the checks a picture can be held to.
      - run: node test/integration/theme-render.mjs
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.browser.outcome == 'success' }}
        env:
          SHOT_DIR: theme-shots

      # The whole point is that somebody can LOOK. A run that photographs four
      # themed sites and then bins the pictures is a run that proved nothing
      # anybody can check.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theme-shots
          path: theme-shots
          if-no-files-found: ignore

      # REAL ADDRESSES FOR PUBLISHED PAGES, both halves at once. The Worker's
      # fallback and the template's runtime basepath are useless apart, and each
      # looks fine on its own: hash routing hid the missing fallback for months,
      # and a wrong basepath renders Not Found at a URL that still ends in the
      # right word. Driven at BOTH mounts — /s/<slug>/ and / — because one
      # bundle serves both.
      - run: node test/integration/site-routing.mjs
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.browser.outcome == 'success' }}

      # Compiling is not working. This drives the reference page in a real
      # browser against a stub of the data API, so the four list states, the
      # form's success and failure paths, and the toast actually being mounted
      # are all checked rather than assumed.
      - run: node test/integration/site-runtime.mjs
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.browser.outcome == 'success' }}
