# The page generator's definition of done, made repeatable. Runs the site
# build-service against a page in the shape the generator is told to emit and
# asserts `tsc --noEmit` is clean and `vite build` produces a publishable dist —
# and that a page with a type error is REFUSED rather than bundled.
#
# Costs nothing: no model call, no container, no Neon project. Runs on changes to
# the generator, the template or the build service.
name: site build

on:
  push:
    paths:
      - 'builder/**'
      - 'test/integration/site-build.mjs'
      - 'test/integration/site-runtime.mjs'
      - 'test/page-gen.test.mjs'
      - '.github/workflows/site-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: builder/lovable/template/package-lock.json

      # The generator's rules, tool schema and output checks, plus the decisions
      # made around them — which attempt is published, and what it cost. Both
      # modules are dependency-free, so no install is needed.
      - run: node --test "test/page-gen.test.mjs" "test/publish-pages.test.mjs"

      # The same dependency set the container image bakes, from the same lockfile.
      - run: npm ci --no-audit --no-fund --loglevel=error
        working-directory: builder/lovable/template

      # The whole 500-component kit, in one pass. tsconfig.json excludes it from
      # the per-build check (8.7s -> 3.0s on every site build), so this is the
      # only thing that would catch a break in a component no generated page
      # happens to import yet.
      - run: node test/integration/kit-typecheck.mjs

      - run: node test/integration/site-build.mjs

      # Does a theme reach the DIST? The response cannot answer that — the font
      # write shipped defaults while reporting the right choice, and a theme has
      # the same failure available to it.
      - run: node test/integration/theme-seam.mjs

      # Compiling is not working. This drives the reference page in a real
      # browser against a stub of the data API, so the four list states, the
      # form's success and failure paths, and the toast actually being mounted
      # are all checked rather than assumed.
      - run: npx playwright install --with-deps chromium
        working-directory: builder/lovable/template

      - run: node test/integration/site-runtime.mjs
