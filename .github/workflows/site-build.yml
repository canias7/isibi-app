# The page generator's definition of done, made repeatable. Runs the site
# build-service against a page in the shape the generator is told to emit and
# asserts `tsc --noEmit` is clean and `vite build` produces a publishable dist —
# and that a page with a type error is REFUSED rather than bundled.
#
# Costs nothing: no model call, no container, no Neon project. Runs on changes to
# the generator, the template or the build service — on every branch but main,
# where a merge is a fast-forward of a sha it already ran on.
#
# ── SEVEN JOBS AT ONCE AND ONE ANSWER (2026-10-01) ──────────────────────────────
#
# This was ONE job of 24m35s (run 36832053168 on 2188f706), and
# `site-build.mjs` was 18m08s of it, one real build after another. Owner: "I
# don't want a 20–25-minute wait after every correction." Nothing was dropped
# to make it faster; the same checks run, side by side:
#
#   kit      page-gen and publish-pages tests, kit-typecheck, kit-render,
#            contrast-cases, kit-a11y, kit-effects, kit-paint
#   theme    theme-seam, theme-render (and its screenshots)
#   site     site-routing, site-runtime
#   shards   site-build.mjs in four shards, each on its own runner with its
#            own build service, sandbox and port; every section of the file
#            names its shard (`SITE_BUILD_SHARD`), and run with no shard the
#            file is still the whole suite, in order
#   all checks   the GATE: green only when every job above succeeded and every
#            section of site-build.mjs ran exactly once, in its own shard, on
#            this commit, and passed (`scripts/site-build-gate.mjs`). It prints
#            the fingerprint of this run's inputs, so the evidence can be
#            matched to the commit being merged. READ THIS ONE BEFORE A MERGE.
#
# A newer push to the same branch cancels a run still in progress (`concurrency`
# below): only the newest commit's answer matters, and a correction no longer
# queues behind the run it replaced. A cancelled run has no gate result, which
# is never read as a pass.
name: site build

on:
  push:
    # NOT ON THE MERGE (owner, 2026-09-09: "I JUST WANT THE MERGE THING
    # THERE").  main is the merge and a merge here is a fast-forward of a sha
    # this already ran on the branch, so re-running it on main proves nothing
    # new.  Every other branch is unchanged.
    branches-ignore: [main]
    # EVERY PATH THE SITE IMAGE COPIES, AS GLOBS (2026-09-12). This filter
    # named `builder/**` and a list of integration files, which was right for
    # as long as the image carried only the build service — and stopped being
    # right on 2026-09-05, when `worker.js` and its whole module graph went
    # into the image as the JOB RUNTIME (the Dockerfile's second COPY block).
    # Nothing announced it: this repository's own "a rule true because of a
    # layer below it expires when that layer moves" trap, in the CI config,
    # which is also the part it records as being the least guarded.
    #
    # WHAT IT COST: stages 2a, 2b and 3 of the media deletion changed
    # worker.js by ~2,900 lines between them and this harness — the only thing
    # that proves a site can still be COMPILED — ran on none of them. It last
    # ran on stage 1.
    #
    # GLOBS RATHER THAN THE DOCKERFILE'S LIST, deliberately: that list is 44
    # root modules and 100-odd builder ones, and a copy of it here would be two
    # lists of the same thing with nothing between them. `*.mjs` and
    # `worker.js` cover the runtime whole and cannot drift when a module is
    # added. `test/dockerfile.test.mjs` asserts the coverage from the
    # Dockerfile's own COPY lines, so a path that escapes these globs fails.
    paths:
      - 'builder/**'
      - 'worker.js'
      - '*.mjs'
      - 'Dockerfile'
      - '.dockerignore'
      # THE GUARD FOUND THESE TWO ON ITS FIRST RUN, which is the whole argument
      # for deriving the list from the Dockerfile: the image installs the
      # Worker's own dependencies for the job runtime, so a dependency change is
      # as much an image input as a code change and was not triggering the
      # harness either.
      - 'package.json'
      - 'package-lock.json'
      - 'test/integration/site-build.mjs'
      - 'test/integration/site-runtime.mjs'
      - 'test/integration/site-routing.mjs'
      - 'test/integration/theme-seam.mjs'
      - 'test/integration/theme-render.mjs'
      - 'test/integration/kit-typecheck.mjs'
      - 'test/integration/kit-render.mjs'
      - 'test/integration/kit-harness.mjs'
      - 'test/integration/kit-a11y.mjs'
      - 'test/integration/kit-effects.mjs'
      - 'test/integration/kit-paint.mjs'
      - 'test/integration/contrast-cases.mjs'
      # THE BROWSER ESTABLISHES THIS TABLE for the unit cases that judge a page
      # by it (site-build.mjs, the comment-boundary control), so a change to it
      # runs the browser half again.
      - 'test/fixtures/comment-boundary.mjs'
      - 'test/page-gen.test.mjs'
      - '.github/workflows/site-build.yml'
      # WHAT THE SCRIPTS ABOVE IMPORT FROM test/, AND THE GATE (2026-10-01).
      # None of these was listed, so a change to the shared site server or the
      # theme fixtures alone ran nothing here. Found when the gate began to
      # fingerprint the run's inputs: a fingerprint over this list is only
      # honest if the list is complete, so `test/site-build-shards.test.mjs`
      # now walks the import graph of every script these jobs run and fails on
      # a file this list does not name. The two directories are the data the
      # corpus and generated-page fixtures read.
      - 'test/publish-pages.test.mjs'
      - 'test/integration/lib/**'
      - 'test/integration/schema-tool.mjs'
      - 'test/fixtures/themes.mjs'
      - 'test/fixtures/build-path.mjs'
      - 'test/fixtures/build-source.mjs'
      - 'test/fixtures/corpus.mjs'
      - 'test/fixtures/corpus/**'
      - 'test/fixtures/generated.mjs'
      - 'test/fixtures/generated/**'
      - 'scripts/site-build-gate.mjs'
  workflow_dispatch:

permissions:
  contents: read

# ONE RUN PER BRANCH. A push while a run is going cancels the older one: during
# a round of corrections only the newest commit can be merged, and its run is
# the one that has to finish.
concurrency:
  group: site-build-${{ github.ref }}
  cancel-in-progress: true

# EVERY INDEPENDENT CHECK RUNS EVEN WHEN AN EARLIER ONE FAILED, and that is a
# fix for a measured incident rather than tidiness. Actions stops a job at the
# first failing step, so on 2026-08-19 one component missing from an allow-list
# took `kit-render` down and, with it, the NINE checks after it — including
# `site-build` itself, the strongest free signal in the repo. Four consecutive
# runs went red for the same known reason and nobody read past the first line,
# so a SECOND real bug (matrix-table's numbers at 3.21:1 in dark) sat behind it
# for fifteen hours.
#
# The condition gates on the SETUP rather than on the previous check: with a
# bare `success() || failure()` a broken `npm ci` produces eleven identical
# module-not-found failures instead of one that names the cause, which is the
# opposite of a failure that can name itself. `!cancelled()` rather than
# `always()`, so a cancelled run stops rather than spending a runner on doomed
# steps. Separate jobs keep the same property one level up: a red shard cannot
# stop a theme check, and every job's result reaches the gate.
#
# THE SETUP EVERY JOB REPEATS, in the order it always ran:
#
# THE ROOT INSTALL IS NOT OPTIONAL ANY MORE (2026-08-30). The generator step
# carried "both modules are dependency-free, so no install is needed" — true
# when it was written, and false from the moment `builder/site-qr.mjs` began
# importing `qrcode-generator` to draw a QR. One test there evaluates the real
# design tool, which imports that module, so it failed with "Cannot find
# package" on a runner with no root node_modules. IT WENT UNNOTICED FOR FIVE
# COMMITS because the suite passes locally, where the dependency IS installed —
# the check and the thing it checks disagreed about the environment.
# `test/workflow-deps.test.mjs` now derives this from the import graph, so the
# next dependency added to a builder module fails in the unit suite instead.
#
# The template's `npm ci` is the same dependency set the container image bakes,
# from the same lockfile.
#
# THE RENDER CHECK'S DRIVER, AT THE REPO ROOT — not in the template.
# `builder/render-check.mjs` does `import("playwright-core")`, and Node resolves
# that from `builder/` upward, so the template's node_modules is never
# consulted. The image installs it into /app beside the build service; this is
# the runner's equivalent. It passed locally and failed here for exactly that
# reason — measured on the first run on main: 102 passed, 6 failed, all six
# `Cannot find package 'playwright-core'`. PINNED TO WHAT THE TEMPLATE ACTUALLY
# INSTALLED, not to a range: the browser is downloaded by the template's
# `playwright`, and playwright-core resolves it by an EXACT revision directory,
# so two copies a patch apart look for `chromium-1193` and `chromium-1194` and
# one of them is not there. `--no-save`, like the Dockerfile: a published
# customer site must never carry a browser driver in its dependency tree.
#
# THE BROWSER, BEFORE every browser step. This container has /opt/pw-browsers
# pre-populated and a runner does not, so a browser step above the install
# passes locally and fails only in CI — which is what theme-render did on its
# first run on main, and then what the render check did when it landed above
# the line. `test/ci-browser-order.test.mjs` holds every job to it.
jobs:
  kit:
    name: kit and generator checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: builder/lovable/template/package-lock.json
      - run: npm ci --no-audit --no-fund --loglevel=error
      # The generator's rules, tool schema and output checks, plus the decisions
      # made around them — which attempt is published, and what it cost.
      - run: node --test "test/page-gen.test.mjs" "test/publish-pages.test.mjs"
      - run: npm ci --no-audit --no-fund --loglevel=error
        id: deps
        working-directory: builder/lovable/template

      # The whole 500-component kit, in one pass. tsconfig.json excludes it from
      # the per-build check (8.7s -> 3.0s on every site build), so this is the
      # only thing that would catch a break in a component no generated page
      # happens to import yet.
      - run: node test/integration/kit-typecheck.mjs
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}

      # And the step above is not enough, which is the whole reason this one
      # exists. Compiling is not working: 158 chart components typechecked and
      # threw on an empty array, 70 typechecked and rendered grey, and
      # `message-scroller` typechecked, bundled and hard-crashed the page. Every
      # one was found by a person looking at a render, long afterwards. This
      # renders all ~2,000 through the same `renderToString` production
      # prerenders with, four ways — realistic props, everything empty, every
      # number zero, every list empty — and reads what came out.
      - run: node test/integration/kit-render.mjs
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}

      - name: playwright-core at the root, matching the template's playwright
        run: |
          V=$(node -p "require('./builder/lovable/template/node_modules/playwright/package.json').version")
          echo "template playwright is $V"
          npm i --no-save --no-audit --no-fund --loglevel=error "playwright-core@$V"
      - run: npx playwright install --with-deps chromium
        id: browser
        working-directory: builder/lovable/template

      # THE FALSE-ALARM RATE OF THE CONTRAST CHECK, which is the number that
      # decides whether that check may exist at all: its verdict goes to the
      # CUSTOMER, on the build and on every edit lane, as "has text that is
      # nearly invisible". It read `backgroundColor` only — a gradient sets no
      # background COLOUR — so a photograph with a scrim and white text measured
      # white on white at 1:1, on the most common hero there is.
      #
      # Separate from site-build because it needs no container and no dist: a
      # static page and the real `probe()`, about two seconds, so it can afford
      # the cases that PIN the boundary (the ordering that keeps a gloss button
      # checked, the ancestor with no box) rather than only the two shapes a
      # compiled site can show.
      - run: node test/integration/contrast-cases.mjs
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.browser.outcome == 'success' }}

      # WHAT EACH CONTROL IS CALLED, asked of Chromium's own accessibility tree
      # rather than guessed from the source. A name can come from six different
      # places and the rules differ by role, so a scan of the markup is not able
      # to answer it: a hand-written one reported 152 controls with no name and
      # the first two checked were fine. This found a one-time-code input that
      # announces as "edit text, blank", six progress bars reporting a number
      # with nothing to attach it to, and three listboxes called "listbox".
      # Needs the browser, so it sits after the install above.
      - run: node test/integration/kit-a11y.mjs
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}

      # MOUNTED, then taken away again. `kit-render.mjs` above goes through
      # `renderToString`, and server rendering NEVER RUNS AN EFFECT — so the
      # whole effect layer of the kit was exercised by nothing. This mounts all
      # ~2,000 in a real browser and unmounts each one, which is the only way to
      # see an effect that throws, a listener or interval that is never given
      # back, or a roving tabindex that sets `tabIndex` and forgets to move
      # focus. It also drives the three listboxes whose arrow keys were written
      # and then verified by typechecking alone.
      - run: node test/integration/kit-effects.mjs
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}

      # CAN THE TEXT BE READ. Everything above checks the kit as STRUCTURE — it
      # compiles, it renders, it mounts, its controls have names — and none of
      # that can see a colour, which is where this codebase has been hurt worst:
      # 70 charts rendered grey while typechecking perfectly, thirteen modal
      # panels were see-through with the page's own headings legible through
      # them, eight reference lines were red on a monochrome kit. Every one was
      # found by a person looking, long afterwards, and every one is a number.
      # Builds the REAL Tailwind stylesheet and measures the WCAG contrast of
      # every piece of text in both modes, plus the kit's own bg/foreground
      # token pairings. Needs the browser, so it sits after the install above.
      - run: node test/integration/kit-paint.mjs
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.browser.outcome == 'success' }}

  theme:
    name: theme checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: builder/lovable/template/package-lock.json
      - run: npm ci --no-audit --no-fund --loglevel=error
      - run: npm ci --no-audit --no-fund --loglevel=error
        id: deps
        working-directory: builder/lovable/template
      - name: playwright-core at the root, matching the template's playwright
        run: |
          V=$(node -p "require('./builder/lovable/template/node_modules/playwright/package.json').version")
          echo "template playwright is $V"
          npm i --no-save --no-audit --no-fund --loglevel=error "playwright-core@$V"
      - run: npx playwright install --with-deps chromium
        id: browser
        working-directory: builder/lovable/template

      # Does a theme reach the DIST? The response cannot answer that — the font
      # write shipped defaults while reporting the right choice, and a theme has
      # the same failure available to it.
      - run: node test/integration/theme-seam.mjs
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}

      # What a themed site LOOKS like. The seam test proves the CSS reaches the
      # dist; this proves the page is not blank, nothing throws, and the two
      # modes actually differ — the checks a picture can be held to.
      - run: node test/integration/theme-render.mjs
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.browser.outcome == 'success' }}
        env:
          SHOT_DIR: theme-shots

      # The whole point is that somebody can LOOK. A run that photographs four
      # themed sites and then bins the pictures is a run that proved nothing
      # anybody can check.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theme-shots
          path: theme-shots
          if-no-files-found: ignore

  site:
    name: published-site checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: builder/lovable/template/package-lock.json
      - run: npm ci --no-audit --no-fund --loglevel=error
      - run: npm ci --no-audit --no-fund --loglevel=error
        id: deps
        working-directory: builder/lovable/template
      - name: playwright-core at the root, matching the template's playwright
        run: |
          V=$(node -p "require('./builder/lovable/template/node_modules/playwright/package.json').version")
          echo "template playwright is $V"
          npm i --no-save --no-audit --no-fund --loglevel=error "playwright-core@$V"
      - run: npx playwright install --with-deps chromium
        id: browser
        working-directory: builder/lovable/template

      # REAL ADDRESSES FOR PUBLISHED PAGES, both halves at once. The Worker's
      # fallback and the template's runtime basepath are useless apart, and each
      # looks fine on its own: hash routing hid the missing fallback for months,
      # and a wrong basepath renders Not Found at a URL that still ends in the
      # right word. Driven at BOTH mounts — /s/<slug>/ and / — because one
      # bundle serves both.
      - run: node test/integration/site-routing.mjs
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.browser.outcome == 'success' }}

      # Compiling is not working. This drives the reference page in a real
      # browser against a stub of the data API, so the four list states, the
      # form's success and failure paths, and the toast actually being mounted
      # are all checked rather than assumed.
      - run: node test/integration/site-runtime.mjs
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.browser.outcome == 'success' }}

  shards:
    name: site-build.mjs, shard ${{ matrix.shard }} of 4
    runs-on: ubuntu-latest
    # THE OLD SINGLE JOB'S CAP WAS 35 MINUTES, and its history is why a cap is
    # written down at all: 15 until 2026-08-19 and 25 until 2026-09-06, and both
    # times the whole job walked into the wall in the last step standing, which
    # GitHub reports as `cancelled` — no failing assertion, no red step, read as
    # a superseded run rather than as a budget. A CAP EXISTS TO CATCH A HANG,
    # not to police a suite that grew. A shard is a quarter of the builds (its
    # longest section about five minutes on a runner), so 20 still kills a hang
    # inside the half hour with room for the suite to grow.
    timeout-minutes: 20
    strategy:
      # Every shard finishes even when another fails, for the same reason every
      # check above runs after a failure: one red line must not hide the next.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: builder/lovable/template/package-lock.json
      - run: npm ci --no-audit --no-fund --loglevel=error
      - run: npm ci --no-audit --no-fund --loglevel=error
        id: deps
        working-directory: builder/lovable/template
      - name: playwright-core at the root, matching the template's playwright
        run: |
          V=$(node -p "require('./builder/lovable/template/node_modules/playwright/package.json').version")
          echo "template playwright is $V"
          npm i --no-save --no-audit --no-fund --loglevel=error "playwright-core@$V"
      - run: npx playwright install --with-deps chromium
        id: browser
        working-directory: builder/lovable/template

      - run: node test/integration/site-build.mjs
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.browser.outcome == 'success' }}
        env:
          SITE_BUILD_SHARD: ${{ matrix.shard }}
          SITE_BUILD_REPORT: site-build-report-${{ matrix.shard }}.json

      # WHAT THIS SHARD RAN, check by check, for the gate. Uploaded whatever
      # happened above, and an absent report is an error here as well as there.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-build-report-${{ matrix.shard }}
          path: site-build-report-${{ matrix.shard }}.json
          if-no-files-found: error

  gate:
    name: all checks
    needs: [kit, theme, site, shards]
    # Runs when a job above failed, so the failure is named here too; never on
    # a cancelled run, which has no answer to give.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: site-build-report-*
          path: site-build-reports
          merge-multiple: true
      - run: node scripts/site-build-gate.mjs gate site-build-reports
        env:
          NEEDS: ${{ toJSON(needs) }}
