# The lane sweep — one real edit per lane on a live site, through the queue,
# reading the SITE after each to see whether the lane did the one thing it owns.
# See scripts/lane-sweep.mjs for what "works" means per lane.
#
# COSTS REAL MONEY, BY DESIGN. Nothing here is free: every lane is a model call
# and a publish, and the page-rung lanes are rewrites. Budgeted by the `budget`
# input and stopped by the harness at the first reply that lies about the site.
#
# DISPATCH ONLY. No push trigger, no marker gate — the switch is the `confirm`
# input, which has to be the word `spend`. A default that could ever run this
# by accident would be the expensive thing being the default.
#
# TWO LANES NEVER RUN UNDER `all`: `slug` (renames the site for ever) and `kind`
# (a full rebuild that replaces it). Name them in `lanes` to run them.
name: lane sweep

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type the word: spend'
        required: true
        default: ''
      lanes:
        description: 'all, or a comma list (css,theme,brand,…). slug and kind only when named.'
        required: false
        default: 'all'
      site:
        description: 'The site to edit (must be on the async allowlist)'
        required: false
        default: 'fretwork-1'
      picker:
        description: 'grok | sonnet | opus'
        required: false
        default: 'grok'
      budget:
        description: 'Stop before any lane once this many credits have gone'
        required: false
        default: '80'

jobs:
  sweep:
    runs-on: ubuntu-latest
    # Twenty lanes on Grok is two hours if every one needs a correction round;
    # the page rungs are the slow ones. Bounded well above that.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The QR check decodes the served SVG against qrcode-generator, which is a
      # real dependency — see test/workflow-deps.test.mjs for why every node
      # step installs first.
      - run: npm ci --no-audit --no-fund
      - name: sweep
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          OWNER_EMAIL: aniascristian@gmail.com
          OWNER_BASE_URL: https://gofarther.dev
          SWEEP_CONFIRM: ${{ github.event.inputs.confirm }}
          SWEEP_LANES: ${{ github.event.inputs.lanes }}
          SWEEP_SLUG: ${{ github.event.inputs.site }}
          SWEEP_PICKER: ${{ github.event.inputs.picker }}
          SWEEP_BUDGET: ${{ github.event.inputs.budget }}
        run: node scripts/lane-sweep.mjs
