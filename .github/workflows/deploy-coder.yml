name: deploy coder

# CODER'S DEPLOY (2026-11-05, the owner chose a button to press, not a
# terminal). It touches only `coder/`, and a push starts nothing: the owner
# presses it.
#
# Secrets it reads (GitHub → Settings → Secrets → Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, XAI_API_KEY  (already there)
#   CODER_GITHUB_CLIENT_SECRET  (new: the GitHub App's client secret)
# CODER_TOKEN_KEY, the key that encrypts users' GitHub tokens, is derived here
# from CODER_GITHUB_CLIENT_SECRET (HMAC, 32 bytes), so it is the same on every
# deploy and nobody has to make one by hand. It is masked and never printed.
# A new client secret means a new key: everyone connects GitHub again.
#
# CODER'S MACHINES ON FLY.IO (owner, 2026-11-07: "YES OPTION 2", like Claude
# Code's VMs): with the FLY_API_TOKEN secret there (the owner makes it on
# Fly.io: the organization's Tokens page), each chat's machine is a small VM on
# Fly.io, stopped when quiet with its disk kept. This deploy then makes the Fly
# app once, gives it Coder's keys, builds Coder's machine and sends it there.
# Without the secret (or with "cloudflare" picked), chats keep Cloudflare's
# containers, as before.
#
# THE TEST COPY (owner, 2026-11-10: "test what we have live without touching the
# other branches or merging"): "test" deploys the branch picked to its own
# Worker at jessica.gofarther.dev, with its own storage, its own machines on Fly.io
# and its own queue (coder/test-copy.mjs makes its settings from wrangler.jsonc).
# It never touches gofarther.dev, its Worker, its keys or its data, and it never
# waits on or holds up a live deploy. "live" (gofarther.dev) goes only from main.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "live: gofarther.dev (from main only) · test: a separate copy at jessica.gofarther.dev"
        type: choice
        options: [live, test]
        default: live
      machines:
        description: "Where chats' machines run: fly (needs the FLY_API_TOKEN secret) or cloudflare"
        type: choice
        options: [fly, cloudflare]
        default: fly

concurrency:
  group: ${{ github.event.inputs.target == 'test' && 'deploy-coder-jessica' || 'deploy-coder' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ github.event.inputs.target == 'test' && 'test' || 'live' }}
      FLY_APP: ${{ github.event.inputs.target == 'test' && 'gofarther-coder-jessica-machines' || 'gofarther-coder-machines' }}
      BUCKET: ${{ github.event.inputs.target == 'test' && 'gofarther-coder-jessica' || 'gofarther-coder' }}
      SITE: ${{ github.event.inputs.target == 'test' && 'https://jessica.gofarther.dev' || 'https://coder.gofarther.dev' }}
      FLY_ORG: personal
    defaults:
      run:
        working-directory: coder
    steps:
      - name: "gofarther.dev only from main"
        if: env.TARGET == 'live' && github.ref_name != 'main'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          echo "::error::gofarther.dev is deployed only from main. To try the branch $BRANCH, pick test (jessica.gofarther.dev)."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Coder's packages
        run: npm ci --no-audit --no-fund
      - name: Check the secrets are there
        env:
          A: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          B: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          C: ${{ secrets.XAI_API_KEY }}
          D: ${{ secrets.CODER_GITHUB_CLIENT_SECRET }}
          E: ${{ secrets.CODER_GITHUB_WEBHOOK_SECRET }}
          F: ${{ secrets.CODER_GITHUB_APP_PRIVATE_KEY }}
        run: |
          missing=""
          [ -n "$A" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$B" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$C" ] || missing="$missing XAI_API_KEY"
          [ -n "$D" ] || missing="$missing CODER_GITHUB_CLIENT_SECRET"
          [ -n "$E" ] || missing="$missing CODER_GITHUB_WEBHOOK_SECRET"
          [ -n "$F" ] || missing="$missing CODER_GITHUB_APP_PRIVATE_KEY"
          if [ -n "$missing" ]; then echo "::error::Missing GitHub secrets:$missing"; exit 1; fi
          echo "All secrets present."
      # READ'S PICTURES AND PDFs (owner item 1, 2026-11-08) are tested with the programs Coder's machine
      # has for them; without them those tests are skipped, so a failed install never stops a deploy.
      - name: The picture, PDF and search programs Coder's machine has (for its tests)
        run: |
          sudo apt-get install -y -qq imagemagick poppler-utils ripgrep >/dev/null 2>&1 || (sudo apt-get update -qq >/dev/null 2>&1 && sudo apt-get install -y -qq imagemagick poppler-utils ripgrep >/dev/null 2>&1) || echo "Not installed: those tests are skipped."
          command -v convert pdftotext rg || true
      - name: Run Coder's tests
        run: node --test test/*.test.mjs
      # THE ROOT-ONLY TESTS RUN TOO (the audit, 2026-11-06): handing the files
      # to the AI's user and stopping its processes can only be tested as root, so
      # the step above skips them. GitHub's machines allow sudo. These tests never
      # stop the processes of user 1001 (this machine's own runner user).
      - name: Run Coder's root-only safety tests (as root)
        # (They take seconds; a hang fails here with its log instead of holding the deploy for hours.)
        timeout-minutes: 10
        run: |
          # The admin sandbox's real test needs the user-id tools (newuidmap), as Coder's image has them.
          command -v newuidmap >/dev/null || sudo apt-get install -y -qq uidmap >/dev/null
          sudo -E env "PATH=$PATH" CODER_TESTS_NEED_ROOT=1 node --test test/root-safety.test.mjs test/room.test.mjs test/sandbox.test.mjs
      - name: Make the token key
        env:
          SEED: ${{ secrets.CODER_GITHUB_CLIENT_SECRET }}
        run: |
          k=$(printf 'gofarther-coder-token-key-v2' | openssl dgst -sha256 -hmac "$SEED" -binary | base64)
          echo "::add-mask::$k"
          echo "CODER_TOKEN_KEY=$k" >> "$GITHUB_ENV"
      - name: Make Coder's storage (once; fine if it exists)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          out=$(npx --yes wrangler@4.107.0 r2 bucket create "$BUCKET" 2>&1) || true
          echo "$out" | tail -n 3
      - name: "Fly.io: switched on?"
        id: fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          WANT: ${{ github.event.inputs.machines || 'fly' }}
        run: |
          if [ -n "$FLY_API_TOKEN" ] && [ "$WANT" = "fly" ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"; echo "Chats' machines: Fly.io ($FLY_APP)."
          else
            echo "on=false" >> "$GITHUB_OUTPUT"; echo "Chats' machines: Cloudflare (no FLY_API_TOKEN secret, or cloudflare was picked)."
          fi
      - name: "Fly.io: install flyctl"
        if: steps.fly.outputs.on == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: "Fly.io: the app, its addresses and Coder's keys (made once; fine if they exist)"
        if: steps.fly.outputs.on == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if ! flyctl apps list --json | jq -e --arg a "$FLY_APP" 'map(.Name // .name) | index($a) != null' >/dev/null; then
            flyctl apps create "$FLY_APP" --org "$FLY_ORG"
          fi
          if [ "$(flyctl ips list -a "$FLY_APP" --json | jq 'length')" = "0" ]; then
            flyctl ips allocate-v6 -a "$FLY_APP"
            flyctl ips allocate-v4 --shared -a "$FLY_APP"
          fi
          # NO KEYS ON FLY.IO ITSELF (2026-11-07). Your Grok key stays on Coder's Worker (the machines'
          # AI calls go through it), and each machine's own lock key is in its own settings (made by
          # the Worker from CODER_TOKEN_KEY and the machine's name). The shared copies Fly.io held are
          # taken away (each machine loses them at its next update).
          for k in XAI_API_KEY CODER_CONTROL_KEY; do
            if flyctl secrets list -a "$FLY_APP" --json | jq -e --arg k "$k" 'map(.Name // .name) | index($k) != null' >/dev/null; then
              flyctl secrets unset "$k" -a "$FLY_APP" --stage
            fi
          done
      - name: "Fly.io: build Coder's machine and send it"
        id: flyimage
        if: steps.fly.outputs.on == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl auth docker
          # THE VERSION NAME CHANGES ONLY WHEN CODER'S MACHINE DOES (2026-11-07): it is the
          # git fingerprint of coder/container, so a deploy that changes nothing there leaves
          # every chat's machine as it is (its kept disk, and no setup running again).
          img="registry.fly.io/$FLY_APP:coder-$(git rev-parse HEAD:coder/container | cut -c1-12)"
          # ALL OF CLAUDE CODE'S TOOLS (owner, 2026-11-07): Fly.io's machines get the full image
          # (Cloudflare's backup machines keep the small one, which wrangler builds below). It
          # takes a while to build, so a version already sent is not built again.
          # FLY.IO'S IMAGE STORE SOMETIMES CUTS A BIG UPLOAD OFF (deploy 86, 2026-11-10: "connection
          # reset by peer" at the last layer, twice in a row). What it already has is not sent again,
          # so an upload is tried up to five times before the deploy gives up.
          send() {
            for try in 1 2 3 4 5; do
              if docker push "$1"; then return 0; fi
              if [ "$try" = 5 ]; then echo "The upload to Fly.io failed five times."; return 1; fi
              echo "The upload to Fly.io was cut off; trying again ($try of 5)."
              sleep $((try * 20))
              flyctl auth docker
            done
          }
          if docker manifest inspect "$img" >/dev/null 2>&1; then
            echo "Coder's machine $img is already on Fly.io: not built again."
          else
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            # THE TOOLS ARE BUILT ONCE (owner, 2026-11-10: "yea do that lol, do it from now on"): the
            # Dockerfile up to its last stage (every tool, container/tools too) is its own image on
            # Fly.io, named after what it is built from and the month, so it is built again only when
            # those change, or once a month to stay fresh. A deploy that changes only Coder's own files
            # builds just the last stage on top of it: a few minutes, not a quarter of an hour.
            base="registry.fly.io/$FLY_APP:coder-tools-$({ sed '/^FROM \${CODER_IMAGE} AS app/,$d' container/Dockerfile; git rev-parse HEAD:coder/container/tools; date -u +%Y-%m; } | sha256sum | cut -c1-12)"
            if docker manifest inspect "$base" >/dev/null 2>&1; then
              echo "The machine's tools ($base) are already on Fly.io: only Coder's own files are built."
            else
              docker build --build-arg CODER_IMAGE=full --target full -t "$base" container
              send "$base"
            fi
            docker build --build-arg CODER_IMAGE="$base" -t "$img" container || { sleep 20; flyctl auth docker; docker build --build-arg CODER_IMAGE="$base" -t "$img" container; }
            send "$img"
          fi
          echo "image=$img" >> "$GITHUB_OUTPUT"
      - name: "Fly.io: give the Worker the token"
        if: steps.fly.outputs.on == 'true' && env.TARGET == 'live'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: printf '%s' "$FLY_API_TOKEN" | npx --yes wrangler@4.107.0 secret put FLY_API_TOKEN
      - name: Deploy Coder
        if: env.TARGET == 'live'
        uses: cloudflare/wrangler-action@v3
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GITHUB_APP_CLIENT_SECRET: ${{ secrets.CODER_GITHUB_CLIENT_SECRET }}
          CODER_GITHUB_WEBHOOK_SECRET: ${{ secrets.CODER_GITHUB_WEBHOOK_SECRET }}
          CODER_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CODER_GITHUB_APP_PRIVATE_KEY }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.107.0"
          workingDirectory: coder
          # Where chats' machines run, and (on Fly.io) the machine version just sent.
          command: deploy --var CODER_MACHINES:${{ steps.fly.outputs.on == 'true' && 'fly' || 'cloudflare' }} --var CODER_FLY_APP:${{ env.FLY_APP }} --var CODER_FLY_IMAGE:${{ steps.flyimage.outputs.image || 'none' }}
          secrets: |
            XAI_API_KEY
            GITHUB_APP_CLIENT_SECRET
            CODER_TOKEN_KEY
            CODER_GITHUB_WEBHOOK_SECRET
            CODER_GITHUB_APP_PRIVATE_KEY
      # THE TEST COPY: every wrangler command here names wrangler.test.json, so none reaches the live Worker.
      - name: "Test copy: its own settings (from wrangler.jsonc)"
        if: env.TARGET == 'test'
        run: node test-copy.mjs
      - name: "Test copy: deploy it to jessica.gofarther.dev"
        if: env.TARGET == 'test'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MACHINES: ${{ steps.fly.outputs.on == 'true' && 'fly' || 'cloudflare' }}
          IMAGE: ${{ steps.flyimage.outputs.image || 'none' }}
        run: npx --yes wrangler@4.107.0 deploy --config wrangler.test.json --var "CODER_MACHINES:$MACHINES" --var "CODER_FLY_APP:$FLY_APP" --var "CODER_FLY_IMAGE:$IMAGE"
      - name: "Test copy: its keys (on the test copy only)"
        if: env.TARGET == 'test'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GITHUB_APP_CLIENT_SECRET: ${{ secrets.CODER_GITHUB_CLIENT_SECRET }}
          CODER_GITHUB_WEBHOOK_SECRET: ${{ secrets.CODER_GITHUB_WEBHOOK_SECRET }}
          CODER_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CODER_GITHUB_APP_PRIVATE_KEY }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          f="$RUNNER_TEMP/test-copy-keys.json"
          node -e 'const n = ["XAI_API_KEY", "GITHUB_APP_CLIENT_SECRET", "CODER_TOKEN_KEY", "CODER_GITHUB_WEBHOOK_SECRET", "CODER_GITHUB_APP_PRIVATE_KEY", "FLY_API_TOKEN"]; const o = {}; for (const k of n) if (process.env[k]) o[k] = process.env[k]; require("fs").writeFileSync(process.argv[1], JSON.stringify(o), { mode: 0o600 });' "$f"
          npx --yes wrangler@4.107.0 secret bulk "$f" --config wrangler.test.json
          rm -f "$f"
      - name: Check it answers
        run: |
          for i in 1 2 3 4 5 6; do
            if out=$(curl -fsS "$SITE/health"); then echo "$out"; exit 0; fi
            sleep 20
          done
          echo "::warning::$SITE did not answer yet (a new address can take a few minutes)."
