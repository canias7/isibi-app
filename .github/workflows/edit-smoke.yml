# The edit and addon lanes against the deployed Worker.
#
# The two cheap rungs — `edit` (four layers) and `addon` — shipped with NO live
# coverage of any kind. `build smoke` proves the BUILD path and never touches
# these routes; `member smoke` proves auth. Nothing drove the thing a customer
# actually does after their site exists: type a sentence and have the cheapest
# possible thing happen. This repo has recorded a feature dead at a silent
# wiring layer nine times, and every one looked fine from both ends.
#
# UNLIKE `member smoke`, THIS ONE COSTS REAL MONEY — about 50 credits a run: one
# real build to have a site to edit, then the lanes themselves. That is why it is
# NOT on every deploy. It runs when the lanes' own code changes, and on demand.
#
# WHAT THIS FILTER CANNOT COVER, stated because it cost a night. The lanes'
# ROUTE — the dispatch, and the response object the composer reads — lives in
# `worker.js`, which is NOT here and cannot be: it changes on nearly every commit
# and this run is ~50 credits. So on 2026-08-12 the route was found to have never
# forwarded `remove`, page deletion was unreachable in the product from the day it
# shipped, and no run fired for the commit that fixed it. If a change touches the
# wiring rather than a lane module, trigger this by hand or with a change to a
# file that is listed.
#
# AND WHAT IT COVERS IS NARROWER THAN WHAT IT NAMES. `site-text.mjs`,
# `site-picture.mjs` and `site-logo.mjs` are lane modules with NO assertion in
# this run — text, picture and logo are still unproven live. They are worth
# listing anyway (a change there is a change to the edit lane), but a green run
# says nothing about them.
#
# It also burns a throwaway Neon project and a Supabase user per run, both
# destroyed in the test's `finally`.
name: edit smoke

on:
  push:
    branches: [main]
    paths:
      - 'builder/site-apply.mjs'
      - 'builder/site-addon.mjs'
      - 'builder/site-rules.mjs'
      - 'builder/site-picture.mjs'
      - 'builder/site-ask.mjs'
      - 'builder/site-text.mjs'
      # THE FILE THAT DECIDES WHAT THE LANES CAN EXPRESS. Left out at first, and
      # it cost a cycle: the fix for the delete verb was a change to the tool
      # SCHEMA in page-gen.mjs, this filter did not name it, and the run that
      # would have proved the fix never fired. The addon prompt, the tool the
      # model answers with, and `validatePages` all live here.
      #
      # The cost, stated: page-gen.mjs changes often and this run is ~50 credits.
      # That is the right trade for a lane customers pay for — and `build smoke`
      # covers the other half of this file for free on every deploy anyway.
      - 'builder/page-gen.mjs'
      # THE LOOK LANE'S OWN MERGE, and it was missing. `mergeLook` and
      # `EDIT_FIELDS` live here and the rename is FOUR of this run's assertions,
      # so a change here can break a lane this check covers and never be checked.
      # Second time the trigger list has forgotten a file it needed — the first
      # was the picture layer.
      - 'builder/site-edit.mjs'
      - 'test/integration/edit-smoke.mjs'
      - '.github/workflows/edit-smoke.yml'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to test against'
        required: false
        default: 'https://gofarther.dev'

jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund

      # WAIT FOR THE DEPLOY OF THIS COMMIT, RATHER THAN GUESSING AT IT.
      #
      # This slept 90 seconds while the deploy takes about THREE MINUTES, so
      # every run tested the Worker mid-replacement — with two container images
      # rebuilding underneath it, because the build image bakes the template's
      # dependencies. Measured 2026-08-12: two compile failures in one run,
      # one of them `internal error; reference = …`, which is Cloudflare saying
      # the container could not start. Every step that does NOT use the
      # container passed in the same run.
      #
      # It is why results have been inconsistent all night: a `422 write` that
      # passed next time, a rename that failed to compile and then did not.
      # Infrastructure churn was being read as the code being wrong.
      #
      # `build smoke` and `member smoke` avoid this with `workflow_run`, which
      # fires only on a SUCCESSFUL deploy. This one cannot use it: `workflow_run`
      # carries no path filter, so it would run on every deploy at ~50 credits a
      # time, which is the whole reason this workflow is on `push` with paths.
      # So it polls for the same fact instead.
      #
      # FALLS THROUGH RATHER THAN FAILING. If the deploy is still going after the
      # cap, or was skipped (a docs-only commit deploys nothing), it proceeds —
      # which is exactly today's behaviour and never worse.
      - name: Wait for this commit's deploy to land
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            state=$(gh run list --workflow=deploy.yml --commit="$GITHUB_SHA" \
              --json status,conclusion --jq '.[0] | "\(.status)/\(.conclusion // "")"' 2>/dev/null || echo "")
            case "$state" in
              completed/success) echo "deploy landed after $((i * 15))s"; sleep 20; exit 0 ;;
              completed/*) echo "the deploy did not succeed ($state) — testing the Worker that is live"; exit 0 ;;
              "") echo "no deploy found for this commit yet ($((i * 15))s)" ;;
              *) echo "deploy $state ($((i * 15))s)" ;;
            esac
            sleep 15
          done
          echo "gave up waiting after 10m — proceeding, which is what the old fixed sleep always did"

      - name: The edit and addon lanes, end to end
        env:
          SMOKE_BASE_URL: ${{ github.event.inputs.base_url || 'https://gofarther.dev' }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: node test/integration/edit-smoke.mjs
