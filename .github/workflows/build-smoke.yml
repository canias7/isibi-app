# Production smoke test for the builder send path. Drives the deployed Worker
# over HTTP and removes the site's Neon project when it is done.
#
# The account it builds as is either a throwaway this run creates and deletes,
# or — when SMOKE_EMAIL/SMOKE_PASSWORD are set — a real one that brings its own
# credits, which is never created, never funded and never deleted. That gate is
# asserted in test/build-smoke-safety.test.mjs, because the teardown's user
# delete cascades and there is no undo.
#
# Runs after every successful deploy to main, and on demand. It spends two real
# Sonnet calls per run (the schema, then the pages) — worth it: both bugs found
# on 2026-07-27/28 (the access level vocabulary and a 500 on a missing field)
# were invisible to review and only showed up when something real ran against
# the deployed Worker.
name: build smoke

on:
  workflow_run:
    workflows: ["Deploy to Cloudflare"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to test against'
        required: false
        default: 'https://gofarther.dev'

jobs:
  smoke:
    # A failed deploy has nothing new to smoke-test.
    #
    # OPT IN, NOT OUT (owner 2026-08-30: "flip them, don't spend any"). This run
    # is two real builds — two model calls, a Neon project, ~$0.40 — and until
    # today it happened on EVERY deploy unless the commit message said not to.
    # A default of spend is a default that loses: in one session seven pushes
    # went out without the marker and six of them bought a run, and FIVE of
    # those were merge commits, whose message git writes itself and which can
    # therefore never carry any marker at all.
    #
    # So `[smoke]` in the message now turns it ON. Note that `[skip smoke]`,
    # which is all over this repo's history, does not contain `[smoke]` — every
    # old commit stays free, which is the point.
    #
    # THE COST OF THIS IS REAL AND IS THE OWNER'S CALL: nothing pays for a
    # regression check by accident any more, so nothing catches one by accident
    # either. `workflow_dispatch` is the answer — run it by hand before anything
    # that matters, and it is never vetoable by a commit message.
    #
    # Read off the DEPLOY's head commit, because that is the commit this run
    # would be testing.
    #
    # DELIBERATELY NOT GitHub's own skip marker anywhere near this: that one
    # suppresses EVERY workflow for the push, deploy included, so the change
    # would not ship at all. It happened here on 2026-07-29 from a message that
    # merely explained the marker, and again on 2026-08-16 from a merge message
    # doing the same. When writing about it, call it "the skip marker" and never
    # spell it. test/deploy-secrets.test.mjs holds the half that lives here.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success'
      && contains(github.event.workflow_run.head_commit.message, '[smoke]'))
    runs-on: ubuntu-latest
    # A build is now design → provision → generate → compile → publish, and the
    # build container may be cold. Ten minutes was sized for the schema alone.
    # 15 MINUTES WAS THE WHOLE BUDGET AND `playwright install` ATE IT.
    # Measured 2026-08-19: the browser install ran 20:59:23 -> 21:14:28, the
    # job was cancelled at the timeout, and `build smoke` was SKIPPED — a run
    # that spent 15 minutes of runner and proved nothing, on a commit whose
    # whole purpose was one build.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund

      # The smoke test drives the published site in a real browser — the only
      # check that fails when a site is published but dead. playwright is not a
      # Worker dependency, so it is installed here rather than added to the root
      # package.json that wrangler bundles.
      - run: npm i --no-save --no-audit --no-fund playwright@^1.49.0
      # BOUNDED, AND NOT ALLOWED TO FAIL THE RUN. The browser is for the page
      # checks alone; the build, the publish and every API assertion need none
      # of it. Letting a slow apt mirror take the whole job down loses the part
      # that costs money to re-run in order to protect the part that does not.
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 6
        continue-on-error: true

      - name: build smoke
        env:
          SMOKE_BASE_URL: ${{ inputs.base_url || 'https://gofarther.dev' }}
          # THE DISCONNECT EXPERIMENT RAN ON 2026-08-23 AND ITS SWITCH IS OUT.
          #
          # `SMOKE_CUT_MS=30000` destroyed the build's own socket 30 seconds in
          # and then watched the site. It is the ONLY way to prove what the queue
          # was built for — every layer below it is driven in
          # `test/build-queue-wiring.test.mjs`, and what no local test can reach
          # is whether Cloudflare really keeps a consumer alive with nobody
          # connected, because that is a fact about their runtime.
          #
          # RESULT: `smoke-mt5igr76-jdd38`. POST 07:54:03, socket destroyed at
          # 07:54:34 (30.0s), and the build ran another 11m58s with nothing
          # connected to it — `done: true`, `total_ms: 748122`, 28 credits, a
          # real barber's site with a working /book route. Proved.
          #
          # IT COMES OUT BECAUSE A CUT RUN PROVES ONE THING AND SKIPS THE REST:
          # everything downstream reads the answer it destroyed on purpose. Left
          # in, every deploy would spend a build to re-prove one fact and stop
          # checking the other eighty. Set it again — with SMOKE_KEEP_SITE=1, so
          # the result can be looked at — to re-run the experiment.
          #
          # The knob itself stays in `build-smoke.mjs`, inert unless set, and is
          # guarded in `test/site-versions.test.mjs`.
          # THE NO-FAMILY EXPERIMENT RAN 2026-08-19 AND ITS SWITCH IS NOW GONE
          # ENTIRELY, because what it tested is what every build does.
          #
          # `SMOKE_NO_FAMILY=1` built with no layout family, so the model decided
          # the page set, the section order, the primary action and the
          # components from the brief alone. Two builds ran and NEITHER
          # compiled, against a documented ~19/21 with families — but both
          # failed by INVENTING A KIT API rather than by laying a page out
          # badly: one asked `localBusinessJsonLd` for an `email` it did not
          # take, the other imported `Hero` from `hero-split`. So the
          # measurement was n=2 and half of it was our fault — the prompt's own
          # reference pages imported ten modules the shortlist told the model
          # not to use. Both of those were fixed; the families were deleted on
          # 2026-08-20 and the designer authors a plan per site instead.
          #
          # `SMOKE_SKIP_JOURNEY=1` (one build, no revise, no edit lanes) and
          # `SMOKE_KEEP_SITE=1` (the site is left standing to be looked at) are
          # still here. A kept site is a live Neon project, so delete it when
          # the question is answered.
          #
          # SMOKE_BRIEF overrides the brief in build-smoke.mjs. Left unset
          # on purpose: the default is the one every assertion below it was
          # calibrated against — a trade with a list to READ and a form to
          # WRITE. A brief of a different SHAPE fails those honestly. Measured
          # 2026-08-16 with a photography studio: 97/100, and two of the three
          # were the `agency` family's home page doing exactly what the family
          # declares ("the strongest work, uncrowded"), not a bug.
          #
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          # RUN AS A REAL ACCOUNT (owner's call). `buildFloor` reached 20 against
          # a 20-credit grant and the routing call spends 1 before the gate, so a
          # throwaway account cannot finish a cold first build. The answer is not
          # to raise the free grant — it is to run as an account that brings its
          # own credits.
          #
          # BOTH OR NEITHER: with one half set the run reads as NOT supplied and
          # creates a throwaway, which is the safe direction. Unset entirely,
          # everything behaves exactly as it did before this existed.
          #
          # No fallback value, deliberately. `test/deploy-secrets.test.mjs`
          # records why an optional secret usually needs one — an empty value in
          # wrangler-action's `secrets:` list fails the whole deploy — but that
          # is about uploading secrets to the Worker. Here the name is only read
          # by a test script that treats an empty string as "not supplied", so a
          # fallback would invent a credential rather than prevent a failure.
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: node test/integration/build-smoke.mjs

      # What the site actually looked like to a visitor, kept whether or not the
      # run passed — a screenshot is the fastest way to tell a real regression
      # from a flaky assertion.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-site
          path: smoke-*.png
          if-no-files-found: ignore
