# A complete audit of the visitor-auth layer, against the DEPLOYED Worker.
#
# The unit suite proves each decision against fakes; this proves the layer on
# production — a real site, a real Neon database, real HTTP, a real browser.
# Every bug this layer has had was invisible to review and to the unit tests (a
# column nothing created, a token kind nothing checked, a hook nobody could
# call) and only showed up when something real ran against the deployed thing.
#
# Costs one page-generation call. The schema is sent explicitly rather than
# designed, which skips the designer call and makes the run deterministic — the
# auth layer is under test, not the model's judgement about tables.
#
# Everything it creates is torn down in `finally`: the site, the Neon project,
# the throwaway account.
name: auth smoke

on:
  workflow_run:
    workflows: ["Deploy to Cloudflare"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to audit"
        required: false
        default: "https://isibi.ai"

# The screenshots and the report are committed, so the result is reviewable
# without opening a CI log and survives artifact expiry.
permissions:
  contents: write

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund --loglevel=error

      # The audit drives the published site in a real browser — the only check
      # that fails when a site is published but dead.
      - run: npx playwright install --with-deps chromium

      - name: Audit the auth layer
        id: audit
        env:
          SMOKE_BASE_URL: ${{ github.event.inputs.base_url || 'https://isibi.ai' }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: node test/integration/auth-smoke.mjs

      # Runs even when the audit fails: a failed audit is exactly when the
      # screenshots and the per-check report are worth having.
      - name: Commit the audit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain docs/auth-audit)" ]; then
            git add docs/auth-audit
            # [skip ci] is load-bearing, not tidiness: this pushes to main,
            # main triggers Deploy, and Deploy triggers THIS workflow. Without it
            # the audit re-runs itself forever, spending a build every cycle.
            git commit -m "Auth audit against production ($(date -u +%Y-%m-%dT%H:%MZ)) [skip ci]"
            # The branch moves under long runs; rebase rather than fail.
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep $((i * 5))
            done
          else
            echo "no audit output to commit"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auth-audit
          path: docs/auth-audit
          if-no-files-found: ignore
