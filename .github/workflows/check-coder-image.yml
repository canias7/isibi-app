name: Check Coder's machine

# CODER'S MACHINE, BUILT AND TRIED BEFORE ANY DEPLOY (owner, 2026-11-07: "can we
# install all the tools we need?"). Builds the small image (Cloudflare's backup
# machines) and the full one (Fly.io's machines, with all of Claude Code's
# tools), starts Coder's service in each, and tries every tool as Coder's own
# user (coder/test/machine-tools.sh). It deploys nothing and uses no secrets.
# It runs when Coder's machine changes on a branch, or with its button.

on:
  push:
    branches-ignore: [main]
    paths:
      - "coder/container/**"
      - "coder/test/machine-tools.sh"
      - "coder/test/room-check.mjs"
      - "coder/test/sandbox-check.mjs"
      - "coder/test/sandbox.test.mjs"
      - "coder/test/room.test.mjs"
      - "coder/test/root-safety.test.mjs"
      - ".github/workflows/check-coder-image.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # THE DEPLOY'S ADMIN TESTS ON THE DEPLOY'S OWN KIND OF MACHINE (deploy, 2026-11-07: it runs on
  # ubuntu-latest, now Ubuntu 26.04 with another sudo; the check below runs on 24.04, like Coder's image).
  deploy-machine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: The deploy's admin tests, on the deploy's kind of machine (as root)
        working-directory: coder
        run: |
          npm ci --no-audit --no-fund
          command -v newuidmap >/dev/null || sudo apt-get install -y -qq uidmap >/dev/null
          sudo -E env "PATH=$PATH" CODER_TESTS_NEED_ROOT=1 node --test test/root-safety.test.mjs test/room.test.mjs test/sandbox.test.mjs

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # THE DEPLOY'S ADMIN TESTS, ON GITHUB'S OWN MACHINE, AS THE DEPLOY RUNS THEM (deploy,
      # 2026-11-07: the admin sandbox passed in Coder's image below but not there, which only
      # the deploy found). First, so a branch learns it in minutes, before any merge.
      - name: The deploy's admin tests, on GitHub's own machine (as root)
        working-directory: coder
        run: |
          npm ci --no-audit --no-fund
          command -v newuidmap >/dev/null || sudo apt-get install -y -qq uidmap >/dev/null
          sudo -E env "PATH=$PATH" CODER_TESTS_NEED_ROOT=1 node --test test/root-safety.test.mjs test/room.test.mjs test/sandbox.test.mjs

      - name: Make room for the full image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build the small image (Cloudflare's backup machines)
        run: docker build -t coder:core coder/container

      - name: Build the full image (Fly.io's machines)
        run: docker build --build-arg CODER_IMAGE=full -t coder:full coder/container

      - name: Coder's service starts in both
        run: |
          for pair in core:8081 full:8082; do
            img="${pair%:*}" port="${pair#*:}"
            docker run -d --name "svc-$img" -p "$port:8080" "coder:$img"
            for i in $(seq 1 30); do curl -fsS "http://localhost:$port/health" && break; sleep 2; done
            echo
            curl -fsS "http://localhost:$port/health" | grep -q '"ok":true'
            docker rm -f "svc-$img" >/dev/null
          done
          docker images coder --format '{{.Repository}}:{{.Tag}} {{.Size}}'

      - name: Every tool, as Coder's own user
        run: |
          # The runner's Ubuntu stops programs from making their own user namespaces,
          # which Docker without admin rights needs; Fly.io's machines have no such rule.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          # Coder's home on a plain disk folder, as on Fly.io (/data/home, the chat's own disk):
          # Docker's engine cannot stack its layers on the image's own layered disk.
          sudo mkdir -p /tmp/dev-home && sudo chown 1001:1001 /tmp/dev-home
          docker run --rm --privileged -v /tmp/dev-home:/home/dev -v "$PWD/coder/test:/coder-test:ro" coder:full bash /coder-test/machine-tools.sh

      - name: The admin sandbox, in Coder's own image
        run: |
          # ADMIN FOR ANYTHING, SEALED (owner, 2026-11-07: "finish this"; coder/test/sandbox-check.mjs).
          # On Fly.io the sandbox's system is the machine image's own disk (/dev/vda); here the
          # same image is made a disk and given to the machine the same way.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          df -h /mnt /
          docker create --name full-disk coder:full >/dev/null
          sudo truncate -s 16G /mnt/coder-full.img
          sudo mkfs.ext4 -q -F /mnt/coder-full.img
          sudo mkdir -p /mnt/coder-full && sudo mount -o loop /mnt/coder-full.img /mnt/coder-full
          docker export full-disk | sudo tar -x -C /mnt/coder-full
          sudo umount /mnt/coder-full
          docker rm full-disk >/dev/null
          loop=$(sudo losetup -f --show -r /mnt/coder-full.img)
          # The chat's kept disk, as on Fly.io: a plain disk folder.
          sudo mkdir -p /mnt/coder-data
          docker run --rm --privileged -e CODER_SANDBOX_BASE="$loop" -v /mnt/coder-data:/data -v "$PWD/coder/test:/coder-test:ro" coder:full node /coder-test/sandbox-check.mjs
          sudo losetup -d "$loop"
