# End-to-end check of the per-site Postgres layer against a real Neon account.
# Provisions a throwaway project, applies a schema, exercises the triggers and
# full-text search, then deletes the project. Runs on changes to that layer.
name: neon e2e

on:
  push:
    # main ONLY, and this is a cost control rather than tidiness. Work here lands
    # by pushing the feature branch and then fast-forwarding main, which is TWO
    # pushes of one commit — and with no branch filter both matched, so every
    # change provisioned TWO real Neon projects instead of one. Projects are
    # capped per Neon ACCOUNT (100 on the current plan) and per-site projects
    # already consume that cap, so doubling the throwaways is the one form of CI
    # waste here that can actually block a customer's build. Observed 2026-08-07:
    # runs 31140860698 and 31140861548, same commit, one second apart.
    # `deploy` and `page-gen-eval` — the other two workflows that spend real
    # money — were already filtered this way.
    branches: [main]
    paths:
      - 'site-db.mjs'
      - 'site-schema.mjs'
      # The provisioning order — project, database, and the rows that record
      # them. A change here can leak a capped, billed Neon project, so it must
      # reach the one workflow that talks to a real Neon account.
      - 'site-provision.mjs'
      - 'ttl-cache.mjs'
      - 'test/integration/neon-e2e.mjs'
      - '.github/workflows/neon-e2e.yml'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    # A hung provisioning call should not burn a job slot for six hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: unit tests
        run: npm test
      - name: end-to-end against Neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: node test/integration/neon-e2e.mjs
