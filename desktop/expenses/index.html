<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
<title>Go Farther Money</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bar">
  <select id="month"></select>
  <button id="newMonth">+ Month</button>
  <button id="addP">+ Platform row</button>
  <button id="addB">+ Builder row</button>
  <button id="addX">+ Extra under selected</button>
  <button id="addI">+ Income row</button>
  <button id="del">Delete selected</button>
  <button id="csv">Export CSV</button>
  <span id="saved"></span>
</div>
<div class="sum">
  <div><small>Income</small><b id="tIn" class="in"></b></div>
  <div><small>Expenses</small><b id="tEx" class="ex"></b></div>
  <div><small>Profit</small><b id="tPr"></b></div>
</div>
<div class="wrap">
  <div class="sheet"><div class="cap ex-top">Expenses</div><table id="exT"></table></div>
  <div class="sheet"><div class="cap in-top">Income</div><table id="inT"></table></div>
</div>
<div class="tabs" id="tabs"></div>
<script src="defaults.js"></script>
<script src="app.js"></script>
</body>
</html>
