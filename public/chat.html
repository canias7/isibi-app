<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>isibi — redirecting…</title>
  <script>
    const p = new URLSearchParams(location.search);
    const a = (p.get('agent') || '').toLowerCase();
    const q = p.get('q');
    if (a === 'nova' || a === 'zephyr') {
      location.replace('/' + a + (q ? '?q=' + encodeURIComponent(q) : ''));
    } else {
      location.replace('/');
    }
  </script>
</head>
<body></body>
</html>
