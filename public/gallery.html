<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>isibi — Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>

  <header class="topbar">
    <div class="logo" onclick="location.href='/'" style="cursor:pointer"><span class="logo-mark">i</span>isibi</div>
    <div class="auth">
      <button class="btn-ghost">Login</button>
      <button class="btn-neon">Sign up</button>
    </div>
  </header>

  <div class="shell">
    <aside class="sidebar">
      <div class="side-label">Workspace</div>
      <div class="side-item" onclick="location.href='/'">
        <span class="tile home">⌂</span><span>Home</span>
      </div>
      <div class="side-item active" onclick="location.href='/gallery'">
        <span class="tile gallery">▦</span><span>Gallery</span>
      </div>
      <div class="side-item" onclick="location.href='/avatar'">
        <span class="tile persona">◉</span><span>Avatar</span>
      </div>
      <div class="side-label">Chats</div>
      <button class="new-chat" onclick="location.href='/'"><span class="plus">+</span> New chat</button>
    </aside>

    <main class="main">
      <section class="home-view">
        <div class="hero">
          <h1>Your gallery.<span class="accent">Every creation, one place.</span></h1>
          <p style="color:var(--muted); margin-top:1.2rem; font-size:1.05rem;">Images and videos you generate will show up here soon.</p>
        </div>
      </section>
    </main>
  </div>

</body>
</html>
