<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>isibi — Your AI Agents</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>

  <header class="topbar">
    <div class="logo"><span class="logo-mark">i</span>isibi</div>
    <div class="auth">
      <button class="btn-ghost">Login</button>
      <button class="btn-neon">Sign up</button>
    </div>
  </header>

  <div class="shell">
    <aside class="sidebar">
      <div class="side-label">Workspace</div>
      <div class="side-item active">
        <span class="tile home">⌂</span><span>Home</span>
      </div>
      <div class="side-label">Chats</div>
      <button class="new-chat" onclick="goChat()"><span class="plus">+</span> New chat</button>
    </aside>

    <main class="main">

      <section class="home-view">
        <div class="hero">
          <h1>Pick your agent.<span class="accent">Say anything.</span></h1>
        </div>
        <div class="agents">
          <div class="agent-card selected" data-agent="Nova" onclick="pick('Nova')" ondblclick="goChat()">
            <div class="tile nova">N</div>
            <div class="aname">Nova</div>
            <div class="atag">Website builder. Describe your site — Nova builds it. Zero fluff.</div>
            <div class="astart" onclick="event.stopPropagation(); pick('Nova'); goChat()">START CHAT ↵</div>
          </div>
          <div class="agent-card" data-agent="Zephyr" onclick="pick('Zephyr')" ondblclick="goChat()">
            <div class="tile zephyr">Z</div>
            <div class="aname">Zephyr</div>
            <div class="atag">Video generator. Describe the scene — Zephyr crafts it. No rush.</div>
            <div class="astart" onclick="event.stopPropagation(); pick('Zephyr'); goChat()">START CHAT ↵</div>
          </div>
        </div>
      </section>

      <div class="composer-wrap">
        <div class="composer">
          <input id="input" placeholder="Message Nova — say anything…" autocomplete="off"
                 onkeydown="if(event.key==='Enter')send()" />
          <div class="composer-row">
            <button class="send" id="sendBtn" onclick="send()">SEND ✦</button>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script>
    const AGENTS = ['Nova', 'Zephyr'];
    let agent = 'Nova';

    function syncUI() {
      document.querySelectorAll('.agent-card').forEach(c =>
        c.classList.toggle('selected', c.dataset.agent === agent));
      document.getElementById('input').placeholder = 'Message ' + agent + ' — say anything…';
    }

    function pick(name) {
      agent = name;
      syncUI();
      document.getElementById('input').focus();
    }

    function goChat() {
      location.href = '/' + agent.toLowerCase();
    }

    function send() {
      const text = document.getElementById('input').value.trim();
      const q = text ? '?q=' + encodeURIComponent(text) : '';
      location.href = '/' + agent.toLowerCase() + q;
    }

    syncUI();
  </script>
</body>
</html>
