<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>isibi — Zephyr · Video Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body data-agent="Zephyr">

  <header class="topbar">
    <div class="logo" onclick="location.href='/'" style="cursor:pointer"><span class="logo-mark">i</span>isibi</div>
  </header>

  <div class="shell">
    <aside class="sidebar">
      <div class="side-label">Workspace</div>
      <div class="side-item" onclick="location.href='/'">
        <span class="tile home">⌂</span><span>Home</span>
      </div>
      <div class="side-label">Chats</div>
      <button class="new-chat" onclick="newChat()"><span class="plus">+</span> New chat</button>
    </aside>

    <main class="main">

      <section class="chat active">
        <div class="chat-head">
          <span class="tile zephyr">Z</span>
          <div>
            <div class="cname">Zephyr</div>
            <div class="cstatus">● online · video generator</div>
          </div>
          <div class="head-actions">
            <span class="model-wrap">
              <button class="btn-ghost" onclick="toggleModelMenu(event)">Model: <b id="modelLabel">Auto</b> ▾</button>
              <div class="model-menu" id="modelMenu"></div>
            </span>
            </div>
        </div>
        <div class="thread"><div class="thread-inner" id="messages"></div></div>
      </section>

      <div class="composer-wrap">
        <div class="advanced">
          <button class="advanced-toggle" id="advToggle" onclick="toggleAdvanced()">
            <span class="gear">⚙</span> Advanced settings <span class="chev" id="advChev">▾</span>
          </button>
          <div class="advanced-panel" id="advPanel"></div>
        </div>
        <div class="composer">
          <div class="composer-top">
            <input type="file" id="fileImage" accept="image/*" hidden onchange="onAttach('image', this)" />
            <input type="file" id="fileAvatar" accept="image/*" hidden onchange="onAttach('avatar', this)" />
            <input type="file" id="fileAudio" accept="audio/*" hidden onchange="onAttach('audio', this)" />
            <input type="file" id="fileClip" accept="video/*" hidden onchange="onAttach('clip', this)" />
            <button class="attach-btn" id="btnImage" onclick="document.getElementById('fileImage').click()">+ Image</button>
            <button class="attach-btn" id="btnAvatar" title="Optional" onclick="document.getElementById('fileAvatar').click()">+ Avatar</button>
            <button class="attach-btn" id="btnAudio" title="Optional" onclick="document.getElementById('fileAudio').click()">+ Audio</button>
            <button class="attach-btn" id="btnClip" title="Source video" onclick="document.getElementById('fileClip').click()">+ Video clip</button>
            <input id="input" placeholder="Message Zephyr — say anything…" autocomplete="off"
                   onkeydown="if(event.key==='Enter')send()" />
            <input type="file" id="fileEnd" accept="image/*" hidden onchange="onAttach('end', this)" />
            <button class="attach-btn" id="btnEnd" title="Optional" onclick="document.getElementById('fileEnd').click()">+ End frame</button>
          </div>
          <div class="composer-row">
            <div class="mode-switch">
              <button class="mode-btn" data-mode="audio" onclick="setMode('audio')">Audio</button>
              <button class="mode-btn" data-mode="image" onclick="setMode('image')">Image</button>
              <button class="mode-btn active" data-mode="video" onclick="setMode('video')">Video</button>
            </div>
            <span class="opt-wrap" id="durWrap">
              <button class="opt-btn" onclick="toggleOpt(event, 'dur')">⏱ <b id="durLabel">5s</b> ▾</button>
              <div class="model-menu drop-up" id="durMenu"></div>
            </span>
            <span class="opt-wrap" id="ratioWrap">
              <button class="opt-btn" onclick="toggleOpt(event, 'ratio')">▭ <b id="ratioLabel">16:9</b> ▾</button>
              <div class="model-menu drop-up" id="ratioMenu"></div>
            </span>
            <span class="opt-wrap" id="qualWrap">
              <button class="opt-btn" onclick="toggleOpt(event, 'qual')">◆ <b id="qualLabel">720p</b> ▾</button>
              <div class="model-menu drop-up" id="qualMenu"></div>
            </span>
            <span class="opt-wrap" id="voiceWrap" style="display:none">
              <button class="opt-btn" onclick="toggleOpt(event, 'voice')">🎙 <b id="voiceLabel">Rachel</b> ▾</button>
              <div class="model-menu drop-up" id="voiceMenu"></div>
            </span>
            <button class="send" id="sendBtn" onclick="send()">SEND ✦</button>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script src="/chat.js"></script>
</body>
</html>
