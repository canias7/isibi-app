<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>isibi — Zephyr · Video Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body data-agent="Zephyr">

  <div id="authGate" class="auth-gate">
    <div class="auth-card">
      <div class="auth-brand"><span class="logo-mark">i</span> isibi</div>
      <h1 id="authTitle" class="auth-title">Sign in to Zephyr</h1>
      <p class="auth-sub">Create AI video, images, and voice.</p>

      <div class="auth-tabs">
        <button type="button" class="auth-tab active" id="tabPassword" onclick="setAuthMethod('password')">Password</button>
        <button type="button" class="auth-tab" id="tabCode" onclick="setAuthMethod('code')">Email code</button>
      </div>

      <form id="authForm" class="auth-form">
        <input id="authEmail" type="email" placeholder="Email" autocomplete="email" required />
        <input id="authPass" type="password" placeholder="Password" autocomplete="current-password" required />
        <div id="authError" class="auth-error" style="display:none"></div>
        <button id="authSubmit" class="auth-submit" type="submit">Sign in</button>
      </form>
      <div class="auth-switch" id="authSwitch">
        <span id="authSwitchText">New here?</span>
        <button id="authToggle" class="auth-link" type="button">Create an account</button>
      </div>

      <form id="codeForm" class="auth-form" style="display:none">
        <input id="codeEmail" type="email" placeholder="Email" autocomplete="email" />
        <input id="codeInput" type="text" inputmode="numeric" autocomplete="one-time-code"
               placeholder="6-digit code" maxlength="6" style="display:none" />
        <div id="codeError" class="auth-error" style="display:none"></div>
        <button id="codeSubmit" class="auth-submit" type="submit">Send code</button>
        <div class="auth-switch" id="codeHint" style="display:none">
          <span id="codeHintText">Code sent — check your email.</span>
          <button id="codeResend" class="auth-link" type="button">Resend</button>
        </div>
      </form>
    </div>
  </div>

  <header class="topbar">
    <div class="logo" onclick="location.href='/'" style="cursor:pointer"><span class="logo-mark">i</span>isibi</div>
  </header>

  <div class="shell">
    <aside class="sidebar">
      <div class="side-label">Workspace</div>
      <div class="side-item" onclick="location.href='/'">
        <span class="tile home">⌂</span><span>Home</span>
      </div>
      <div class="side-label">Chats</div>
      <button class="new-chat" onclick="newChat()"><span class="plus">+</span> New chat</button>
      <input id="chatSearch" class="chat-search" placeholder="🔍 Search chats…" autocomplete="off" oninput="renderChatList()" />
      <div id="chatList" class="chat-list"></div>
      <div class="side-foot" id="signOutRow" style="display:none">
        <div class="side-email" id="authEmailBadge"></div>
        <button class="side-signout" onclick="doSignOut()">Sign out</button>
      </div>
    </aside>

    <main class="main">

      <section class="chat active">
        <div class="chat-head">
          <span class="tile zephyr">Z</span>
          <div>
            <div class="cname">Zephyr</div>
            <div class="cstatus">● online · video generator</div>
          </div>
          <div class="head-actions">
            <span class="model-wrap">
              <button class="btn-ghost" onclick="toggleModelMenu(event)">Model: <b id="modelLabel">Auto</b> ▾</button>
              <div class="model-menu" id="modelMenu"></div>
            </span>
            </div>
        </div>
        <div class="thread"><div class="thread-inner" id="messages"></div></div>
      </section>

      <div class="composer-wrap">
        <div class="composer">
          <div class="composer-top">
            <input type="file" id="fileImage" accept="image/*" hidden onchange="onAttach('image', this)" />
            <input type="file" id="fileAvatar" accept="image/*" hidden onchange="onAttach('avatar', this)" />
            <input type="file" id="fileAudio" accept="audio/*" hidden onchange="onAttach('audio', this)" />
            <input type="file" id="fileClip" accept="video/*" hidden onchange="onAttach('clip', this)" />
            <button class="attach-btn" id="btnImage" onclick="document.getElementById('fileImage').click()">+ Image</button>
            <button class="attach-btn" id="btnAvatar" title="Optional" onclick="document.getElementById('fileAvatar').click()">+ Avatar</button>
            <button class="attach-btn" id="btnAudio" title="Optional" onclick="document.getElementById('fileAudio').click()">+ Audio</button>
            <button class="attach-btn" id="btnClip" title="Source video" onclick="document.getElementById('fileClip').click()">+ Video clip</button>
            <textarea id="input" rows="1" placeholder="Message Zephyr — say anything…" autocomplete="off"
                   oninput="autoGrow(this)"
                   onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send();}"></textarea>
            <input type="file" id="fileEnd" accept="image/*" hidden onchange="onAttach('end', this)" />
            <button class="attach-btn" id="btnEnd" title="Optional" onclick="document.getElementById('fileEnd').click()">+ End frame</button>
          </div>
          <div class="composer-row">
            <div class="mode-switch">
              <button class="mode-btn" data-mode="audio" onclick="setMode('audio')">Audio</button>
              <button class="mode-btn" data-mode="image" onclick="setMode('image')">Image</button>
              <button class="mode-btn active" data-mode="video" onclick="setMode('video')">Video</button>
            </div>
            <span class="opt-wrap" id="durWrap">
              <button class="opt-btn" onclick="toggleOpt(event, 'dur')">⏱ <b id="durLabel">5s</b> ▾</button>
              <div class="model-menu drop-up" id="durMenu"></div>
            </span>
            <span class="opt-wrap" id="ratioWrap">
              <button class="opt-btn" onclick="toggleOpt(event, 'ratio')">▭ <b id="ratioLabel">16:9</b> ▾</button>
              <div class="model-menu drop-up" id="ratioMenu"></div>
            </span>
            <span class="opt-wrap" id="qualWrap">
              <button class="opt-btn" onclick="toggleOpt(event, 'qual')">◆ <b id="qualLabel">720p</b> ▾</button>
              <div class="model-menu drop-up" id="qualMenu"></div>
            </span>
            <span class="opt-wrap" id="numWrap" style="display:none">
              <button class="opt-btn" title="How many images" onclick="toggleOpt(event, 'num')">▦ <b id="numLabel">1</b> ▾</button>
              <div class="model-menu drop-up" id="numMenu"></div>
            </span>
            <span class="opt-wrap" id="voiceWrap" style="display:none">
              <button class="opt-btn" onclick="toggleOpt(event, 'voice')">🎙 <b id="voiceLabel">Rachel</b> ▾</button>
              <div class="model-menu drop-up" id="voiceMenu"></div>
            </span>
            <button class="send" id="sendBtn" onclick="send(true)" aria-label="Send">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script src="/auth.js"></script>
  <script src="/chat.js"></script>
</body>
</html>
