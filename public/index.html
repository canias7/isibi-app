<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>isibi — Select an Agent</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      display: grid; place-items: center;
      min-height: 100vh; margin: 0;
      background: radial-gradient(1200px 800px at 50% -10%, #1e293b, #0f172a);
      color: #e2e8f0;
    }
    main { text-align: center; padding: 2rem; width: 100%; max-width: 720px; }
    h1 { margin: 0 0 .35rem; font-size: 1.9rem; letter-spacing: -0.02em; }
    .sub { color: #94a3b8; margin: 0 0 2.25rem; }
    .agents { display: flex; gap: 1.25rem; justify-content: center; flex-wrap: wrap; }
    .agent {
      flex: 1 1 240px; max-width: 280px;
      background: rgba(30, 41, 59, .65);
      border: 1px solid #334155; border-radius: 16px;
      padding: 2rem 1.5rem; cursor: pointer;
      transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
      text-align: center;
    }
    .agent:hover { transform: translateY(-3px); border-color: #64748b; }
    .agent.selected { border-color: #38bdf8; box-shadow: 0 0 0 2px rgba(56, 189, 248, .35); }
    .avatar {
      width: 72px; height: 72px; margin: 0 auto 1rem;
      border-radius: 50%; display: grid; place-items: center;
      font-size: 1.7rem; font-weight: 700; color: #0f172a;
    }
    .avatar.nova { background: linear-gradient(135deg, #38bdf8, #818cf8); }
    .avatar.zephyr { background: linear-gradient(135deg, #34d399, #fbbf24); }
    .name { font-size: 1.25rem; font-weight: 600; margin: 0 0 .3rem; }
    .desc { color: #94a3b8; font-size: .9rem; margin: 0; }
    .cta {
      margin-top: 2.25rem; padding: .8rem 2.4rem;
      font-size: 1rem; font-weight: 600;
      color: #0f172a; background: #38bdf8;
      border: none; border-radius: 10px; cursor: pointer;
      opacity: .4; pointer-events: none; transition: opacity .15s ease;
    }
    .cta.ready { opacity: 1; pointer-events: auto; }
    .cta.ready:hover { background: #7dd3fc; }

    /* Chat view */
    #chatView { display: none; width: 100%; max-width: 640px; height: min(82vh, 760px); }
    #chatView.active { display: flex; flex-direction: column; }
    .chat-card {
      display: flex; flex-direction: column; flex: 1; min-height: 0;
      background: rgba(30, 41, 59, .65);
      border: 1px solid #334155; border-radius: 16px; overflow: hidden;
    }
    .chat-header {
      display: flex; align-items: center; gap: .75rem;
      padding: .85rem 1rem; border-bottom: 1px solid #334155;
      background: rgba(15, 23, 42, .5);
    }
    .chat-header .avatar { width: 40px; height: 40px; margin: 0; font-size: 1rem; }
    .chat-header .title { font-weight: 600; text-align: left; }
    .chat-header .status { font-size: .75rem; color: #34d399; text-align: left; }
    .back {
      margin-left: auto; background: none; border: 1px solid #334155;
      color: #94a3b8; border-radius: 8px; padding: .4rem .8rem;
      cursor: pointer; font-size: .85rem;
    }
    .back:hover { color: #e2e8f0; border-color: #64748b; }
    .messages {
      flex: 1; overflow-y: auto; padding: 1rem;
      display: flex; flex-direction: column; gap: .6rem;
    }
    .msg {
      max-width: 80%; padding: .6rem .9rem; border-radius: 14px;
      font-size: .95rem; line-height: 1.45; text-align: left;
      white-space: pre-wrap; word-wrap: break-word;
    }
    .msg.user { align-self: flex-end; background: #38bdf8; color: #0f172a; border-bottom-right-radius: 4px; }
    .msg.agent { align-self: flex-start; background: #1e293b; border: 1px solid #334155; border-bottom-left-radius: 4px; }
    .msg.typing { color: #94a3b8; font-style: italic; }
    .composer {
      display: flex; gap: .6rem; padding: .85rem 1rem;
      border-top: 1px solid #334155; background: rgba(15, 23, 42, .5);
    }
    .composer input {
      flex: 1; padding: .7rem .9rem; font-size: .95rem;
      background: #0f172a; color: #e2e8f0;
      border: 1px solid #334155; border-radius: 10px; outline: none;
    }
    .composer input:focus { border-color: #38bdf8; }
    .composer button {
      padding: .7rem 1.3rem; font-weight: 600; font-size: .95rem;
      color: #0f172a; background: #38bdf8;
      border: none; border-radius: 10px; cursor: pointer;
    }
    .composer button:disabled { opacity: .4; cursor: default; }
    .composer button:not(:disabled):hover { background: #7dd3fc; }
  </style>
</head>
<body>
  <main id="selectView">
    <h1>Select an agent</h1>
    <p class="sub">Pick who you want to talk to</p>

    <div class="agents">
      <div class="agent" data-agent="Nova" onclick="pick(this)">
        <div class="avatar nova">N</div>
        <p class="name">Nova</p>
        <p class="desc">Bright, fast and to the point.</p>
      </div>
      <div class="agent" data-agent="Zephyr" onclick="pick(this)">
        <div class="avatar zephyr">Z</div>
        <p class="name">Zephyr</p>
        <p class="desc">Calm, thoughtful and easygoing.</p>
      </div>
    </div>

    <button class="cta" id="continueBtn" onclick="openChat()">Continue</button>
  </main>

  <div id="chatView">
    <div class="chat-card">
      <div class="chat-header">
        <div class="avatar" id="chatAvatar">N</div>
        <div>
          <div class="title" id="chatName">Nova</div>
          <div class="status">online</div>
        </div>
        <button class="back" onclick="backToSelect()">← Change agent</button>
      </div>
      <div class="messages" id="messages"></div>
      <div class="composer">
        <input id="input" placeholder="Type a message…" autocomplete="off"
               onkeydown="if(event.key==='Enter')send()" />
        <button id="sendBtn" onclick="send()">Send</button>
      </div>
    </div>
  </div>

  <script>
    const GREETINGS = {
      Nova: "Hey! Nova here. What do you need? Let's go.",
      Zephyr: "Hello there… I'm Zephyr. No rush — what's on your mind?",
    };

    let selected = null;
    let history = [];

    function pick(el) {
      document.querySelectorAll('.agent').forEach(a => a.classList.remove('selected'));
      el.classList.add('selected');
      selected = el.dataset.agent;
      document.getElementById('continueBtn').classList.add('ready');
    }

    function openChat() {
      if (!selected) return;
      history = [];
      document.getElementById('selectView').style.display = 'none';
      document.getElementById('chatView').classList.add('active');
      const av = document.getElementById('chatAvatar');
      av.textContent = selected[0];
      av.className = 'avatar ' + selected.toLowerCase();
      document.getElementById('chatName').textContent = selected;
      document.getElementById('messages').innerHTML = '';
      addMsg('agent', GREETINGS[selected]);
      history.push({ role: 'assistant', content: GREETINGS[selected] });
      document.getElementById('input').focus();
    }

    function backToSelect() {
      document.getElementById('chatView').classList.remove('active');
      document.getElementById('selectView').style.display = '';
    }

    function addMsg(kind, text) {
      const div = document.createElement('div');
      div.className = 'msg ' + kind;
      div.textContent = text;
      const box = document.getElementById('messages');
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
      return div;
    }

    async function send() {
      const input = document.getElementById('input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';

      addMsg('user', text);
      history.push({ role: 'user', content: text });

      const btn = document.getElementById('sendBtn');
      btn.disabled = true;
      const typing = addMsg('agent typing', selected + ' is typing…');

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ agent: selected, messages: history }),
        });
        const data = await res.json();
        typing.remove();
        if (data.reply) {
          addMsg('agent', data.reply);
          history.push({ role: 'assistant', content: data.reply });
        } else {
          addMsg('agent', '⚠️ ' + (data.error || 'Something went wrong.'));
        }
      } catch {
        typing.remove();
        addMsg('agent', '⚠️ Network error — try again.');
      } finally {
        btn.disabled = false;
        input.focus();
      }
    }
  </script>
</body>
</html>
