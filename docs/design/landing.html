<script>addEventListener("DOMContentLoaded",()=>{const o=document.getElementById("orbit"),tip=document.getElementById("tip");if(!o)return;const chips=[],BC={"Neon": ["A dedicated Postgres project per site, no shared schema", "Row-level security on every table; column-scoped grants", "Browser reads and writes via the Data API with Neon Auth JWTs", "Secrets AES-GCM encrypted; conditional writes return 409"], "Cloudflare": ["Workers + Workers for Platforms: one script per site", "R2 versioned builds; publish and rollback are a pointer swap", "Containers + Durable Objects run each build in isolation", "Custom domains and certificates via Cloudflare for SaaS"], "React 19": ["Typed component tree, server-rendered then hydrated", "Pages composed from a kit of 2,112 components"], "TypeScript": ["Every page type-checked with tsc on each build and edit", "Errors go back to the builder before publishing"], "Tailwind CSS v4": ["Design tokens and utilities via @tailwindcss/vite", "Only the classes a page uses ship"], "TanStack Start": ["File-based, type-safe routes with TanStack Router", "Server rendering; TanStack Query for cached data"], "Vite": ["Production bundles compiled by vite build", "A page that fails to build is never published"], "Chromium": ["Each page opened in a real browser before publishing", "Checked that it renders, not just that it compiles"], "xAI": ["Grok 4.6, the default builder model", "Designs the schema, writes pages, runs edits", "Forced tool_choice for exact structured output", "reasoning_effort low to extra high; prompt-cache routing"], "Anthropic": ["Claude Sonnet 5 and Opus 5 in the Builder menu", "Messages API with tool use and prompt caching", "Research step on Sonnet 5 with web search"], "Nano Banana Pro": ["Generates site photos at each slot's aspect ratio", "Called through fal; stored in Supabase storage", "Image purchases are switched off right now"], "Expo": ["Will build native iPhone and Android apps with React Native", "Planned for the mobile app; not in today's builds"]},items=[{cls:"neon",name:"Neon",cap:"Neon",html:"<svg class=\"nm\" aria-hidden=\"true\" viewBox=\"0 0 64 64\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M63 0.0177909V63.5526L38.4178 42.2501V63.5526H0V0L63 0.0177909ZM7.72251 55.8389H30.6953V25.3238L55.2779 47.0476V7.72922L7.72251 7.71559V55.8389Z\" fill=\"#34D59A\"/></svg>",tip:"<h4>Neon</h4><div class=\"sub\">Serverless Postgres \u00b7 data layer</div><div class=\"cols\"><div class=\"grp2\"><b>Isolation</b><ul><li>A dedicated Neon project per site, provisioned through the Neon API when the site’s schema first declares tables. No shared schema, no tenant column.</li><li>Region <code>aws-us-east-1</code>. Pages-only sites carry no database until they need one.</li></ul></div><div class=\"grp2\"><b>Access</b><ul><li>Reads and writes go through Neon’s Data API: the browser calls it directly, with JWTs issued by Neon Auth (anonymous tokens for visitors).</li><li>Server-side queries use the <code>@neondatabase/serverless</code> HTTP driver with parameterised SQL.</li></ul></div><div class=\"grp2\"><b>Security</b><ul><li>Row-level security on every table, keyed to the signed-in user (<code>app_user_id()</code>); a private table has no <code>SELECT</code> policy at all.</li><li>Column-scoped write grants for the <code>anonymous</code> and <code>authenticated</code> roles, e.g. <code>GRANT INSERT (\"name\",\"email\")</code>.</li><li>Engine functions pin <code>search_path</code> to <code>public, pg_temp</code>. Closing a table revokes every visitor privilege.</li></ul></div><div class=\"grp2\"><b>Members</b><ul><li>Neon Auth (Better Auth) provides sign-up and sign-in; member records live in the site’s own database (<code>neon_auth</code> schema).</li></ul></div><div class=\"grp2\"><b>Schema</b><ul><li>The site’s declared schema compiles to DDL; a <code>_meta</code> catalog records it, and recovery reads the live policies and grants rather than guessing.</li></ul></div><div class=\"grp2\"><b>Platform data</b><ul><li>Secrets (Stripe and webhook keys) are encrypted with AES-GCM in a <code>_secrets</code> table and never leave the server.</li><li><code>_metrics</code> keeps daily request and error counts; <code>_errors</code> keeps the error log.</li></ul></div><div class=\"grp2\"><b>Owner tools</b><ul><li>Browse and edit rows, import CSV and export. Writes can be conditional: one <code>UPDATE \u2026 WHERE</code> that returns <code>409</code> if the row changed underneath you.</li></ul></div><div class=\"grp2\"><b>Lifecycle</b><ul><li>Deleting a site queues its Neon project for teardown, retried until it’s gone.</li></ul></div></div>"},{cls:"cf",name:"Cloudflare",cap:"Cloudflare",html:"<svg class=\"nm\" aria-hidden=\"true\" viewBox=\"0 0 24 24\" xmlns=\"http://www.w3.org/2000/svg\"><path fill=\"#f38020\" d=\"M16.5088 16.8447c.1475-.5068.0908-.9707-.1553-1.3154-.2246-.3164-.6045-.499-1.0615-.5205l-8.6592-.1123a.1559.1559 0 0 1-.1333-.0713c-.0283-.042-.0351-.0986-.021-.1553.0278-.084.1123-.1484.2036-.1562l8.7359-.1123c1.0351-.0489 2.1601-.8868 2.5537-1.9136l.499-1.3013c.0215-.0561.0293-.1128.0147-.168-.5625-2.5463-2.835-4.4453-5.5499-4.4453-2.5039 0-4.6284 1.6177-5.3876 3.8614-.4927-.3658-1.1187-.5625-1.794-.499-1.2026.119-2.1665 1.083-2.2861 2.2856-.0283.31-.0069.6128.0635.894C1.5683 13.171 0 14.7754 0 16.752c0 .1748.0142.3515.0352.5273.0141.083.0844.1475.1689.1475h15.9814c.0909 0 .1758-.0645.2032-.1553l.12-.4268zm2.7568-5.5634c-.0771 0-.1611 0-.2383.0112-.0566 0-.1054.0415-.127.0976l-.3378 1.1744c-.1475.5068-.0918.9707.1543 1.3164.2256.3164.6055.498 1.0625.5195l1.8437.1133c.0557 0 .1055.0263.1329.0703.0283.043.0351.1074.0214.1562-.0283.084-.1132.1485-.204.1553l-1.921.1123c-1.041.0488-2.1582.8867-2.5527 1.914l-.1406.3585c-.0283.0713.0215.1416.0986.1416h6.5977c.0771 0 .1474-.0489.169-.126.1122-.4082.1757-.837.1757-1.2803 0-2.6025-2.125-4.727-4.7344-4.727\"/></svg>",tip:"<h4>Cloudflare</h4><div class=\"sub cf\">Edge network \u00b7 compute \u00b7 storage</div><div class=\"cols\"><div class=\"grp2\"><b>Workers</b><ul><li>One Worker fronts <code>gofarther.dev</code> and <code>*.gofarther.app</code>; every request is logged.</li></ul></div><div class=\"grp2\"><b>Workers for Platforms</b><ul><li>Each site is its own Worker script in a dispatch namespace; previews run separately from the live site.</li></ul></div><div class=\"grp2\"><b>R2</b><ul><li>Versioned builds with a <code>current</code> pointer, so publish and rollback are a pointer swap.</li><li>Page source, uploads (multipart for large media) and nightly database backups, newest 7 kept.</li></ul></div><div class=\"grp2\"><b>KV</b><ul><li>Edge cache of site lookups and API responses; idempotency keys stop double-submits.</li></ul></div><div class=\"grp2\"><b>Containers + Durable Objects</b><ul><li>Builds and edits run in an isolated container per job, 90 s lease, 50-minute deadline, with live progress streamed to the browser.</li></ul></div><div class=\"grp2\"><b>Queues + Cron</b><ul><li>Builds are queued (up to 250 concurrent); a 2-minute cron runs scheduled jobs, backups, domain checks and recovery.</li></ul></div><div class=\"grp2\"><b>SSL & domains</b><ul><li>Custom domains via Cloudflare for SaaS, with certificates issued and renewed automatically.</li></ul></div><div class=\"grp2\"><b>Turnstile + Email</b><ul><li>Bot checks on form writes, verified server-side; platform email via the <code>send_email</code> binding.</li></ul></div></div>"},{cls:"tech",name:"React 19",cap:"React",html:"<svg class=\"nm\" aria-hidden=\"true\" viewBox=\"0 0 24 24\" xmlns=\"http://www.w3.org/2000/svg\"><path fill=\"#149eca\" d=\"M14.23 12.004a2.236 2.236 0 0 1-2.235 2.236 2.236 2.236 0 0 1-2.236-2.236 2.236 2.236 0 0 1 2.235-2.236 2.236 2.236 0 0 1 2.236 2.236zm2.648-10.69c-1.346 0-3.107.96-4.888 2.622-1.78-1.653-3.542-2.602-4.887-2.602-.41 0-.783.093-1.106.278-1.375.793-1.683 3.264-.973 6.365C1.98 8.917 0 10.42 0 12.004c0 1.59 1.99 3.097 5.043 4.03-.704 3.113-.39 5. it does</b><ul><li>Designs the site schema, writes every page, runs edits and add-ons, and replies to you; it is the default Builder (<code>grok-4.6</code>).</li></ul></div><div class=\"grp2\"><b>How it's called</b><ul><li>Chat Completions API with tool calls; a forced <code>tool_choice</code> keeps structured output exact.</li></ul></div><div class=\"grp2\"><b>Effort</b><ul><li>The Effort picker sets <code>reasoning_effort</code> from low to extra high (default high).</li></ul></div><div class=\"grp2\"><b>Caching</b><ul><li>Requests are routed to the server holding their prompt cache via the <code>x-grok-conv-id</code> header.</li></ul></div></div>"},{cls:"ai",name:"Anthropic",cap:"Anthropic",html:"<svg class=\"nm\" aria-hidden=\"true\" viewBox=\"0 0 24 24\" xmlns=\"http://www.w3.org/2000/svg\"><path fill=\"#191919\" d=\"M17.3041 3.541h-3.6718l6.696 16.918H24Zm-10.6082 0L0 20.459h3.7442l1.3693-3.5527h7.0052l1.3693 3.5528h3.7442L10.5363 3.5409Zm-.3712 10.2232 2.2914-5.9456 2.2914 5.9456Z\"/></svg>",tip:"<h4>Anthropic \u00b7 Claude</h4><div class=\"sub\" style=\"color:#c15f3c\">Builder models \u00b7 research</div><div class=\"cols\"><div class=\"grp2\"><b>Models</b><ul><li>Claude Sonnet 5 and Claude Opus 5, selectable in the Builder menu; the chosen model runs design, pages, edits and add-ons.</li></ul></div><div class=\"grp2\"><b>How it's called</b><ul><li>Messages API with tool use for structured output.</li></ul></div><div class=\"grp2\"><b>Caching</b><ul><li>Prompt caching (<code>cache_control</code>) on system instructions and tool definitions, so repeat calls reuse context.</li></ul></div><div class=\"grp2\"><b>Research</b><ul><li>A research step on Claude Sonnet 5 uses the web search tool to gather facts about your business, whichever builder you pick.</li></ul></div></div>"},{cls:"ai",name:"Nano Banana Pro",cap:"Nano Banana Pro",html:"<svg class=\"nm\" aria-hidden=\"true\" viewBox=\"0 0 24 24\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"gmg\" x1=\"0\" y1=\"1\" x2=\"1\" y2=\"0\"><stop offset=\"0\" stop-color=\"#1c7df9\"/><stop offset=\".55\" stop-color=\"#8f6bf0\"/><stop offset=\"1\" stop-color=\"#e46b8f\"/></linearGradient></defs><path fill=\"url(#gmg)\" d=\"M11.04 19.32Q12 21.51 12 24q0-2.49.93-4.68.96-2.19 2.58-3.81t3.81-2.55Q21.51 12 24 12q-2.49 0-4.68-.93a12.3 12.3 0 0 1-3.81-2.58 12.3 12.3 0 0 1-2.58-3.81Q12 2.49 12 0q0 2.49-.96 4.68-.93 2.19-2.55 3.81a12.3 12.3 0 0 1-3.81 2.58Q2.49 12 0 12q2.49 0 4.68.96 2.19.93 3.81 2.55t2.55 3.81\"/></svg>",tip:"<h4>Nano Banana Pro</h4><div class=\"sub\" style=\"color:#6b5be0\">Google Gemini image model \u00b7 site photography</div><div class=\"cols\"><div class=\"grp2\"><b>What it does</b><ul><li>Generates site photographs: the design marks each image slot, and each one is generated at that slot\u2019s aspect ratio and swapped into the page.</li></ul></div><div class=\"grp2\"><b>How it\u2019s called</b><ul><li>Through fal\u2019s API as <code>fal-ai/nano-banana-pro</code>; results are stored in Supabase storage.</li></ul></div><div class=\"grp2\"><b>Status</b><ul><li>Image purchases are switched off right now, so new photos are not being generated.</li></ul></div></div>"},{cls:"expo",name:"Expo",cap:"Expo",html:"<svg class=\"nm\" aria-hidden=\"true\" viewBox=\"0 0 24 24\" xmlns=\"http://www.w3.org/2000/svg\"><path fill=\"#000020\" d=\"M0 20.084c.043.53.23 1.063.718 1.778.58.849 1.576 1.315 2.303.567.49-.505 5.794-9.776 8.35-13.29a.761.761 0 011.248 0c2.556 3.514 7.86 12.785 8.35 13.29.727.748 1.723.282 2.303-.567.57-.835.728-1.42.728-2.046 0-.426-8.26-15.798-9.092-17.078-.8-1.23-1.044-1.498-2.397-1.542h-1.032c-1.353.044-1.597.311-2.398 1.542C8.267 3.991.33 18.758 0 19.77Z\"/></svg>",tip:"<h4>Expo</h4><div class=\"sub\">React Native apps for iOS and Android · planned</div><div class=\"cols\"><div class=\"grp2\"><b>What it will do</b><ul><li>Turn your site into a native iPhone and Android app with React Native, and build and submit it to the App Store and Google Play.</li></ul></div><div class=\"grp2\"><b>Status</b><ul><li>Planned for the mobile app. Not part of today’s builds.</li></ul></div></div>"}];
function card(it){const sub=(it.tip.match(/class=\"sub[^>]*>([^<]*)</)||[])[1]||"";return `<div class="bc-top"><span class="bc-logo">${it.html}</span><div><h4>${it.name}</h4><div class="sub">${sub}</div></div></div><ul>${(BC[it.name]||[]).map(x=>`<li>${x}</li>`).join("")}</ul><div class="bc-more">${it.tip.replace(/^<h4>.*?<\/h4><div class=\"sub[^>]*>[^<]*<\/div>/,"")}</div><button type="button" class="bc-see">See more</button>`}const N=items.length;for(let i=0;i<N;i++){const c=document.createElement("div");c.className="chip";const it=items[i];
 if(it){c.classList.add("has",it.cls);c.innerHTML=it.html+(it.cap?`<span class="cap">${it.cap}</span>`:"");c.tabIndex=0;c.setAttribute("aria-label",it.name);
  const show=()=>{tip.classList.remove("open");tip.innerHTML=card(it);chips.forEach(x=>x.classList.toggle("sel",x===c))};

 else c.setAttribute("aria-hidden","true");o.appendChild(c);chips.push(c)}
const GF={"cls": "gf", "name": "Go Farther", "tip": "<h4>Go Farther</h4><div class=\"sub\">AI website and app builder</div><div class=\"cols\"><div class=\"grp2\"><b>Build</b><ul><li>Describe your business in chat; the builder designs the site, writes every page, checks that it compiles and renders, then publishes it.</li></ul></div><div class=\"grp2\"><b>Publish</b><ul><li>Live at <code>yourname.gofarther.app</code>, or on your own domain with certificates issued automatically.</li></ul></div><div class=\"grp2\"><b>Edit</b><ul><li>Change anything later by asking: text, data, layout, photos, the menu, whole pages. Every published version is kept, so a change can be rolled back.</li></ul></div><div class=\"grp2\"><b>Run</b><ul><li>Sites that need data get their own database. Bookings, orders and payments run on your own Stripe key.</li></ul></div></div>"};BC["Go Farther"]=["Describe your business; get a published website", "Live on yourname.gofarther.app or your own domain", "Change anything later by asking in chat", "Its own database, with payments on your own Stripe key"];GF.html=o.querySelector(".center").innerHTML;const showGF=()=>{tip.classList.remove("open");tip.innerHTML=card(GF);chips.forEach(x=>x.classList.remove("sel"))};showGF();const ctr=o.querySelector(".center");ctr.style.cursor="pointer";ctr.addEventListener("click",showGF);tip.addEventListener("click",e=>{const b=e.target.closest(".bc-see");if(!b)return;const open=tip.classList.toggle("open");b.textContent=open?"See less":"See more"});const R=!matchMedia("(prefers-reduced-motion: reduce)").matches;let t=Math.PI/2,paused=false;
function frame(){const W=o.clientWidth,H=o.clientHeight,T=Math.min(172,W*.145),rx=Math.min(W*.5-T*.62,760)-(W<700?T*.35:0),ry=H*.39,cx=W/2,cy=H*.48;
const M=720,L=[0];for(let j=1;j<=M;j++){const a0=(j-1)/M*Math.PI*2,a1=j/M*Math.PI*2;L.push(L[j-1]+Math.hypot(rx*(Math.cos(a1)-Math.cos(a0)),ry*(Math.sin(a1)-Math.sin(a0))))}const P=L[M],off=(t/(Math.PI*2))%1;const ang=u=>{u=((u%1)+1)%1*P;let lo=0,hi=M;while(hi-lo>1){const m=(lo+hi)>>1;L[m]<=u?lo=m:hi=m}return(lo+(u-L[lo])/((L[hi]-L[lo])||1))/M*Math.PI*2};
chips.forEach((c,i)=>{const a=ang(i/N+off),z=Math.sin(a),x=cx+Math.cos(a)*rx,y=cy+z*ry,k=.94+.1*(z+1)/2;
c.style.width=T+"px";c.style.padding=(T*.2)+"px";c.style.borderRadius=(T*.2)+"px";c.style.transform=`translate(${x-T/2}px,${y-T/2}px) scale(${k.toFixed(3)})`;c.style.zIndex=Math.round((z+1)*400);c.style.opacity=1});
if(R){t+=.0007;requestAnimationFrame(frame)}}frame();addEventListener("resize",()=>{if(!R)frame()})})</script>
